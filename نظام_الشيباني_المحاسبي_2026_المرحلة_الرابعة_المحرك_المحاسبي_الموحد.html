<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>نظام الشيباني المحاسبي 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}
.login{height:100%;display:grid;place-items:center;padding:20px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 15px 40px #0f172a18;padding:22px}
.logo{width:58px;height:58px;border-radius:18px;background:#eff6ff;color:#2563eb;display:grid;place-items:center;font-size:28px;margin:auto}
h1,h2,h3,p{margin:0}
.title{font-size:18px;font-weight:900;margin-top:10px;text-align:center}
.muted{color:#64748b;font-size:11px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:800;color:#334155}
.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#fff;outline:none;font-size:12px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
.btn{border:0;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:800}
.primary{background:#2563eb;color:#fff}.success{background:#059669;color:#fff}.danger{background:#dc2626;color:#fff}
.secondary{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}.warning{background:#d97706;color:#fff}
.header{height:58px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;flex-shrink:0}
.brand{font-weight:900;font-size:13px}.header small{font-size:9px;color:#cbd5e1}
.header-actions{display:flex;gap:6px;align-items:center}
.main{flex:1;min-height:0;display:flex;overflow:hidden}
.sidebar{width:225px;background:#fff;border-left:1px solid #e2e8f0;padding:8px;overflow-y:auto;flex-shrink:0}
.nav-title{font-size:10px;font-weight:900;color:#64748b;padding:9px 7px 5px}
.nav-btn{width:100%;border:0;background:#fff;text-align:right;padding:9px;border-radius:10px;font-size:11px;font-weight:800;color:#334155}
.nav-btn:hover{background:#eff6ff;color:#1d4ed8}
.content{flex:1;min-width:0;min-height:0;padding:10px;overflow:hidden}
.page{height:100%;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 3px 12px #0f172a0a;display:flex;flex-direction:column;overflow:hidden}
.page-head{padding:10px 12px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.page-title{font-size:13px;font-weight:900}.page-body{padding:10px;min-height:0;flex:1;overflow:auto}
.grid{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px}
.kpi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px}.kpi b{font-size:18px}.kpi span{display:block;color:#64748b;font-size:10px;margin-bottom:5px}
.module{border:1px solid #e2e8f0;background:#fff;border-radius:15px;padding:13px;text-align:right;display:flex;gap:10px;align-items:center}
.module .ico{font-size:23px}.module b{font-size:11px;display:block}.module small{font-size:9px;color:#64748b}
.module:hover{border-color:#93c5fd;background:#eff6ff}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.table-wrap{border:1px solid #e2e8f0;border-radius:12px;overflow:auto;max-height:100%;min-height:0}
table{width:100%;border-collapse:collapse;min-width:720px;font-size:10px}
th{background:#f1f5f9;position:sticky;top:0;z-index:1;font-weight:900}
th,td{padding:8px;border-bottom:1px solid #f1f5f9;text-align:right;white-space:nowrap}
td .btn{padding:5px 7px;font-size:9px}
.empty{text-align:center!important;color:#94a3b8;padding:28px}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.form-grid .wide{grid-column:span 2}
.actions{display:flex;gap:6px;justify-content:flex-start;flex-wrap:wrap}
.toast{position:fixed;bottom:16px;left:16px;z-index:99;background:#0f172a;color:#fff;padding:11px 14px;border-radius:12px;font-size:11px;box-shadow:0 10px 30px #0003;opacity:0;transform:translateY(10px);transition:.2s}
.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:#0f172a80;display:grid;place-items:center;padding:15px;z-index:50}
.modal-card{width:min(850px,100%);max-height:92vh;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:12px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;font-size:12px;font-weight:900}
.modal-body{padding:12px;overflow:auto}
.pos{height:100%;display:grid;grid-template-columns:1.6fr 1fr;gap:9px}
.pos-products,.pos-cart{min-height:0;border:1px solid #e2e8f0;border-radius:14px;padding:9px;display:flex;flex-direction:column;overflow:hidden}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;overflow:auto;padding:2px}
.product{border:1px solid #e2e8f0;border-radius:11px;background:#fff;padding:9px;text-align:right}
.product b{display:block;font-size:10px}.product span{display:block;color:#2563eb;font-size:9px;margin-top:4px}.product em{font-style:normal;color:#64748b;font-size:8px}
.pos-cart-list{overflow:auto;flex:1}.pos-total{border-top:1px solid #e2e8f0;padding-top:8px;margin-top:8px}
.stat{display:flex;justify-content:space-between;font-size:11px;padding:5px 0}.big-total{font-size:18px;font-weight:900;color:#059669}
@media(max-width:900px){
 .sidebar{width:175px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pos{grid-template-columns:1fr}.pos-products{min-height:48%}.pos-cart{min-height:48%}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:620px){
 .sidebar{position:absolute;right:0;top:58px;bottom:0;width:230px;z-index:20;transform:translateX(105%);transition:.2s;box-shadow:-8px 0 25px #0002}
 .sidebar.open{transform:none}.content{padding:7px}.g2,.g3,.g4{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}
 .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.header{height:52px}.page-head{padding:8px}.page-body{padding:8px}
}

/* المرحلة الثانية: حماية العرض ومنع التداخل والقطع */
.page-body{overflow:hidden}
.screen-layout{height:100%;min-height:0;display:flex;flex-direction:column;gap:9px}
.screen-scroll{min-height:0;flex:1;overflow:auto}
.form-card{flex-shrink:0}
.table-wrap{flex:1;min-height:0;overflow:auto}
@media(max-width:620px){.page-title{font-size:12px}.page-head .btn{padding:7px 8px}.toolbar{flex-wrap:wrap}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">📊</div>
    <div class="title">نظام الشيباني المحاسبي 2026</div>
    <p class="muted" style="text-align:center;margin-top:5px">نسخة محلية تنفيذية تعمل بقاعدة بيانات IndexedDB</p>
    <form id="loginForm" style="margin-top:18px;display:grid;gap:10px">
      <div class="field"><label>اسم المستخدم</label><input id="loginUser" value="admin" required></div>
      <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" value="1234" required></div>
      <button class="btn primary">دخول النظام</button>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="header">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn secondary" onclick="toggleSidebar()" style="padding:6px 9px">☰</button>
      <div><div class="brand">نظام الشيباني المحاسبي</div><small>السنة المالية 2026 · العملة الأساسية SAR</small></div>
    </div>
    <div class="header-actions">
      <button class="btn secondary" onclick="loadPage('dashboard')">الرئيسية</button>
      <button class="btn danger" onclick="logout()">خروج</button>
    </div>
  </header>
  <div class="main">
    <aside id="sidebar" class="sidebar">
      <div class="nav-title">الرئيسية</div>
      <button class="nav-btn" onclick="loadPage('dashboard')">🏠 لوحة المؤشرات</button>
      <button class="nav-btn" onclick="loadPage('pos')">🧾 نقطة البيع POS</button>
      <div class="nav-title">المخزون</div>
      <button class="nav-btn" onclick="loadPage('items')">📦 بطاقة الأصناف</button>
      <button class="nav-btn" onclick="loadPage('warehouses')">🏬 المخازن والمستودعات</button>
      <button class="nav-btn" onclick="loadPage('stockmoves')">🔄 حركة المخزون</button>
      <button class="nav-btn" onclick="loadPage('stockcount')">📋 الجرد والتسويات</button>
      <div class="nav-title">إدارة المبيعات</div>
      <button class="nav-btn" onclick="loadPage('sales')">💰 لوحة إدارة المبيعات</button>
      <button class="nav-btn" onclick="loadPage('customers')">👥 العملاء</button>
      <button class="nav-btn" onclick="loadPage('salesInvoices')">🧾 فواتير المبيعات</button>
      <button class="nav-btn" onclick="loadPage('salesOrders')">📋 أوامر البيع</button>
      <button class="nav-btn" onclick="loadPage('salesReturns')">↩️ مرتجعات المبيعات</button>
      <button class="nav-btn" onclick="loadPage('salesPayments')">💵 التحصيلات</button>
      <button class="nav-btn" onclick="loadPage('quotations')">📄 عروض الأسعار</button>
      <button class="nav-btn" onclick="loadPage('discounts')">🏷️ الخصومات</button>
      <button class="nav-btn" onclick="loadPage('salesReports')">📊 تقارير المبيعات</button>
      <div class="nav-title">المشتريات</div>
      <button class="nav-btn" onclick="loadPage('suppliers')">🚚 الموردون</button>
      <button class="nav-btn" onclick="loadPage('purchases')">🛒 فواتير المشتريات</button>
      <button class="nav-btn" onclick="loadPage('purchaseOrders')">📋 أوامر الشراء</button>
      <button class="nav-btn" onclick="loadPage('purchaseReturns')">↩️ مرتجعات المشتريات</button>
      <button class="nav-btn" onclick="loadPage('purchasePayments')">💳 مدفوعات الموردين</button>
      <div class="nav-title">الحسابات والخزينة</div>
      <button class="nav-btn" onclick="loadPage('accounts')">🌳 دليل الحسابات</button>
      <button class="nav-btn" onclick="loadPage('journal')">📝 القيود اليومية</button>
      <button class="nav-btn" onclick="loadPage('receipts')">📥 سندات القبض</button>
      <button class="nav-btn" onclick="loadPage('payments')">📤 سندات الصرف</button>
      <button class="nav-btn" onclick="loadPage('ledger')">📒 دفتر الأستاذ</button>
      <button class="nav-btn" onclick="loadPage('trial')">⚖️ ميزان المراجعة</button>
      <button class="nav-btn" onclick="loadPage('statement')">🔎 كشف حساب</button>
      <div class="nav-title">التقارير والإعدادات</div>
      <button class="nav-btn" onclick="loadPage('reports')">📈 التقارير العامة</button>
      <button class="nav-btn" onclick="loadPage('inventoryReport')">📦 تقرير المخزون</button>
      <button class="nav-btn" onclick="loadPage('profitLoss')">📉 الأرباح والخسائر</button>
      <button class="nav-btn" onclick="loadPage('balanceSheet')">🏛️ الميزانية العمومية</button>
      <button class="nav-btn" onclick="loadPage('audit')">🧾 سجل العمليات</button>
      <button class="nav-btn" onclick="loadPage('company')">🏢 إعدادات المنشأة</button>
      <button class="nav-btn" onclick="loadPage('users')">🔐 المستخدمون والصلاحيات</button>
      <button class="nav-btn" onclick="loadPage('backup')">💾 النسخ الاحتياطي والاستعادة</button>
      <button class="nav-btn" onclick="loadPage('guide')">📘 تعليمات النظام</button>
    </aside>
    <main id="content" class="content"></main>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"></div>

<script>
'use strict';
const DB_NAME='SheibaniAccounting2026', DB_VERSION=3, BASE_CURRENCY='SAR';
const STORES=['company','users','items','warehouses','customers','suppliers','salesInvoices','salesOrders','salesReturns','salesPayments','quotations','discounts','purchaseInvoices','purchaseReturns','purchasePayments','journal','receipts','payments','accounts','notes','stockMoves','purchaseOrders','auditLog'];
let db=null, currentPage='dashboard', posCart=[];

const seed={
 company:[{id:1,name:'منشأة الشيباني التجارية',taxNo:'',address:'',phone:'',currency:'SAR'}],
 users:[{id:1,username:'admin',fullname:'مدير النظام',role:'مدير',status:'نشط',password:'1234'}],
 items:[
  {id:1,code:'ITM-001',barcode:'100001',name:'قميص رجالي',unit:'قطعة',qty:100,cost:25,price:40,category:'ملابس',warehouseId:1,status:'نشط'},
  {id:2,code:'ITM-002',barcode:'100002',name:'بنطلون رجالي',unit:'قطعة',qty:70,cost:35,price:55,category:'ملابس',warehouseId:1,status:'نشط'},
  {id:3,code:'ITM-003',barcode:'100003',name:'دواء تجريبي',unit:'علبة',qty:50,cost:12,price:20,category:'صيدلية',warehouseId:1,status:'نشط'}
 ],
 warehouses:[{id:1,code:'WH-001',name:'المخزن الرئيسي',location:'المقر الرئيسي',manager:'مدير المخزن',status:'نشط'}],
 customers:[{id:1,code:'CUS-001',name:'عميل نقدي',phone:'',address:'',balance:0,status:'نشط'}],
 suppliers:[{id:1,code:'SUP-001',name:'مورد عام',phone:'',address:'',balance:0,status:'نشط'}],
 salesInvoices:[],salesOrders:[],salesReturns:[],salesPayments:[],quotations:[],discounts:[],
 purchaseInvoices:[],purchaseReturns:[],purchasePayments:[],journal:[],receipts:[],payments:[],
 accounts:[
  {id:1,code:'1100',name:'الصندوق',type:'أصل',parentId:null},
  {id:2,code:'1200',name:'البنك',type:'أصل',parentId:null},
  {id:3,code:'1300',name:'العملاء',type:'أصل',parentId:null},
  {id:4,code:'1400',name:'المخزون',type:'أصل',parentId:null},
  {id:5,code:'2100',name:'الموردون',type:'التزام',parentId:null},
  {id:6,code:'4100',name:'المبيعات',type:'إيراد',parentId:null},
  {id:7,code:'5100',name:'تكلفة المبيعات',type:'مصروف',parentId:null}
 ],
 notes:[],stockMoves:[],purchaseOrders:[],auditLog:[]
};

function openDB(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})})};
  req.onsuccess=e=>{db=e.target.result;resolve()};
  req.onerror=()=>reject(req.error);
 });
}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function all(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function get(store,id){return new Promise((res,rej)=>{const r=tx(store).get(Number(id));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function add(store,obj){return new Promise((res,rej)=>{const r=tx(store,'readwrite').add(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function remove(store,id){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(Number(id));r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function count(store){return (await all(store)).length}
async function seedDB(){
 for(const s of STORES){if(await count(s)===0 && seed[s]) for(const row of seed[s]) await add(s,row)}
}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)+' SAR';
const num=v=>Number(v)||0;
const today=()=>new Date().toISOString().slice(0,10);
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.style.background=type==='error'?'#dc2626':type==='warning'?'#d97706':'#0f172a';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open')}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;const users=await all('users');const ok=users.some(x=>x.username===u&&x.password===p&&x.status==='نشط');if(!ok)return toast('بيانات الدخول غير صحيحة','error');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadPage('dashboard')};

function shell(title,body,actions=''){
 return `<div class="page"><div class="page-head"><div style="display:flex;align-items:center;gap:7px"><button class="btn secondary" onclick="loadPage('dashboard')">↩ رجوع</button><div class="page-title">${title}</div></div><div class="actions">${actions}</div></div><div class="page-body">${body}</div></div>`;
}
async function loadPage(page){
 currentPage=page;closeSidebar();
 const c=document.getElementById('content');
 try{
  if(page==='dashboard')return renderDashboard();
  if(page==='pos')return renderPOS();
  if(page==='items')return renderItems();
  if(page==='warehouses')return renderWarehouses();
  if(page==='stockmoves')return renderStockMoves();
  if(page==='stockcount')return renderStockCount();
  if(page==='sales')return renderSales();
  if(page==='customers')return renderCustomers();
  if(page==='salesInvoices')return renderSalesInvoices();
  if(page==='salesOrders')return renderSimpleCRUD('أوامر البيع','salesOrders');
  if(page==='salesReturns')return renderReturns('مرتجعات المبيعات','salesReturns',-1);
  if(page==='salesPayments')return renderPayments('التحصيلات','salesPayments','customer');
  if(page==='quotations')return renderSimpleCRUD('عروض الأسعار','quotations');
  if(page==='discounts')return renderDiscounts();
  if(page==='salesReports')return renderSalesReports();
  if(page==='suppliers')return renderSuppliers();
  if(page==='purchases')return renderPurchases();
  if(page==='purchaseReturns')return renderReturns('مرتجعات المشتريات','purchaseReturns',1);
  if(page==='purchasePayments')return renderPayments('مدفوعات الموردين','purchasePayments','supplier');
  if(page==='accounts')return renderAccounts();
  if(page==='journal')return renderJournal();
  if(page==='receipts')return renderTreasury('سندات القبض','receipts',1);
  if(page==='payments')return renderTreasury('سندات الصرف','payments',-1);
  if(page==='ledger')return renderLedger();
  if(page==='trial')return renderTrial();
  if(page==='reports')return renderReports();
  if(page==='company')return renderCompany();
  if(page==='users')return renderUsers();
  if(page==='backup')return renderBackup();
  if(page==='guide')return renderGuide();
 }catch(e){console.error(e);c.innerHTML=shell('خطأ',`<div class="card"><b>حدث خطأ في الشاشة</b><p class="muted" style="margin-top:7px">${esc(e.message)}</p></div>`)}
}

async function renderDashboard(){
 const items=await all('items'), inv=await all('salesInvoices'), pur=await all('purchaseInvoices'), cust=await all('customers');
 const sales=inv.reduce((a,x)=>a+num(x.total),0), purchases=pur.reduce((a,x)=>a+num(x.total),0), stock=items.reduce((a,x)=>a+num(x.qty)*num(x.cost),0);
 document.getElementById('content').innerHTML=shell('لوحة المؤشرات الرئيسية',
 `<div class="grid g4">
  <div class="kpi"><span>إجمالي المبيعات</span><b>${money(sales)}</b></div>
  <div class="kpi"><span>إجمالي المشتريات</span><b>${money(purchases)}</b></div>
  <div class="kpi"><span>قيمة المخزون بالتكلفة</span><b>${money(stock)}</b></div>
  <div class="kpi"><span>عدد العملاء</span><b>${cust.length}</b></div>
 </div>
 <div style="margin-top:10px" class="grid g3">
  ${module('🧾','نقطة البيع','بيع فوري وترحيل المخزون',"loadPage('pos')")}
  ${module('💰','إدارة المبيعات','الفواتير والتحصيلات والمرتجعات',"loadPage('sales')")}
  ${module('📦','المخزون','الأصناف والمخازن والجرد',"loadPage('items')")}

async function invoiceForm(kind='sale'){
 const isSale=kind==='sale', parties=await all(isSale?'customers':'suppliers'), items=await all('items');
 const title=isSale?'فاتورة مبيعات جديدة':'فاتورة مشتريات جديدة';
 document.getElementById('modal').classList.remove('hidden');
 document.getElementById('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><span>${title}</span><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="modal-body">
 <form id="invoiceForm"><div class="form-grid">
 <div class="field"><label>التاريخ</label><input id="fDate" type="date" value="${today()}"></div>
 <div class="field"><label>${isSale?'العميل':'المورد'}</label><select id="fParty">${parties.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
 <div class="field"><label>طريقة الدفع</label><select id="fPay"><option>نقدي</option><option>آجل</option><option>بنك</option></select></div>
 <div class="field"><label>المخزن</label><select id="fWh">${(await all('warehouses')).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div></div>
 <div class="card" style="margin-top:9px"><div class="actions"><button type="button" class="btn secondary" onclick="addInvoiceLine()">➕ إضافة صنف</button></div><div id="invoiceLines" style="margin-top:8px"></div></div>
 <div class="form-grid" style="margin-top:9px"><div class="field"><label>الخصم SAR</label><input id="fDiscount" type="number" value="0" step=".01" oninput="recalcInvoice()"></div><div class="field"><label>الضريبة SAR</label><input id="fTax" type="number" value="0" step=".01" oninput="recalcInvoice()"></div><div class="field"><label>المدفوع SAR</label><input id="fPaid" type="number" value="0" step=".01" oninput="recalcInvoice()"></div><div class="field"><label>الإجمالي SAR</label><input id="fTotal" readonly value="0"></div></div>
 <div id="invoiceSummary" class="card" style="margin-top:8px"></div>
 <div class="actions" style="margin-top:9px"><button class="btn success">حفظ وترحيل الفاتورة</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div>
 </form></div></div>`;
 window.invoiceKind=kind;window.invoiceLines=[];
 addInvoiceLine();

async function addInvoiceLine(){
 const items=await all('items');window.invoiceLines.push({itemId:items[0]?.id||0,qty:1,price:items[0]?.price||0});
 renderInvoiceLines();
}
async function renderInvoiceLines(){
 const items=await all('items');
 document.getElementById('invoiceLines').innerHTML=window.invoiceLines.map((l,i)=>`<div class="grid g4" style="margin-bottom:6px;align-items:end">
 <div class="field"><label>الصنف</label><select onchange="lineChange(${i},'itemId',this.value)">${items.map(x=>`<option value="${x.id}" ${x.id===l.itemId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
 <div class="field"><label>الكمية</label><input type="number" min=".001" step=".001" value="${l.qty}" onchange="lineChange(${i},'qty',this.value)"></div>
 <div class="field"><label>السعر SAR</label><input type="number" min="0" step=".01" value="${l.price}" onchange="lineChange(${i},'price',this.value)"></div>
 <div class="actions"><button type="button" class="btn danger" onclick="removeInvoiceLine(${i})">حذف</button></div></div>`).join('');
 recalcInvoice();
}
async function lineChange(i,k,v){window.invoiceLines[i][k]=k==='itemId'?num(v):num(v);if(k==='itemId'){const x=await get('items',v);window.invoiceLines[i].price=invoiceKind==='sale'?num(x?.price):num(x?.cost)}renderInvoiceLines()}
function removeInvoiceLine(i){window.invoiceLines.splice(i,1);renderInvoiceLines()}
function recalcInvoice(){const sub=window.invoiceLines.reduce((a,x)=>a+num(x.qty)*num(x.price),0),d=num(document.getElementById('fDiscount')?.value),tax=num(document.getElementById('fTax')?.value),total=Math.max(0,sub-d+tax),paid=num(document.getElementById('fPaid')?.value);if(document.getElementById('fTotal'))document.getElementById('fTotal').value=total.toFixed(2);if(document.getElementById('invoiceSummary'))document.getElementById('invoiceSummary').innerHTML=`<div class="stat"><span>الإجمالي قبل الخصم</span><b>${money(sub)}</b></div><div class="stat"><span>الصافي</span><b>${money(total)}</b></div><div class="stat"><span>المتبقي</span><b>${money(Math.max(0,total-paid))}</b></div>`}
async function saveInvoice(e,kind){
 e.preventDefault();if(!window.invoiceLines.length)return toast('أضف صنفًا واحدًا على الأقل','error');
 const isSale=kind==='sale', store=isSale?'salesInvoices':'purchaseInvoices', partyStore=isSale?'customers':'suppliers';
 const partyId=num(fParty.value), date=fDate.value, payment=fPay.value, warehouseId=num(fWh.value);
 const sub=window.invoiceLines.reduce((a,x)=>a+num(x.qty)*num(x.price),0), discount=num(fDiscount.value),tax=num(fTax.value),total=Math.max(0,sub-discount+tax),paid=num(fPaid.value),remaining=Math.max(0,total-paid);
 const items=await all('items');
 for(const l of window.invoiceLines){const it=items.find(x=>x.id===l.itemId);if(!it)return toast('صنف غير موجود','error');if(isSale&&num(it.qty)<num(l.qty))return toast(`المخزون غير كافٍ للصنف: ${it.name}`,'error')}
 const inv={code:(isSale?'SINV-':'PINV-')+Date.now(),date,partyId,warehouseId,payment,lines:window.invoiceLines.map(x=>({...x})),subtotal:sub,discount,tax,total,paid,remaining,currency:'SAR',status:'مرحل'};
 await add(store,inv);
 for(const l of window.invoiceLines){const it=items.find(x=>x.id===l.itemId);it.qty+=isSale?-num(l.qty):num(l.qty);await put('items',it);await add('stockMoves',{date,type:isSale?'بيع':'شراء',itemId:it.id,qty:isSale?-num(l.qty):num(l.qty),ref:inv.code})}
 const party=await get(partyStore,partyId);if(party){party.balance+=isSale?remaining:-remaining;await put(partyStore,party)}
 await postJournalForInvoice(inv,isSale);
 closeModal();toast('تم حفظ وترحيل الفاتورة بنجاح');loadPage(isSale?'salesInvoices':'purchases');
}
async function postJournalForInvoice(inv,isSale){
 const cashAccount=isSale?(inv.payment==='بنك'?2:1):(inv.payment==='بنك'?2:1);
 const partyAccount=isSale?3:5, salesAccount=isSale?6:4, costAccount=7;
 let lines=[];
 if(isSale){
  lines=[{accountId:cashAccount,debit:inv.paid,credit:0},{accountId:partyAccount,debit:inv.remaining,credit:0},{accountId:salesAccount,debit:0,credit:inv.total}];
 }else{
  lines=[{accountId:4,debit:inv.total,credit:0},{accountId:cashAccount,debit:inv.paid,credit:0},{accountId:partyAccount,debit:0,credit:inv.remaining}];
 }
 await add('journal',{code:'JV-'+Date.now(),date:inv.date,source:inv.code,description:isSale?'ترحيل فاتورة مبيعات':'ترحيل فاتورة مشتريات',lines,totalDebit:lines.reduce((a,x)=>a+x.debit,0),totalCredit:lines.reduce((a,x)=>a+x.credit,0)});
}

function posProduct(x){return `<button class="product" data-name="${esc((x.name+' '+x.barcode).toLowerCase())}" onclick="posAdd(${x.id})"><b>${esc(x.name)}</b><span>${money(x.price)}</span><em>المتاح: ${num(x.qty)} · ${esc(x.barcode)}</em></button>`}
async function filterPOS(){const q=(posSearch.value||'').toLowerCase();document.querySelectorAll('.product').forEach(b=>b.style.display=b.dataset.name.includes(q)?'':'none')}
async function posAdd(id){const it=await get('items',id);if(!it)return;if(num(it.qty)<=0)return toast('الصنف غير متوفر في المخزون','error');const x=posCart.find(a=>a.id===id);if(x){if(x.qty+1>it.qty)return toast('الكمية تتجاوز المخزون','error');x.qty++}else posCart.push({id,name:it.name,price:num(it.price),qty:1});renderPOS()}

async function checkoutPOS(){if(!posCart.length)return toast('السلة فارغة','error');const customerId=num(document.getElementById('posCustomer')?.value)||1;const payment=document.getElementById('posPay')?.value||'نقدي';const total=posCart.reduce((a,x)=>a+x.qty*x.price,0);const items=await all('items');for(const x of posCart){const it=items.find(i=>i.id===x.id);if(!it||it.qty<x.qty)return toast('المخزون غير كافٍ','error')}const inv={code:'POS-'+Date.now(),date:today(),partyId:customerId,warehouseId:1,payment,lines:posCart.map(x=>({itemId:x.id,qty:x.qty,price:x.price})),subtotal:total,discount:0,tax:0,total,paid:payment==='آجل'?0:total,remaining:payment==='آجل'?total:0,currency:'SAR',status:'مرحل'};await add('salesInvoices',inv);for(const x of posCart){const it=items.find(i=>i.id===x.id);it.qty-=x.qty;await put('items',it);await add('stockMoves',{date:today(),type:'POS بيع',itemId:it.id,qty:-x.qty,ref:inv.code})}const c=await get('customers',customerId);if(c&&inv.remaining){c.balance+=inv.remaining;await put('customers',c)}await postJournalForInvoice(inv,true);posCart=[];toast('تم ترحيل فاتورة POS');printInvoice(inv.code)}

async function restore(e){const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj?.stores||typeof obj.stores!=='object')throw Error('صيغة النسخة غير صحيحة');for(const s of STORES){const rows=Array.isArray(obj.stores[s])?obj.stores[s]:[];const old=await all(s);for(const x of old)await remove(s,x.id);for(const x of rows)await put(s,x)}toast('تمت الاستعادة بنجاح');loadPage('dashboard')}catch(err){toast('فشل الاستعادة: '+err.message,'error')}}

async function savePurchaseOrder(e){
  e.preventDefault();
  const obj={
    code:poCode.value.trim(), date:poDate.value, supplierId:num(poSupplier.value),
    total:num(poTotal.value), notes:poNotes.value.trim(), status:'مفتوح'
  };
  if(!obj.code||!obj.supplierId||obj.total<=0) return toast('أكمل بيانات أمر الشراء بشكل صحيح','error');
  const exists=(await all('purchaseOrders')).some(x=>x.code===obj.code);
  if(exists) return toast('رقم أمر الشراء مستخدم مسبقًا','error');
  await add('purchaseOrders',obj); await audit('إنشاء أمر شراء',obj.code);
  toast('تم حفظ أمر الشراء'); loadPage('purchaseOrders');
}

async function changePurchaseOrderStatus(id){
  const o=await get('purchaseOrders',id); if(!o) return;
  const next={'مفتوح':'معتمد','معتمد':'مكتمل','مكتمل':'مغلق','مغلق':'مفتوح'}[o.status]||'مفتوح';
  if(!confirm(`تغيير حالة الأمر من "${o.status}" إلى "${next}"؟`)) return;
  o.status=next; await put('purchaseOrders',o); await audit('تحديث أمر شراء',`${o.code} → ${next}`);
  toast('تم تحديث الحالة'); renderPurchaseOrders();
}
async function deletePurchaseOrder(id){
  const o=await get('purchaseOrders',id); if(!o) return;
  if(!confirm('هل تريد حذف أمر الشراء؟')) return;
  await remove('purchaseOrders',id); await audit('حذف أمر شراء',o.code);
  toast('تم حذف أمر الشراء'); renderPurchaseOrders();
}

function accountSums(journal){
  const sums={};
  journal.forEach(v=>(v.lines||[]).forEach(l=>{
    sums[l.accountId]??={debit:0,credit:0};
    sums[l.accountId].debit+=num(l.debit); sums[l.accountId].credit+=num(l.credit);
  }));
  return sums;
}

/* =========================
   المرحلة الرابعة: المحرك المحاسبي الموحد
   إصلاح وترحيل مركزي دون حذف وظائف المرحلة الثالثة
========================= */

const ACCOUNTING_ENGINE_VERSION='4.0';

/* الحسابات المرجعية الموحدة */
const ACCOUNT_CODES={
  CASH:'1100', BANK:'1200', AR:'1300', INVENTORY:'1400',
  AP:'2100', EQUITY:'3100', SALES:'4100', SALES_RETURNS:'4200',
  COGS:'5100', PURCHASE_RETURNS:'5200', INVENTORY_ADJUSTMENT:'5300',
  DISCOUNTS:'5400', TAX_PAYABLE:'2200', TAX_RECEIVABLE:'1500'
};

async function ensureAccountingAccounts(){
  const required=[
    {code:'1100',name:'الصندوق',type:'أصل'},
    {code:'1200',name:'البنك',type:'أصل'},
    {code:'1300',name:'العملاء - حساب تحكم',type:'أصل'},
    {code:'1400',name:'المخزون',type:'أصل'},
    {code:'1500',name:'ضريبة القيمة المضافة - مدخلات',type:'أصل'},
    {code:'2100',name:'الموردون - حساب تحكم',type:'التزام'},
    {code:'2200',name:'ضريبة القيمة المضافة - مخرجات',type:'التزام'},
    {code:'3100',name:'رأس المال وحقوق الملكية',type:'حقوق ملكية'},
    {code:'4100',name:'المبيعات',type:'إيراد'},
    {code:'4200',name:'مردودات المبيعات',type:'إيراد'},
    {code:'5100',name:'تكلفة البضاعة المباعة',type:'مصروف'},
    {code:'5200',name:'مردودات المشتريات',type:'مصروف'},
    {code:'5300',name:'فروقات وتسويات المخزون',type:'مصروف'},
    {code:'5400',name:'خصومات المبيعات',type:'مصروف'}
  ];
  const accounts=await all('accounts');
  for(const r of required){
    const old=accounts.find(a=>a.code===r.code);
    if(!old) await add('accounts',{...r,parentId:null,status:'نشط',system:true});
  }
}

async function accountIdByCode(code){
  const accounts=await all('accounts');
  const a=accounts.find(x=>x.code===code);
  if(!a) throw new Error('الحساب المرجعي غير موجود: '+code);
  return a.id;
}

function normalizeJournalLines(lines){
  return (lines||[]).map(l=>({
    accountId:num(l.accountId),
    debit:Math.max(0,num(l.debit)),
    credit:Math.max(0,num(l.credit)),
    note:String(l.note||'')
  })).filter(l=>l.accountId && (l.debit>0 || l.credit>0));
}

function validateJournalLines(lines){
  const clean=normalizeJournalLines(lines);
  if(clean.length<2) throw new Error('القيد يجب أن يحتوي على طرفين محاسبيين على الأقل');
  if(clean.some(l=>l.debit>0 && l.credit>0)) throw new Error('لا يمكن أن يكون السطر مدينًا ودائنًا في الوقت نفسه');
  const debit=clean.reduce((s,l)=>s+l.debit,0);
  const credit=clean.reduce((s,l)=>s+l.credit,0);
  if(debit<=0 || credit<=0) throw new Error('يجب أن يحتوي القيد على مبالغ مدينة ودائنة');
  if(Math.abs(debit-credit)>0.009) throw new Error(`القيد غير متوازن: المدين ${debit.toFixed(2)} والدائن ${credit.toFixed(2)}`);
  return {lines:clean,totalDebit:+debit.toFixed(2),totalCredit:+credit.toFixed(2)};
}

async function postAccountingEntry({date=today(),source='',description='',lines=[],module='',allowDuplicate=false}={}){
  await ensureAccountingAccounts();
  const check=validateJournalLines(lines);
  const journal=await all('journal');
  if(source && !allowDuplicate && journal.some(j=>j.source===source && j.engine==='unified')){
    return journal.find(j=>j.source===source && j.engine==='unified');
  }
  const entry={
    code:'JV-'+Date.now()+'-'+Math.floor(Math.random()*1000),
    date,source,description,
    lines:check.lines,totalDebit:check.totalDebit,totalCredit:check.totalCredit,
    module,status:'مرحل',engine:'unified',engineVersion:ACCOUNTING_ENGINE_VERSION,
    createdAt:new Date().toISOString()
  };
  await add('journal',entry);
  if(typeof logAudit==='function') await logAudit('ترحيل قيد محاسبي موحد',`${source||entry.code} | ${description} | مدين=${entry.totalDebit} دائن=${entry.totalCredit}`);
  return entry;
}

async function calculateInvoiceCost(lines){
  const items=await all('items');
  return (lines||[]).reduce((sum,l)=>{
    const it=items.find(x=>x.id===num(l.itemId));
    return sum + num(l.qty)*num(it?.cost);
  },0);
}

async function postJournalForInvoice(inv,isSale){
  await ensureAccountingAccounts();
  const cash=isSale ? (inv.payment==='بنك'?ACCOUNT_CODES.BANK:ACCOUNT_CODES.CASH) : (inv.payment==='بنك'?ACCOUNT_CODES.BANK:ACCOUNT_CODES.CASH);
  const cashId=await accountIdByCode(cash);
  const arId=await accountIdByCode(ACCOUNT_CODES.AR);
  const apId=await accountIdByCode(ACCOUNT_CODES.AP);
  const salesId=await accountIdByCode(ACCOUNT_CODES.SALES);
  const inventoryId=await accountIdByCode(ACCOUNT_CODES.INVENTORY);
  const cogsId=await accountIdByCode(ACCOUNT_CODES.COGS);
  const taxPayableId=await accountIdByCode(ACCOUNT_CODES.TAX_PAYABLE);
  const taxReceivableId=await accountIdByCode(ACCOUNT_CODES.TAX_RECEIVABLE);
  const discountId=await accountIdByCode(ACCOUNT_CODES.DISCOUNTS);

  if(isSale){
    const revenue=num(inv.subtotal)-num(inv.discount);
    const lines=[
      {accountId:cashId,debit:num(inv.paid),credit:0},
      {accountId:arId,debit:num(inv.remaining),credit:0},
      {accountId:salesId,debit:0,credit:revenue},
    ];
    if(num(inv.tax)>0) lines.push({accountId:taxPayableId,debit:0,credit:num(inv.tax)});
    if(num(inv.discount)>0) lines.push({accountId:discountId,debit:num(inv.discount),credit:0});
    await postAccountingEntry({
      date:inv.date,source:inv.code,description:'ترحيل فاتورة مبيعات',
      lines,module:'SALES'
    });

    const cost=await calculateInvoiceCost(inv.lines);
    if(cost>0){
      await postAccountingEntry({
        date:inv.date,source:inv.code+'-COGS',description:'إثبات تكلفة البضاعة المباعة',
        lines:[
          {accountId:cogsId,debit:cost,credit:0},
          {accountId:inventoryId,debit:0,credit:cost}
        ],module:'INVENTORY'
      });
    }
  }else{
    const net=num(inv.subtotal)-num(inv.discount);
    const lines=[
      {accountId:inventoryId,debit:net,credit:0},
      {accountId:cashId,debit:0,credit:num(inv.paid)},
      {accountId:apId,debit:0,credit:num(inv.remaining)}
    ];
    if(num(inv.tax)>0) lines.push({accountId:taxReceivableId,debit:num(inv.tax),credit:0});
    if(num(inv.discount)>0){
      // الخصم يخفض تكلفة الشراء بالفعل عبر صافي المخزون
    }
    await postAccountingEntry({
      date:inv.date,source:inv.code,description:'ترحيل فاتورة مشتريات',
      lines,module:'PURCHASES'
    });
  }
}

async function postPartyPaymentJournal({date,source,type,amount,payment='نقدي',description=''}) {
  await ensureAccountingAccounts();
  const cashId=await accountIdByCode(payment==='بنك'?ACCOUNT_CODES.BANK:ACCOUNT_CODES.CASH);
  const partyId=await accountIdByCode(type==='customer'?ACCOUNT_CODES.AR:ACCOUNT_CODES.AP);
  const lines=type==='customer'
    ? [{accountId:cashId,debit:amount,credit:0},{accountId:partyId,debit:0,credit:amount}]
    : [{accountId:partyId,debit:amount,credit:0},{accountId:cashId,debit:0,credit:amount}];
  return postAccountingEntry({date,source,description:description||(type==='customer'?'تحصيل من عميل':'سداد لمورد'),lines,module:'TREASURY'});
}

async function postInventoryAdjustmentJournal({date,source,itemId,diff,unitCost,description='تسوية مخزون'}){
  if(!diff) return;
  await ensureAccountingAccounts();
  const inventoryId=await accountIdByCode(ACCOUNT_CODES.INVENTORY);
  const adjustmentId=await accountIdByCode(ACCOUNT_CODES.INVENTORY_ADJUSTMENT);
  const value=Math.abs(num(diff)*num(unitCost));
  if(value<=0) return;
  const increase=diff>0;
  return postAccountingEntry({
    date,source,description,
    lines:increase
      ? [{accountId:inventoryId,debit:value,credit:0},{accountId:adjustmentId,debit:0,credit:value}]
      : [{accountId:adjustmentId,debit:value,credit:0},{accountId:inventoryId,debit:0,credit:value}],
    module:'INVENTORY'
  });
}

/* استبدال الترحيل اليدوي بمحرك متعدد الأسطر متوازن */
async function manualJournal(e){
  e.preventDefault();
  try{
    const amount=num(jAmount.value);
    const debit=num(jDebit.value), credit=num(jCredit.value);
    if(debit===credit) throw new Error('لا يمكن اختيار الحساب نفسه مدينًا ودائنًا');
    await postAccountingEntry({
      date:jDate.value,source:'MANUAL-'+Date.now(),description:jDesc.value,

      module:'MANUAL'
    });
    toast('تم ترحيل القيد بعد التحقق من التوازن');
    renderJournal();
  }catch(err){toast(err.message,'error')}
}

/* تصحيح سندات القبض والصرف */
async function saveTreasury(e,store,direction){
  e.preventDefault();
  try{
    const amount=num(tAmount.value);
    const date=tDate.value, cashId=num(tCash.value), accountId=num(tAccount.value);
    if(!amount||cashId===accountId) throw new Error('تحقق من الحساب والمبلغ');
    const lines=direction===1
      ? [{accountId:cashId,debit:amount,credit:0},{accountId,debit:0,credit:amount}]
      : [{accountId,debit:amount,credit:0},{accountId:cashId,debit:0,credit:amount}];
    const source=(direction===1?'RCPT-':'PAY-')+Date.now();
    await add(store,{code:source,date,accountId,cashId,amount,description:tDesc.value,status:'مرحل'});
    await postAccountingEntry({date,source,description:tDesc.value,lines,module:'TREASURY'});

    loadPage(direction===1?'receipts':'payments');
  }catch(err){toast(err.message,'error')}
}

/* تصحيح التحصيلات ومدفوعات الموردين */
async function savePartyPayment(e,store,type){
  e.preventDefault();
  try{
    const partyStore=type==='customer'?'customers':'suppliers';
    const p=await get(partyStore,ppParty.value),amount=num(ppAmount.value);
    if(!p||amount<=0) throw new Error('تحقق من الطرف والمبلغ');
    if(type==='customer'){
      if(amount>num(p.balance)+0.009) throw new Error('مبلغ التحصيل أكبر من رصيد العميل');
      p.balance-=amount;
    }else{
      if(amount>num(p.balance)+0.009) throw new Error('مبلغ السداد أكبر من رصيد المورد');
      p.balance-=amount;
    }
    await put(partyStore,p);
    const code=(type==='customer'?'RCV-':'PAY-')+Date.now();
    await add(store,{date:ppDate.value,partyId:p.id,amount,payment:ppPay.value,code,status:'مرحل'});
    await postPartyPaymentJournal({date:ppDate.value,source:code,type,amount,payment:ppPay.value});
    toast('تم تسجيل وترحيل العملية محاسبيًا');
    loadPage(type==='customer'?'salesPayments':'purchasePayments');
  }catch(err){toast(err.message,'error')}
}

/* ميزان مراجعة يعتمد على الأرصدة الصحيحة ويظهر فرق التوازن */
async function renderTrial(){
  const j=await all('journal'),a=await all('accounts');
  const sums={};
  j.forEach(v=>(v.lines||[]).forEach(l=>{const id=num(l.accountId);sums[id]??={d:0,c:0};sums[id].d+=num(l.debit);sums[id].c+=num(l.credit)}));
  const rows=a.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${money(sums[x.id]?.d||0)}</td><td>${money(sums[x.id]?.c||0)}</td><td>${money(Math.abs((sums[x.id]?.d||0)-(sums[x.id]?.c||0)))}</td></tr>`).join('');
  const d=Object.values(sums).reduce((s,x)=>s+x.d,0),c=Object.values(sums).reduce((s,x)=>s+x.c,0),diff=Math.abs(d-c);
  document.getElementById('content').innerHTML=shell('ميزان المراجعة',pageLayout(
    `<div class="grid g3"><div class="kpi"><span>إجمالي المدين</span><b>${money(d)}</b></div><div class="kpi"><span>إجمالي الدائن</span><b>${money(c)}</b></div><div class="kpi"><span>حالة التوازن</span><b>${diff<.01?'🟢 متوازن':'🔴 فرق '+money(diff)}</b></div></div>`,
    `<div class="table-wrap"><table><thead><tr><th>الرمز</th><th>الحساب</th><th>مدين</th><th>دائن</th><th>الفرق</th></tr></thead><tbody>${rows}</tbody></table></div>`
  ));
}

/* إعادة تعريف التهيئة دون تعطيل الدخول */
const _openDB_original=openDB;
openDB=function(){
  return _openDB_original().then(async()=>{ await ensureAccountingAccounts(); });
};
