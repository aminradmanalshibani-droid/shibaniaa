<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>نظام الشيباني المحاسبي 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}
.login{height:100%;display:grid;place-items:center;padding:20px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 15px 40px #0f172a18;padding:22px}
.logo{width:58px;height:58px;border-radius:18px;background:#eff6ff;color:#2563eb;display:grid;place-items:center;font-size:28px;margin:auto}
h1,h2,h3,p{margin:0}
.title{font-size:18px;font-weight:900;margin-top:10px;text-align:center}
.muted{color:#64748b;font-size:11px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:800;color:#334155}
.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#fff;outline:none;font-size:12px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
.btn{border:0;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:800}
.primary{background:#2563eb;color:#fff}.success{background:#059669;color:#fff}.danger{background:#dc2626;color:#fff}
.secondary{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}.warning{background:#d97706;color:#fff}
.header{height:58px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;flex-shrink:0}
.brand{font-weight:900;font-size:13px}.header small{font-size:9px;color:#cbd5e1}
.header-actions{display:flex;gap:6px;align-items:center}
.main{flex:1;min-height:0;display:flex;overflow:hidden}
.sidebar{width:225px;background:#fff;border-left:1px solid #e2e8f0;padding:8px;overflow-y:auto;flex-shrink:0}
.nav-title{font-size:10px;font-weight:900;color:#64748b;padding:9px 7px 5px}
.nav-btn{width:100%;border:0;background:#fff;text-align:right;padding:9px;border-radius:10px;font-size:11px;font-weight:800;color:#334155}
.nav-btn:hover{background:#eff6ff;color:#1d4ed8}
.content{flex:1;min-width:0;min-height:0;padding:10px;overflow:hidden}
.page{height:100%;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 3px 12px #0f172a0a;display:flex;flex-direction:column;overflow:hidden}
.page-head{padding:10px 12px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.page-title{font-size:13px;font-weight:900}.page-body{padding:10px;min-height:0;flex:1;overflow:auto}
.grid{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px}
.kpi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px}.kpi b{font-size:18px}.kpi span{display:block;color:#64748b;font-size:10px;margin-bottom:5px}
.module{border:1px solid #e2e8f0;background:#fff;border-radius:15px;padding:13px;text-align:right;display:flex;gap:10px;align-items:center}
.module .ico{font-size:23px}.module b{font-size:11px;display:block}.module small{font-size:9px;color:#64748b}
.module:hover{border-color:#93c5fd;background:#eff6ff}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.table-wrap{border:1px solid #e2e8f0;border-radius:12px;overflow:auto;max-height:100%;min-height:0}
table{width:100%;border-collapse:collapse;min-width:720px;font-size:10px}
th{background:#f1f5f9;position:sticky;top:0;z-index:1;font-weight:900}
th,td{padding:8px;border-bottom:1px solid #f1f5f9;text-align:right;white-space:nowrap}
td .btn{padding:5px 7px;font-size:9px}
.empty{text-align:center!important;color:#94a3b8;padding:28px}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.form-grid .wide{grid-column:span 2}
.actions{display:flex;gap:6px;justify-content:flex-start;flex-wrap:wrap}
.toast{position:fixed;bottom:16px;left:16px;z-index:99;background:#0f172a;color:#fff;padding:11px 14px;border-radius:12px;font-size:11px;box-shadow:0 10px 30px #0003;opacity:0;transform:translateY(10px);transition:.2s}
.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:#0f172a80;display:grid;place-items:center;padding:15px;z-index:50}
.modal-card{width:min(850px,100%);max-height:92vh;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:12px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;font-size:12px;font-weight:900}
.modal-body{padding:12px;overflow:auto}
.pos{height:100%;display:grid;grid-template-columns:1.6fr 1fr;gap:9px}
.pos-products,.pos-cart{min-height:0;border:1px solid #e2e8f0;border-radius:14px;padding:9px;display:flex;flex-direction:column;overflow:hidden}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;overflow:auto;padding:2px}
.product{border:1px solid #e2e8f0;border-radius:11px;background:#fff;padding:9px;text-align:right}
.product b{display:block;font-size:10px}.product span{display:block;color:#2563eb;font-size:9px;margin-top:4px}.product em{font-style:normal;color:#64748b;font-size:8px}
.pos-cart-list{overflow:auto;flex:1}.pos-total{border-top:1px solid #e2e8f0;padding-top:8px;margin-top:8px}
.stat{display:flex;justify-content:space-between;font-size:11px;padding:5px 0}.big-total{font-size:18px;font-weight:900;color:#059669}
@media(max-width:900px){
 .sidebar{width:175px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pos{grid-template-columns:1fr}.pos-products{min-height:48%}.pos-cart{min-height:48%}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:620px){
 .sidebar{position:absolute;right:0;top:58px;bottom:0;width:230px;z-index:20;transform:translateX(105%);transition:.2s;box-shadow:-8px 0 25px #0002}
 .sidebar.open{transform:none}.content{padding:7px}.g2,.g3,.g4{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}
 .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.header{height:52px}.page-head{padding:8px}.page-body{padding:8px}
}

/* المرحلة الثانية: حماية العرض ومنع التداخل والقطع */
.page-body{overflow:hidden}
.screen-layout{height:100%;min-height:0;display:flex;flex-direction:column;gap:9px}
.screen-scroll{min-height:0;flex:1;overflow:auto}
.form-card{flex-shrink:0}
.table-wrap{flex:1;min-height:0;overflow:auto}
@media(max-width:620px){.page-title{font-size:12px}.page-head .btn{padding:7px 8px}.toolbar{flex-wrap:wrap}.actions{flex-wrap:wrap}}

/* POS Phase 6.2 - expanded cart and bottom action bar */
.pos-v6-expanded{width:100%;}
.pos-bottom-panel{background:#fff;padding:8px 0 0;}
.pos-main-actions .btn{min-height:42px;}
@media(max-width:620px){.pos-main-actions{grid-template-columns:1fr 1fr 1fr!important}.pos-main-actions .btn{padding:10px 5px!important;font-size:10px}.pos-bottom-panel .stat{font-size:10px}.pos-bottom-panel .big-total{font-size:16px}.pos-cart-list table{font-size:9px}.pos-cart-list th,.pos-cart-list td{padding:6px 4px}.pos-cart .toolbar{flex-wrap:wrap}.pos-cart .toolbar select,.pos-cart .toolbar input{min-width:0!important;flex:1 1 45%}}

/* POS Phase 6 UI integrity: no clipped headings/buttons on narrow screens */
.page-head{min-width:0;flex-wrap:wrap}
.page-head>div{min-width:0}
.page-title{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}
.grid>.card,.grid>.form-card{min-width:0;min-height:0}
.table-wrap{width:100%;min-width:0;overflow:auto}
.card h3{display:block;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.5;min-height:24px;margin:0 0 8px}
.shift-history-title{font-size:15px;font-weight:900;text-align:right}
@media(max-width:620px){
  .page-head{align-items:flex-start}
  .page-head>div:first-child{width:100%;flex-wrap:wrap}
  .page-head .actions{width:100%}
  .page-title{font-size:13px}
  .grid.g2{grid-template-columns:1fr}
}

/* Phase 18 layout compliance fix: no clipped controls, no page-level scrolling */
.p18-wrap{height:100%;min-height:0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:8px;overflow:hidden}
.p18-toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;min-width:0}
.p18-field{min-width:0}.p18-field label{display:block;font-size:11px;margin-bottom:3px}.p18-field input,.p18-field select{width:100%;box-sizing:border-box;min-width:0;height:34px}
.p18-actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.p18-actions .btn{width:100%;min-width:0;padding:7px 5px;font-size:11px;white-space:normal;line-height:1.2;min-height:40px}
.p18-kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;min-width:0}.p18-kpi{padding:8px}.p18-kpi .v{font-size:15px}.p18-kpi .l{font-size:10px}
#p18Report{min-height:0;overflow:hidden}.p18-report-card{height:100%;display:flex;flex-direction:column;min-height:0}.p18-table-wrap{flex:1;min-height:0;overflow:hidden}.p18-table{min-width:0;width:100%;table-layout:fixed}.p18-table th,.p18-table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 4px;font-size:11px}
.p18-card{padding:8px}.p18-card h3{font-size:13px;margin-bottom:6px}.p18-quick{grid-template-columns:repeat(6,minmax(0,1fr))}.p18-note{display:none}
.page-body:has(.p18-wrap){overflow:hidden}
@media(max-width:760px){.p18-wrap{grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:5px}.p18-toolbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.p18-field label{font-size:9px}.p18-field input,.p18-field select{height:30px;font-size:10px}.p18-actions{gap:4px}.p18-actions .btn{font-size:9px;min-height:34px;padding:4px 2px}.p18-kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.p18-kpi{padding:5px}.p18-kpi .v{font-size:11px}.p18-kpi .l{font-size:8px}.p18-card{padding:5px}.p18-card h3{font-size:10px}.p18-quick{grid-template-columns:repeat(3,minmax(0,1fr))}.p18-quick .btn{min-height:30px}.p18-table th,.p18-table td{font-size:9px;padding:4px 2px}.p18-empty{padding:10px;font-size:11px}}
</style>
<style id="phase16-css">
.p16-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.p16-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:11px}.p16-card small{display:block;color:#64748b;font-size:10px}.p16-card b{display:block;font-size:18px;margin-top:5px}.p16-ok{color:#059669}.p16-warn{color:#d97706}.p16-bad{color:#dc2626}.p16-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.p16-toolbar .btn{min-width:130px}.p16-filter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}@media(max-width:700px){.p16-grid{grid-template-columns:1fr 1fr}.p16-filter{grid-template-columns:1fr}.p16-toolbar .btn{flex:1;min-width:0}}
</style>
<style id="phase17-css">

.p17-field{display:flex;flex-direction:column;gap:5px;min-width:0}.p17-field label{font-size:12px;font-weight:800;color:#475569}.p17-field input{width:100%;min-width:0;padding:9px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}

.p17-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.p17-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;min-width:0}.p17-card h3{font-size:14px;margin:0 0 9px}.p17-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:12px}.p17-row:last-child{border-bottom:0}.p17-value{font-weight:900}.p17-bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:5px}.p17-bar i{display:block;height:100%;background:#2563eb;border-radius:999px;max-width:100%}.p17-alert{padding:9px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:7px;font-size:12px}.p17-ok{padding:9px;border-radius:10px;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;font-size:12px}.p17-table{width:100%;border-collapse:collapse;font-size:11px}.p17-table th,.p17-table td{padding:7px;border-bottom:1px solid #eef2f7;text-align:right;vertical-align:top}.p17-table th{font-weight:900;color:#475569;background:#f8fafc}.p17-empty{text-align:center;color:#94a3b8;padding:16px!important}
@media(max-width:1100px){.p17-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.p17-filter{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.p17-filter,.p17-grid2{grid-template-columns:1fr}.p17-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.p17-kpi b{font-size:16px}.p17-table{min-width:0}.p17-table th,.p17-table td{padding:6px;font-size:10px}}
</style>
<style id="p18css">
.p18-wrap{display:flex;flex-direction:column;gap:12px;max-width:100%;overflow:hidden}
.p18-toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;background:#fff;border:1px solid #dbeafe;border-radius:14px;padding:10px}

<style id="phase18-ui-integrity-fix">
/* إصلاح المرحلة 18: لا قطع للبيانات، والجداول قابلة للتمرير داخلها */
.p17-wrap{height:100%;min-height:0;display:flex;flex-direction:column;gap:7px}
.p17-filter,.p17-actions{flex-shrink:0}
#p17Body{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;padding-left:2px}
#p17Body .p17-card{min-width:0}
#p17Body .p17-card>div[style*="overflow:hidden"]{overflow-x:auto!important;overflow-y:auto!important;width:100%;max-width:100%}
#p17Body .p17-table{min-width:680px}
/* نتائج التدقيق: لا تُقطع الأرقام؛ تمرير الجدول داخل منطقته */
.p16-grid{flex-shrink:0}
.p16-grid~.card{min-width:0}
.p16-grid~.card .table-wrap{overflow:auto!important;width:100%;max-width:100%;max-height:24vh;min-height:90px}
.p16-grid~.card table{min-width:720px}

 .p17-filter{gap:5px!important}.p17-actions{gap:5px!important}
 .p17-actions .btn{padding:7px 8px;font-size:10px}
 .p16-toolbar{display:grid!important;grid-template-columns:1fr 1fr;gap:6px}.p16-toolbar .btn{width:100%;padding:8px 5px;font-size:10px}
 .p16-grid~.card .table-wrap{max-height:22vh}
}
</style>

const seed={
 company:[{id:1,name:'منشأة الشيباني التجارية',taxNo:'',address:'',phone:'',currency:'SAR'}],

function openDB(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB) return reject(new Error('المتصفح لا يدعم IndexedDB'));
  let settled=false, timer;
  const finish=(ok,v)=>{if(settled)return;settled=true;clearTimeout(timer);ok?resolve(v):reject(v)};
  const ensureStores=(version)=>{
   const r=indexedDB.open(DB_NAME,version);
   r.onupgradeneeded=e=>{
    const d=e.target.result;
    STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})});
   };
   r.onblocked=()=>console.warn('IndexedDB upgrade/open is blocked');
   r.onerror=()=>finish(false,r.error||new Error('تعذر فتح قاعدة البيانات المحلية'));
   r.onsuccess=e=>{
    const d=e.target.result;
    const missing=STORES.filter(s=>!d.objectStoreNames.contains(s));
    if(missing.length){
     const next=(Number(d.version)||1)+1;
     d.close();
     return ensureStores(next);
    }
    db=d;
    db.onversionchange=()=>{try{db.close()}catch{}};
    finish(true,db);
   };
  };
  const probe=indexedDB.open(DB_NAME);
  probe.onupgradeneeded=e=>{
   const d=e.target.result;
   STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})});
  };
  probe.onblocked=()=>console.warn('IndexedDB initial open is blocked');
  probe.onerror=()=>finish(false,probe.error||new Error('تعذر فتح قاعدة البيانات المحلية'));
  probe.onsuccess=e=>{
   const d=e.target.result;
   const missing=STORES.filter(s=>!d.objectStoreNames.contains(s));
   if(missing.length){
    const next=(Number(d.version)||1)+1;
    d.close();
    return ensureStores(next);
   }
   db=d;
   db.onversionchange=()=>{try{db.close()}catch{}};
   finish(true,db);
  };
  timer=setTimeout(()=>finish(false,new Error('انتهت مهلة تهيئة قاعدة البيانات المحلية')),5000);
 });
}
function tx(store,mode='readonly'){if(fallbackMode) return null;if(!db)throw new Error('قاعدة البيانات المحلية غير جاهزة');return db.transaction(store,mode).objectStore(store)}
function all(store){if(fallbackMode)return Promise.resolve([...(fallbackData[store]||[])]);return new Promise((res,rej)=>{try{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function get(store,id){if(fallbackMode)return Promise.resolve((fallbackData[store]||[]).find(x=>Number(x.id)===Number(id)));return new Promise((res,rej)=>{try{const r=tx(store).get(Number(id));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function put(store,obj){if(fallbackMode){const a=fallbackData[store]||(fallbackData[store]=[]);const i=a.findIndex(x=>Number(x.id)===Number(obj.id));if(i>=0)a[i]={...a[i],...obj};else a.push({...obj});saveFallbackStore(store);return Promise.resolve(obj.id)}return new Promise((res,rej)=>{try{const r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function add(store,obj){if(fallbackMode){const a=fallbackData[store]||(fallbackData[store]=[]);const copy={...obj};if(copy.id==null)copy.id=a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1;a.push(copy);saveFallbackStore(store);return Promise.resolve(copy.id)}return new Promise((res,rej)=>{try{const r=tx(store,'readwrite').add(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function remove(store,id){if(fallbackMode){fallbackData[store]=(fallbackData[store]||[]).filter(x=>Number(x.id)!==Number(id));saveFallbackStore(store);return Promise.resolve()}return new Promise((res,rej)=>{try{const r=tx(store,'readwrite').delete(Number(id));r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function count(store){return (await all(store)).length}
async function seedDB(){
 // تهيئة البيانات الافتراضية في دفعات متوازية، دون انتظار عشرات معاملات IndexedDB واحداً تلو الآخر.
 await Promise.all(STORES.filter(s=>seed[s]).map(async s=>{
  if((await count(s))===0){
   for(const row of seed[s]) await add(s,row);
  }
 }));
 const users=await all('users');
 if(!users.some(u=>u.username==='admin')) await add('users',{username:'admin',fullname:'مدير النظام',role:'مدير',status:'نشط',password:'1234'});
}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)+' SAR';
const num=v=>Number(v)||0;
const today=()=>new Date().toISOString().slice(0,10);

 // لا نؤخر دخول المدير بسبب انتظار IndexedDB. يتم التحقق من المستخدمين المحليين إذا كانت القاعدة جاهزة.

  await loadPage('dashboard');
 }catch(err){
  console.error('Dashboard/DB error:',err);
  content.innerHTML=shell('لوحة المؤشرات الرئيسية',`<div class="card"><b>تم تسجيل الدخول بنجاح</b><p class="muted" style="margin-top:8px">تعذر تحميل بيانات النظام المحلية. أعد فتح الملف مرة واحدة، وإذا استمرت المشكلة استخدم إعدادات المتصفح لمسح بيانات هذا الموقع ثم افتح الملف مجدداً.</p><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="location.reload()">إعادة تشغيل النظام</button><button class="btn secondary" onclick="loadPage('pos')">فتح نقطة البيع</button></div></div>`);
 }
 try{ if(window.phase24AfterSuccess) await window.phase24AfterSuccess(); }catch(e){ console.warn('Phase24:',e); }
 return false;
}

function phase25Start(){
 const q=document.getElementById('p25GlobalSearch');
 if(q){q.focus();q.scrollIntoView({behavior:'smooth',block:'center'});}
 try{toast('مرحبًا بك، يمكنك البحث أو اختيار إحدى وحدات النظام');}catch(e){}
}
function phase25SearchNavigate(){
 const el=document.getElementById('p25GlobalSearch');
 const q=String(el&&el.value||'').trim().toLowerCase();
 if(!q){try{toast('اكتب اسم الصفحة أو الوحدة التي تريد فتحها','warning')}catch(e){};return;}
 const map=[
   {keys:['pos','نقطة البيع','كاشير','نقطة'],page:'pos'},
   {keys:['مبيعات','المبيعات','فاتورة بيع','عملاء','العملاء'],page:'sales'},
   {keys:['مشتريات','المشتريات','مورد','الموردين'],page:'purchases'},
   {keys:['مخزون','المخزون','صنف','الأصناف','مخازن'],page:'items'},
   {keys:['حسابات','الحسابات','قيود','دليل'],page:'accounts'},
   {keys:['تقارير','التقارير','ميزان'],page:'reports'},
   {keys:['نسخ','احتياطي','حماية','استعادة'],page:'backup'}
 ];
 const hit=map.find(x=>x.keys.some(k=>q.includes(k)));
 if(hit){loadPage(hit.page);return;}
 try{toast('لم يتم العثور على صفحة مطابقة لعبارة البحث','warning')}catch(e){}
}

async function addItem(e){e.preventDefault();await add('items',{code:itCode.value,barcode:itBarcode.value.trim(),name:itName.value,unit:itUnit.value,qty:num(itQty.value),cost:num(itCost.value),price:num(itPrice.value),warehouseId:num(itWh.value),status:'نشط'});toast('تم حفظ الصنف');renderItems()}
async function deleteItem(id){if(!confirm('حذف الصنف؟'))return;await remove('items',id);toast('تم حذف الصنف');renderItems()}

async function renderWarehouses(){
 const rows=(await all('warehouses')).map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.location)}</td><td>${esc(x.manager)}</td><td>${esc(x.status)}</td><td><button class="btn danger" onclick="deleteWarehouse(${x.id})">حذف</button></td></tr>`).join('');
 document.getElementById('content').innerHTML=shell('المخازن والمستودعات',
 `<form onsubmit="addWarehouse(event)" class="card" style="margin-bottom:9px"><div class="form-grid">
 <div class="field"><label>كود المخزن</label><input id="whCode" required></div><div class="field"><label>اسم المخزن</label><input id="whName" required></div><div class="field"><label>الموقع</label><input id="whLocation"></div><div class="field"><label>أمين المخزن</label><input id="whManager"></div></div><div class="actions" style="margin-top:8px"><button class="btn primary">إضافة المخزن</button></div></form>

}
async function addWarehouse(e){e.preventDefault();await add('warehouses',{code:whCode.value,name:whName.value,location:whLocation.value,manager:whManager.value,status:'نشط'});toast('تمت إضافة المخزن');renderWarehouses()}
async function deleteWarehouse(id){const items=await all('items');if(items.some(x=>x.warehouseId===id))return toast('لا يمكن حذف مخزن مرتبط بأصناف','error');if(!confirm('حذف المخزن؟'))return;await remove('warehouses',id);renderWarehouses()}

 document.getElementById('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><span>${title}</span><button class="btn secondary" onclick="closeModal()">✕</button></div><div class="modal-body">
 <form id="invoiceForm"><div class="form-grid">
 <div class="field"><label>التاريخ</label><input id="fDate" type="date" value="${today()}"></div>
 <div class="field"><label>${isSale?'العميل':'المورد'}</label><select id="fParty">${parties.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
 <div class="field"><label>طريقة الدفع</label><select id="fPay"><option>نقدي</option><option>آجل</option><option>بنك</option></select></div>
 <div class="field"><label>المخزن</label><select id="fWh">${(await all('warehouses')).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div></div>
 <div class="card" style="margin-top:9px"><div class="actions"><button type="button" class="btn secondary" onclick="addInvoiceLine()">➕ إضافة صنف</button></div><div id="invoiceLines" style="margin-top:8px"></div></div>
 <div class="form-grid" style="margin-top:9px"><div class="field"><label>الخصم SAR</label><input id="fDiscount" type="number" value="0" step=".01" oninput="recalcInvoice()"></div><div class="field"><label>الضريبة SAR</label><input id="fTax" type="number" value="0" step=".01" oninput="recalcInvoice()"></div><div class="field"><label>المدفوع SAR</label><input id="fPaid" type="number" value="0" step=".01" oninput="recalcInvoice()"></div><div class="field"><label>الإجمالي SAR</label><input id="fTotal" readonly value="0"></div></div>
 <div id="invoiceSummary" class="card" style="margin-top:8px"></div>
 <div class="actions" style="margin-top:9px"><button class="btn success">حفظ وترحيل الفاتورة</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div>
 </form></div></div>`;
 window.invoiceKind=kind;window.invoiceLines=[];
 addInvoiceLine();
 document.getElementById('invoiceForm').onsubmit=e=>saveInvoice(e,kind);
}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML=''}
async function addInvoiceLine(){
 const items=await all('items');window.invoiceLines.push({itemId:items[0]?.id||0,qty:1,price:items[0]?.price||0});
 renderInvoiceLines();
}
async function renderInvoiceLines(){
 const items=await all('items');
 document.getElementById('invoiceLines').innerHTML=window.invoiceLines.map((l,i)=>`<div class="grid g4" style="margin-bottom:6px;align-items:end">
 <div class="field"><label>الصنف</label><select onchange="lineChange(${i},'itemId',this.value)">${items.map(x=>`<option value="${x.id}" ${x.id===l.itemId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
 <div class="field"><label>الكمية</label><input type="number" min=".001" step=".001" value="${l.qty}" onchange="lineChange(${i},'qty',this.value)"></div>
 <div class="field"><label>السعر SAR</label><input type="number" min="0" step=".01" value="${l.price}" onchange="lineChange(${i},'price',this.value)"></div>
 <div class="actions"><button type="button" class="btn danger" onclick="removeInvoiceLine(${i})">حذف</button></div></div>`).join('');
 recalcInvoice();
}
async function lineChange(i,k,v){window.invoiceLines[i][k]=k==='itemId'?num(v):num(v);if(k==='itemId'){const x=await get('items',v);window.invoiceLines[i].price=invoiceKind==='sale'?num(x?.price):num(x?.cost)}renderInvoiceLines()}
function removeInvoiceLine(i){window.invoiceLines.splice(i,1);renderInvoiceLines()}
function recalcInvoice(){const sub=window.invoiceLines.reduce((a,x)=>a+num(x.qty)*num(x.price),0),d=num(document.getElementById('fDiscount')?.value),tax=num(document.getElementById('fTax')?.value),total=Math.max(0,sub-d+tax),paid=num(document.getElementById('fPaid')?.value);if(document.getElementById('fTotal'))document.getElementById('fTotal').value=total.toFixed(2);if(document.getElementById('invoiceSummary'))document.getElementById('invoiceSummary').innerHTML=`<div class="stat"><span>الإجمالي قبل الخصم</span><b>${money(sub)}</b></div><div class="stat"><span>الصافي</span><b>${money(total)}</b></div><div class="stat"><span>المتبقي</span><b>${money(Math.max(0,total-paid))}</b></div>`}
async function saveInvoice(e,kind){
 e.preventDefault();if(!window.invoiceLines.length)return toast('أضف صنفًا واحدًا على الأقل','error');
 const isSale=kind==='sale', store=isSale?'salesInvoices':'purchaseInvoices', partyStore=isSale?'customers':'suppliers';
 const partyId=num(fParty.value), date=fDate.value, payment=fPay.value, warehouseId=num(fWh.value);
 const sub=window.invoiceLines.reduce((a,x)=>a+num(x.qty)*num(x.price),0), discount=num(fDiscount.value),tax=num(fTax.value),total=Math.max(0,sub-discount+tax),paid=num(fPaid.value),remaining=Math.max(0,total-paid);
 const items=await all('items');
 for(const l of window.invoiceLines){const it=items.find(x=>x.id===l.itemId);if(!it)return toast('صنف غير موجود','error');if(isSale&&num(it.qty)<num(l.qty))return toast(`المخزون غير كافٍ للصنف: ${it.name}`,'error')}
 const inv={code:(isSale?'SINV-':'PINV-')+Date.now(),date,partyId,warehouseId,payment,lines:window.invoiceLines.map(x=>({...x})),subtotal:sub,discount,tax,total,paid,remaining,currency:'SAR',status:'مرحل'};
 await add(store,inv);
 for(const l of window.invoiceLines){const it=items.find(x=>x.id===l.itemId);it.qty+=isSale?-num(l.qty):num(l.qty);await put('items',it);await add('stockMoves',{date,type:isSale?'بيع':'شراء',itemId:it.id,qty:isSale?-num(l.qty):num(l.qty),ref:inv.code})}
 const party=await get(partyStore,partyId);if(party){party.balance+=isSale?remaining:-remaining;await put(partyStore,party)}
 await postJournalForInvoice(inv,isSale);
 closeModal();toast('تم حفظ وترحيل الفاتورة بنجاح');loadPage(isSale?'salesInvoices':'purchases');
}
function invoiceFx(inv){
 const currency=inv?.currency||'SAR';
 const rate=Math.max(0.000001,num(inv?.exchangeRate)||1);
 const factor=currency==='YER'?rate:1;
 return {currency,rate,factor};
}
function foreignValue(inv,baseAmount){return num(baseAmount)*invoiceFx(inv).factor;}
async function postJournalForInvoice(inv,isSale){
 const cashAccount=isSale?(inv.payment==='بنك'?2:1):(inv.payment==='بنك'?2:1);
 const partyAccount=isSale?3:5, salesAccount=isSale?6:4;
 const fx=invoiceFx(inv);
 let lines=[];
 if(isSale){
  lines=[
   {accountId:cashAccount,debit:inv.paid,credit:0,foreignDebit:foreignValue(inv,inv.paid),foreignCredit:0},
   {accountId:partyAccount,debit:inv.remaining,credit:0,foreignDebit:foreignValue(inv,inv.remaining),foreignCredit:0},
   {accountId:salesAccount,debit:0,credit:inv.total,foreignDebit:0,foreignCredit:foreignValue(inv,inv.total)}
  ];
 }else{
  lines=[
   {accountId:4,debit:inv.total,credit:0,foreignDebit:foreignValue(inv,inv.total),foreignCredit:0},
   {accountId:cashAccount,debit:inv.paid,credit:0,foreignDebit:foreignValue(inv,inv.paid),foreignCredit:0},
   {accountId:partyAccount,debit:0,credit:inv.remaining,foreignDebit:0,foreignCredit:foreignValue(inv,inv.remaining)}
  ];
 }
 await add('journal',{
  code:'JV-'+Date.now(),date:inv.date,source:inv.code,
  description:isSale?'ترحيل فاتورة مبيعات':'ترحيل فاتورة مشتريات',
  currency:fx.currency,exchangeRate:fx.rate,baseCurrency:'SAR',
  currencyTotal:num(inv.currencyTotal)||foreignValue(inv,inv.total),
  lines,totalDebit:lines.reduce((a,x)=>a+x.debit,0),totalCredit:lines.reduce((a,x)=>a+x.credit,0)
 });
}

<script id="phase18-nav-close-fix">
(function(){
  'use strict';
  function closeNow(){ var sb=document.getElementById('sidebar'); if(sb) sb.classList.remove('open'); }
  document.addEventListener('click',function(e){
    var b=e.target && e.target.closest ? e.target.closest('#sidebar .nav-btn,[data-page]') : null;
    if(b) closeNow();
  },true);
  var oldToggle=window.toggleSidebar;
  window.closeSidebar=closeNow;
  // ضمان إضافي عند تغيير أي صفحة برمجياً
  var attempts=0;
  var timer=setInterval(function(){
    if(typeof window.loadPage==='function'){
      var current=window.loadPage;
      if(!current.__closeSidebarFix){
        var wrapped=async function(page){ closeNow(); return current.apply(this,arguments); };
        wrapped.__closeSidebarFix=true; window.loadPage=wrapped;
      }
      clearInterval(timer);
    } else if(++attempts>30) clearInterval(timer);
  },100);
})();
</script>

<script>
/* =========================
   المرحلة الحادية عشرة — الفترات والإقفال المالي
========================= */
const PHASE11_FINANCIAL_CLOSE_VERSION='11.0';
function p11n(v){return Number(v)||0}
function p11Date(v){return String(v||'').slice(0,10)}
async function p11Audit(action,details=''){try{await add('auditLog',{date:new Date().toISOString(),action,details,user:(window.currentUser&&window.currentUser.username)||'admin',phase:11})}catch(e){console.warn(e)}}
async function p11Periods(){return (await all('financialPeriods')).sort((a,b)=>String(a.startDate).localeCompare(String(b.startDate)))}
async function p11ActivePeriod(date=today()){const d=p11Date(date);const ps=await p11Periods();return ps.find(p=>p11Date(p.startDate)<=d&&p11Date(p.endDate)>=d)||null}
async function p11CanPost(date=today()){const p=await p11ActivePeriod(date);if(!p)return {ok:true,period:null};if(p.status==='مغلقة'||p.status==='مقفلة نهائيًا')return {ok:false,period:p,message:'لا يمكن الترحيل داخل فترة مالية مغلقة: '+p.name};return {ok:true,period:p}}
async function p11GuardPosting(date){const r=await p11CanPost(date);if(!r.ok)throw new Error(r.message);return r}
async function p11EnsureCurrentYear(){const ps=await p11Periods();if(ps.length)return;const y=new Date().getFullYear();await add('financialPeriods',{name:'السنة المالية '+y,startDate:y+'-01-01',endDate:y+'-12-31',status:'مفتوحة',year:y,openingTransferred:false,createdAt:new Date().toISOString()});await p11Audit('إنشاء سنة مالية افتراضية',String(y))}
async function p11JournalRows(from='',to=''){return (await all('journal')).filter(j=>j.status!=='مسودة'&&(!from||p11Date(j.date)>=from)&&(!to||p11Date(j.date)<=to))}
async function p11AccountBalances(from='',to=''){const accounts=await all('accounts'),journal=await p11JournalRows(from,to),m={};journal.forEach(j=>(j.lines||[]).forEach(l=>{const s=m[l.accountId]||(m[l.accountId]={debit:0,credit:0});s.debit+=p11n(l.debit);s.credit+=p11n(l.credit)}));return {accounts,journal,map:m}}
function p11NaturalBalance(a,s){const type=String(a?.type||'');return ['التزام','إيراد','حقوق ملكية'].includes(type)?p11n(s.credit)-p11n(s.debit):p11n(s.debit)-p11n(s.credit)}
async function renderFinancialPeriods11(){await p11EnsureCurrentYear();const ps=await p11Periods();document.getElementById('content').innerHTML=shell('📅 إدارة السنوات والفترات المالية — المرحلة 11',`<div class="p11-toolbar"><button class="btn primary" onclick="renderFinancialPeriodForm11()">➕ سنة/فترة جديدة</button><button class="btn secondary" onclick="renderOpeningBalances11()">📌 الأرصدة الافتتاحية</button><button class="btn secondary" onclick="renderClosingCenter11()">🔒 مركز الإقفال المالي</button></div><div class="table-wrap p11-scroll"><table><thead><tr><th>الفترة</th><th>من</th><th>إلى</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.startDate)}</td><td>${esc(p.endDate)}</td><td>${esc(p.status)}</td><td><button class="btn ${p.status==='مفتوحة'?'danger':'success'}" onclick="p11TogglePeriod(${p.id})">${p.status==='مفتوحة'?'إغلاق':'فتح'}</button> <button class="btn secondary" onclick="renderPeriodClose11(${p.id})">إقفال</button></td></tr>`).join('')}</tbody></table></div><div class="p11-note">الفترة المغلقة تمنع الترحيل الجديد داخل نطاقها. عمليات الإقفال تسجل في سجل التدقيق.</div>`) }
async function renderFinancialPeriodForm11(){document.getElementById('content').innerHTML=shell('➕ إنشاء فترة مالية',`<form class="card" onsubmit="p11SavePeriod(event)"><div class="form-grid"><div class="field wide"><label>اسم الفترة</label><input id="p11Name" required placeholder="مثال: السنة المالية 2027"></div><div class="field"><label>تاريخ البداية</label><input id="p11Start" type="date" required></div><div class="field"><label>تاريخ النهاية</label><input id="p11End" type="date" required></div></div><div class="actions" style="margin-top:8px"><button class="btn primary">حفظ</button><button type="button" class="btn secondary" onclick="renderFinancialPeriods11()">رجوع</button></div></form>`) }
async function p11SavePeriod(e){e.preventDefault();const name=p11Name.value.trim(),start=p11Start.value,end=p11End.value;if(!name||!start||!end||start>end)return toast('تحقق من بيانات الفترة','error');const ps=await p11Periods();if(ps.some(p=>start<=p.endDate&&end>=p.startDate))return toast('توجد فترة مالية متداخلة','error');await add('financialPeriods',{name,startDate:start,endDate:end,status:'مفتوحة',year:Number(start.slice(0,4)),openingTransferred:false,createdAt:new Date().toISOString()});await p11Audit('إنشاء فترة مالية',name);toast('تم إنشاء الفترة المالية');renderFinancialPeriods11()}
async function p11TogglePeriod(id){const p=await get('financialPeriods',id);if(!p)return;if(p.status==='مقفلة نهائيًا')return toast('الفترة مقفلة نهائيًا ولا يمكن فتحها مباشرة','error');p.status=p.status==='مفتوحة'?'مغلقة':'مفتوحة';await put('financialPeriods',p);await p11Audit(p.status==='مغلقة'?'إغلاق فترة مالية':'فتح فترة مالية',p.name);toast('تم تحديث حالة الفترة');renderFinancialPeriods11()}
async function renderOpeningBalances11(){const accounts=await all('accounts'),obs=await all('openingBalances');document.getElementById('content').innerHTML=shell('📌 الأرصدة الافتتاحية',`<div class="p11-toolbar"><button class="btn primary" onclick="p11SaveOpeningBalances()">💾 حفظ الأرصدة</button><button class="btn secondary" onclick="renderFinancialPeriods11()">رجوع</button></div><div class="table-wrap p11-scroll"><table><thead><tr><th>الحساب</th><th>مدين افتتاحي</th><th>دائن افتتاحي</th></tr></thead><tbody>${accounts.filter(a=>!['إيراد','مصروف'].includes(String(a.type))).map(a=>{const x=obs.find(o=>p11n(o.accountId)===p11n(a.id))||{};return `<tr data-a="${a.id}"><td>${esc(a.code+' - '+a.name)}</td><td><input class="p11OD" type="number" min="0" step=".01" value="${p11n(x.debit)}"></td><td><input class="p11OC" type="number" min="0" step=".01" value="${p11n(x.credit)}"></td></tr>`}).join('')}</tbody></table></div>`) }
async function p11SaveOpeningBalances(){const rows=[...document.querySelectorAll('tr[data-a]')];for(const r of rows){const accountId=p11n(r.dataset.a),debit=p11n(r.querySelector('.p11OD').value),credit=p11n(r.querySelector('.p11OC').value);const allObs=await all('openingBalances'),old=allObs.find(x=>p11n(x.accountId)===accountId);const rec={accountId,debit,credit,updatedAt:new Date().toISOString()};if(old){rec.id=old.id;await put('openingBalances',rec)}else if(debit||credit)await add('openingBalances',rec)}await p11Audit('حفظ الأرصدة الافتتاحية','تم تحديث الأرصدة الافتتاحية');toast('تم حفظ الأرصدة الافتتاحية')}
async function renderClosingCenter11(){const ps=await p11Periods();document.getElementById('content').innerHTML=shell('🔒 مركز الإقفال المالي',`<div class="card"><div class="field"><label>اختر الفترة المالية</label><select id="p11ClosePeriod">${ps.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.status)}</option>`).join('')}</select></div><div class="p11-toolbar" style="margin-top:8px"><button class="btn primary" onclick="p11PreviewClose()">📊 معاينة نتيجة الفترة</button><button class="btn danger" onclick="p11CloseSelectedPeriod()">🔒 تنفيذ الإقفال</button></div></div><div id="p11CloseResult" style="margin-top:8px"></div><div class="p11-note">الإقفال ينشئ قيدًا واحدًا لنتيجة الفترة فقط بعد التحقق من أن الفترة غير مقفلة مسبقًا. لا يتم حذف القيود السابقة.</div>`) }
async function p11PreviewClose(){const p=await get('financialPeriods',p11n(p11ClosePeriod.value));if(!p)return;const {accounts,map}=await p11AccountBalances(p.startDate,p.endDate);let rev=0,exp=0;accounts.forEach(a=>{const s=map[a.id]||{debit:0,credit:0};if(a.type==='إيراد')rev+=p11n(s.credit)-p11n(s.debit);if(a.type==='مصروف')exp+=p11n(s.debit)-p11n(s.credit)});const net=rev-exp;document.getElementById('p11CloseResult').innerHTML=`<div class="p11-grid"><div class="p11-card"><small>الإيرادات</small><b>${money(rev)} SAR</b></div><div class="p11-card"><small>المصروفات</small><b>${money(exp)} SAR</b></div><div class="p11-card"><small>صافي النتيجة</small><b>${money(Math.abs(net))} SAR ${net>=0?'ربح':'خسارة'}</b></div></div>`}
async function p11EnsureRetainedEarnings(){let a=(await all('accounts')).find(x=>String(x.code)==='3200');if(a)return a.id;const parent=(await all('accounts')).find(x=>String(x.code)==='3000');return await add('accounts',{code:'3200',name:'الأرباح والخسائر المرحلة',type:'حقوق ملكية',parentId:parent?.id||null})}
async function p11CloseSelectedPeriod(){try{const p=await get('financialPeriods',p11n(p11ClosePeriod.value));if(!p)throw new Error('اختر فترة مالية');if(p.status==='مقفلة نهائيًا')throw new Error('هذه الفترة مقفلة مسبقًا');const existing=(await all('periodClosings')).find(x=>p11n(x.periodId)===p11n(p.id));if(existing)throw new Error('يوجد سجل إقفال لهذه الفترة');const {accounts,map}=await p11AccountBalances(p.startDate,p.endDate);let rev=0,exp=0;accounts.forEach(a=>{const s=map[a.id]||{debit:0,credit:0};if(a.type==='إيراد')rev+=p11n(s.credit)-p11n(s.debit);if(a.type==='مصروف')exp+=p11n(s.debit)-p11n(s.credit)});const net=rev-exp,retId=await p11EnsureRetainedEarnings(),code='CLOSE11-'+Date.now();if(Math.abs(net)>0.000001){const lines=net>=0?[{accountId:retId,debit:0,credit:net}]:[{accountId:retId,debit:-net,credit:0}];await add('journal',{code,date:p.endDate,description:'إقفال نتيجة الفترة: '+p.name,lines,status:'مرحل',source:'PERIOD_CLOSE',periodId:p.id,currency:'SAR',exchangeRate:1,createdAt:new Date().toISOString()})}await add('periodClosings',{periodId:p.id,code,date:p.endDate,revenue:rev,expense:exp,netResult:net,status:'مقفلة نهائيًا',createdAt:new Date().toISOString()});p.status='مقفلة نهائيًا';p.closedAt=new Date().toISOString();await put('financialPeriods',p);await p11Audit('إقفال نهائي لفترة مالية',`${p.name} | النتيجة ${net} SAR`);toast('تم الإقفال المالي للفترة');renderFinancialPeriods11()}catch(err){toast(err.message,'error')}}
async function p11CreateNextYear(){const ps=await p11Periods();const closed=ps.filter(p=>p.status==='مقفلة نهائيًا').sort((a,b)=>String(b.endDate).localeCompare(String(a.endDate)))[0];if(!closed)return toast('لا توجد سنة مقفلة نهائيًا للترحيل','error');const y=Number(String(closed.endDate).slice(0,4))+1,start=y+'-01-01',end=y+'-12-31';if(ps.some(p=>p.startDate===start))return toast('السنة التالية موجودة بالفعل','error');await add('financialPeriods',{name:'السنة المالية '+y,startDate:start,endDate:end,status:'مفتوحة',year:y,openingTransferred:true,createdAt:new Date().toISOString()});await p11Audit('فتح سنة مالية جديدة',String(y));toast('تم فتح السنة المالية الجديدة');renderFinancialPeriods11()}

async function renderPOS(){
 const items=await all('items'), customers=await all('customers');
 const total=posCart.reduce((a,x)=>a+x.qty*x.price,0);
 document.getElementById('content').innerHTML=`<div class="pos">
 <div class="pos-products"><div class="toolbar"><button class="btn secondary" onclick="loadPage('dashboard')">↩ رجوع</button><input id="posSearch" placeholder="بحث بالاسم أو الباركود" oninput="filterPOS()" style="flex:1;min-width:150px;border:1px solid #cbd5e1;border-radius:10px;padding:8px;font-size:11px"></div><div id="posProducts" class="product-grid">${items.map(posProduct).join('')}</div></div>
 <div class="pos-cart"><div class="toolbar"><select id="posCustomer" style="flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:8px;font-size:10px">${customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><select id="posPay" style="flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:8px;font-size:10px"><option>نقدي</option><option>آجل</option><option>بنك</option></select></div><div class="pos-cart-list"><table style="min-width:0"><thead><tr><th>الصنف</th><th>كمية</th><th>مبلغ</th><th></th></tr></thead><tbody>${posCart.map((x,i)=>`<tr><td>${esc(x.name)}</td><td><input type="number" min="1" value="${x.qty}" onchange="posQty(${i},this.value)" style="width:55px;padding:5px"></td><td>${money(x.qty*x.price)}</td><td><button class="btn danger" onclick="posRemove(${i})">×</button></td></tr>`).join('')||`<tr><td colspan="4" class="empty">السلة فارغة</td></tr>`}</tbody></table></div>
 <div class="pos-total"><div class="stat"><span>عدد الأصناف</span><b>${posCart.length}</b></div><div class="stat"><span>الإجمالي</span><b class="big-total">${money(total)}</b></div><button class="btn success" style="width:100%;padding:12px" onclick="checkoutPOS()">ترحيل البيع وطباعة الفاتورة</button></div></div></div>`;
}
function posProduct(x){return `<button class="product" data-name="${esc((x.name+' '+x.barcode).toLowerCase())}" onclick="posAdd(${x.id})"><b>${esc(x.name)}</b><span>${money(x.price)}</span><em>المتاح: ${num(x.qty)} · ${esc(x.barcode)}</em></button>`}
async function filterPOS(){const q=(posSearch.value||'').toLowerCase();document.querySelectorAll('.product').forEach(b=>b.style.display=b.dataset.name.includes(q)?'':'none')}
async function posAdd(id){const it=await get('items',id);if(!it)return;if(num(it.qty)<=0)return toast('الصنف غير متوفر في المخزون','error');const x=posCart.find(a=>a.id===id);if(x){if(x.qty+1>it.qty)return toast('الكمية تتجاوز المخزون','error');x.qty++}else posCart.push({id,name:it.name,price:num(it.price),qty:1});renderPOS()}
function posQty(i,v){posCart[i].qty=Math.max(1,num(v));renderPOS()}
function posRemove(i){posCart.splice(i,1);renderPOS()}
async function checkoutPOS(){if(!posCart.length)return toast('السلة فارغة','error');const customerId=num(document.getElementById('posCustomer')?.value)||1;const payment=document.getElementById('posPay')?.value||'نقدي';const total=posCart.reduce((a,x)=>a+x.qty*x.price,0);const items=await all('items');for(const x of posCart){const it=items.find(i=>i.id===x.id);if(!it||it.qty<x.qty)return toast('المخزون غير كافٍ','error')}const inv={code:'POS-'+Date.now(),date:today(),partyId:customerId,warehouseId:1,payment,lines:posCart.map(x=>({itemId:x.id,qty:x.qty,price:x.price})),subtotal:total,discount:0,tax:0,total,paid:payment==='آجل'?0:total,remaining:payment==='آجل'?total:0,currency:'SAR',status:'مرحل'};await add('salesInvoices',inv);for(const x of posCart){const it=items.find(i=>i.id===x.id);it.qty-=x.qty;await put('items',it);await add('stockMoves',{date:today(),type:'POS بيع',itemId:it.id,qty:-x.qty,ref:inv.code})}const c=await get('customers',customerId);if(c&&inv.remaining){c.balance+=inv.remaining;await put('customers',c)}await postJournalForInvoice(inv,true);posCart=[];toast('تم ترحيل فاتورة POS');printInvoice(inv.code)}

async function renderTrial(){const j=await all('journal'),a=await all('accounts');const sums={};j.forEach(v=>(v.lines||[]).forEach(l=>{sums[l.accountId]??={d:0,c:0};sums[l.accountId].d+=num(l.debit);sums[l.accountId].c+=num(l.credit)}));const rows=a.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${money(sums[x.id]?.d)}</td><td>${money(sums[x.id]?.c)}</td></tr>`).join('');const d=Object.values(sums).reduce((s,x)=>s+x.d,0),c=Object.values(sums).reduce((s,x)=>s+x.c,0);document.getElementById('content').innerHTML=shell('ميزان المراجعة',`<div class="card" style="margin-bottom:9px"><div class="stat"><span>إجمالي المدين</span><b>${money(d)}</b></div><div class="stat"><span>إجمالي الدائن</span><b>${money(c)}</b></div><div class="stat"><span>حالة التوازن</span><b>${Math.abs(d-c)<.01?'متوازن':'غير متوازن'}</b></div></div><div class="table-wrap"><table><thead><tr><th>الرمز</th><th>الحساب</th><th>مدين</th><th>دائن</th></tr></thead><tbody>${rows}</tbody></table></div>`)}

async function renderBackup(){document.getElementById('content').innerHTML=shell('النسخ الاحتياطي والاستعادة',`<div class="grid g2"><div class="card"><b>تصدير نسخة احتياطية</b><p class="muted" style="margin:7px 0 10px">يشمل جميع جداول قاعدة البيانات المحلية.</p><button class="btn primary" onclick="backup()">⬇ تصدير JSON</button></div><div class="card"><b>استعادة نسخة</b><p class="muted" style="margin:7px 0 10px">تحقق من الملف قبل استبدال البيانات الحالية.</p><input id="restoreFile" type="file" accept=".json,application/json" onchange="restore(event)"></div></div>`)}
async function backup(){const data={version:DB_VERSION,date:new Date().toISOString(),stores:{}};for(const s of STORES)data.stores[s]=await all(s);const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Sheibani_DB_2026.json';a.click();URL.revokeObjectURL(a.href);toast('تم تصدير النسخة الاحتياطية')}
async function restore(e){const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj?.stores||typeof obj.stores!=='object')throw Error('صيغة النسخة غير صحيحة');for(const s of STORES){const rows=Array.isArray(obj.stores[s])?obj.stores[s]:[];const old=await all(s);for(const x of old)await remove(s,x.id);for(const x of rows)await put(s,x)}toast('تمت الاستعادة بنجاح');loadPage('dashboard')}catch(err){toast('فشل الاستعادة: '+err.message,'error')}}

function pageLayout(form,table){return `<div class="screen-layout">${form?`<div class="form-card">${form}</div>`:''}<div class="screen-scroll">${table||''}</div></div>`}
async function existsIn(store,id){return !!(await get(store,id))}
async function safeDeleteParty(store,id){
 const sales=store==='customers'?await all('salesInvoices'):await all('purchaseInvoices');
 if(sales.some(x=>Number(x.partyId)===Number(id)))return toast('لا يمكن حذف السجل لأنه مرتبط بفواتير مرحّلة','error');
 if(!confirm('هل تريد حذف هذا السجل؟'))return;
 await remove(store,id); toast('تم الحذف بنجاح'); store==='customers'?renderCustomers():renderSuppliers();
}

async function renderReturns(title,store,direction){
 const items=await all('items'); const rows=(await all(store)).slice().reverse().map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.date)}</td><td>${esc((items.find(i=>i.id===x.itemId)||{}).name||'')}</td><td>${x.qty}</td><td>${money(x.total)}</td><td>${esc(x.status)}</td></tr>`).join('');
 const form=`<form onsubmit="saveReturn(event,'${store}',${direction})" class="card"><div class="form-grid"><div class="field"><label>التاريخ</label><input id="rDate" type="date" value="${today()}"></div><div class="field"><label>الصنف</label><select id="rItem">${items.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>الكمية</label><input id="rQty" type="number" min=".001" step=".001" value="1"></div><div class="field"><label>المبلغ SAR</label><input id="rTotal" type="number" min="0" step=".01" value="0"></div></div><div class="actions" style="margin-top:8px"><button class="btn primary">ترحيل المرتجع</button></div></form>`;
 const table=`<div class="table-wrap"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">لا توجد مرتجعات</td></tr>'}</tbody></table></div>`;
 document.getElementById('content').innerHTML=shell(title,pageLayout(form,table));
}
async function saveReturn(e,store,direction){
 e.preventDefault();const id=num(rItem.value),q=num(rQty.value),amount=num(rTotal.value),it=await get('items',id);if(!it||q<=0)return toast('تحقق من الصنف والكمية','error');
 if(direction===-1&&num(it.qty)<q)return toast('كمية المرتجع أكبر من المخزون المتاح','error');
 const code='RET-'+Date.now();it.qty=num(it.qty)+direction*q;await put('items',it);
 await add(store,{code,date:rDate.value,itemId:id,qty:q,total:amount,status:'مرحل'});
 await add('stockMoves',{date:rDate.value,type:store==='salesReturns'?'مرتجع مبيعات':'مرتجع مشتريات',itemId:id,qty:direction*q,ref:code});
 const lines=store==='salesReturns'?[{accountId:6,debit:amount,credit:0},{accountId:1,debit:0,credit:amount}]:[{accountId:4,debit:amount,credit:0},{accountId:5,debit:0,credit:amount}];
 await add('journal',{code:'JV-'+Date.now(),date:rDate.value,source:store==='salesReturns'?'مرتجع مبيعات':'مرتجع مشتريات',description:code,lines,totalDebit:amount,totalCredit:amount});
 toast('تم ترحيل المرتجع وتحديث المخزون والقيد');loadPage(store);
}
async function renderPayments(title,store,type){
 const partyStore=type==='customer'?'customers':'suppliers',parties=await all(partyStore),rows=(await all(store)).slice().reverse().map(x=>{const p=parties.find(z=>z.id===x.partyId);return `<tr><td>${esc(x.code||'')}</td><td>${esc(x.date)}</td><td>${esc(p?.name||'')}</td><td>${money(x.amount)}</td><td>${esc(x.payment)}</td></tr>`}).join('');
 const form=`<form onsubmit="savePartyPayment(event,'${store}','${type}')" class="card"><div class="form-grid"><div class="field"><label>التاريخ</label><input id="ppDate" type="date" value="${today()}"></div><div class="field"><label>${type==='customer'?'العميل':'المورد'}</label><select id="ppParty">${parties.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.balance)}</option>`).join('')}</select></div><div class="field"><label>المبلغ SAR</label><input id="ppAmount" type="number" min=".01" step=".01" required></div><div class="field"><label>طريقة الدفع</label><select id="ppPay"><option>نقدي</option><option>بنك</option></select></div></div><div class="actions" style="margin-top:8px"><button class="btn primary">حفظ وترحيل</button></div></form>`;
 const table=`<div class="table-wrap"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>الطرف</th><th>المبلغ</th><th>الدفع</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">لا توجد عمليات مسجلة</td></tr>'}</tbody></table></div>`;
 document.getElementById('content').innerHTML=shell(title,pageLayout(form,table));
}
async function savePartyPayment(e,store,type){
 e.preventDefault();const partyStore=type==='customer'?'customers':'suppliers',p=await get(partyStore,ppParty.value),amount=num(ppAmount.value);if(!p||amount<=0)return toast('أدخل مبلغًا صحيحًا','error');if(amount>num(p.balance))return toast('المبلغ أكبر من الرصيد المستحق','error');
 p.balance=Math.max(0,num(p.balance)-amount);await put(partyStore,p);const code=(type==='customer'?'RCV-':'PAY-')+Date.now();await add(store,{date:ppDate.value,partyId:p.id,amount,payment:ppPay.value,code});
 const cashAccount=ppPay.value==='بنك'?2:1,partyAccount=type==='customer'?3:5;
 const lines=type==='customer'?[{accountId:cashAccount,debit:amount,credit:0},{accountId:partyAccount,debit:0,credit:amount}]:[{accountId:partyAccount,debit:amount,credit:0},{accountId:cashAccount,debit:0,credit:amount}];
 await add('journal',{code:'JV-'+Date.now(),date:ppDate.value,source:type==='customer'?'تحصيل عميل':'سداد مورد',description:code,lines,totalDebit:amount,totalCredit:amount});

async function savePurchaseOrder(e){
  e.preventDefault();
  const obj={

async function changePurchaseOrderStatus(id){
  const o=await get('purchaseOrders',id); if(!o) return;
  const next={'مفتوح':'معتمد','معتمد':'مكتمل','مكتمل':'مغلق','مغلق':'مفتوح'}[o.status]||'مفتوح';
  if(!confirm(`تغيير حالة الأمر من "${o.status}" إلى "${next}"؟`)) return;
  o.status=next; await put('purchaseOrders',o); await audit('تحديث أمر شراء',`${o.code} → ${next}`);
  toast('تم تحديث الحالة'); renderPurchaseOrders();
}
async function deletePurchaseOrder(id){
  const o=await get('purchaseOrders',id); if(!o) return;
  if(!confirm('هل تريد حذف أمر الشراء؟')) return;
  await remove('purchaseOrders',id); await audit('حذف أمر شراء',o.code);
  toast('تم حذف أمر الشراء'); renderPurchaseOrders();
}

function accountSums(journal){
  const sums={};
  journal.forEach(v=>(v.lines||[]).forEach(l=>{
    sums[l.accountId]??={debit:0,credit:0};
    sums[l.accountId].debit+=num(l.debit); sums[l.accountId].credit+=num(l.credit);
  }));
  return sums;
}

async function drawAccountStatement(){
  const id=num(document.getElementById('statementAccount').value);
  if(!id){ document.getElementById('statementResult').innerHTML='<div class="empty">اختر حسابًا</div>'; return; }
  const from=document.getElementById('statementFrom').value, to=document.getElementById('statementTo').value;
  const journal=await all('journal'), invoices=await all('salesInvoices');
  let balSAR=0, balYER=0, rows=[];
  const findInvoiceForJournal=(j)=>{
    const src=String(j.source||'');
    return invoices.find(x=>String(x.code)===src) || invoices.find(x=>src.startsWith(String(x.code)+'-')) || null;
  };
  journal.filter(j=>(!from||j.date>=from)&&(!to||j.date<=to))
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)))
    .forEach(j=>{
      const inv=findInvoiceForJournal(j);
      const rate=Math.max(0.000001,num(j.exchangeRate)||num(inv?.exchangeRate)||num(window.POS_DEFAULT_EXCHANGE_RATE)||413);
      (j.lines||[]).filter(l=>num(l.accountId)===id).forEach(l=>{
        const debitSAR=num(l.debit), creditSAR=num(l.credit);
        // المحرك المحاسبي يحتفظ بـ SAR كأساس. المقابل YER يُحسب لكل حركة بسعر الصرف المثبت في الفاتورة.
        const debitYER=debitSAR*rate, creditYER=creditSAR*rate;
        balSAR += debitSAR-creditSAR;
        balYER += debitYER-creditYER;
        rows.push(`<tr>
          <td>${esc(j.date)}</td>
          <td>${esc(j.code)}</td>
          <td>${esc(j.description||j.source||'')}</td>
          <td>${money(debitSAR)} SAR</td>
          <td>${posFmt_v6(debitYER)} YER</td>
          <td>${money(creditSAR)} SAR</td>
          <td>${posFmt_v6(creditYER)} YER</td>
          <td>${money(balSAR)} SAR</td>
          <td>${posFmt_v6(balYER)} YER</td>
        </tr>`);
      });
    });
  document.getElementById('statementResult').innerHTML=`
    <div class="muted" style="margin-bottom:6px;font-size:10px">نظام تعدد العملات: يعرض كل قيد بالقيمة المحاسبية الأساسية SAR وبالقيمة المقابلة YER وفق سعر الصرف المثبت مع الفاتورة. العمليات القديمة التي لا تحتوي سعر صرف تستخدم السعر الافتراضي الحالي.</div>
    <table><thead><tr>
      <th>التاريخ</th><th>المرجع</th><th>البيان</th>
      <th>مدين SAR</th><th>مدين YER</th>
      <th>دائن SAR</th><th>دائن YER</th>
      <th>الرصيد SAR</th><th>الرصيد YER</th>
    </tr></thead><tbody>${rows.join('')||'<tr><td colspan="9" class="empty">لا توجد حركة للحساب</td></tr>'}</tbody></table>`;
}

async function renderProfitLoss(){
  const journal=await all('journal'), accounts=await all('accounts');
  const sums=accountSums(journal);
  const byType=t=>accounts.filter(a=>a.type===t).map(a=>{
    const s=sums[a.id]||{debit:0,credit:0};

  const revenues=byType('إيراد'), expenses=byType('مصروف');

    </div>

function normalizeJournalLines(lines){
  return (lines||[]).map(l=>({
    accountId:num(l.accountId),
    debit:Math.max(0,num(l.debit)),
    credit:Math.max(0,num(l.credit)),
    note:String(l.note||'')
  })).filter(l=>l.accountId && (l.debit>0 || l.credit>0));
}

function validateJournalLines(lines){
  const clean=normalizeJournalLines(lines);
  if(clean.length<2) throw new Error('القيد يجب أن يحتوي على طرفين محاسبيين على الأقل');
  if(clean.some(l=>l.debit>0 && l.credit>0)) throw new Error('لا يمكن أن يكون السطر مدينًا ودائنًا في الوقت نفسه');
  const debit=clean.reduce((s,l)=>s+l.debit,0);
  const credit=clean.reduce((s,l)=>s+l.credit,0);
  if(debit<=0 || credit<=0) throw new Error('يجب أن يحتوي القيد على مبالغ مدينة ودائنة');
  if(Math.abs(debit-credit)>0.009) throw new Error(`القيد غير متوازن: المدين ${debit.toFixed(2)} والدائن ${credit.toFixed(2)}`);
  return {lines:clean,totalDebit:+debit.toFixed(2),totalCredit:+credit.toFixed(2)};
}

async function postAccountingEntry({date=today(),source='',description='',lines=[],module='',allowDuplicate=false,currency='SAR',exchangeRate=1}={}){
  await ensureAccountingAccounts();
  const check=validateJournalLines(lines);
  const journal=await all('journal');
  if(source && !allowDuplicate && journal.some(j=>j.source===source && j.engine==='unified')){
    return journal.find(j=>j.source===source && j.engine==='unified');
  }
  const entry={
    code:'JV-'+Date.now()+'-'+Math.floor(Math.random()*1000),
    date,source,description,
    lines:check.lines,totalDebit:check.totalDebit,totalCredit:check.totalCredit,
    module,currency,exchangeRate:Math.max(0.000001,num(exchangeRate)||1),status:'مرحل',engine:'unified',engineVersion:ACCOUNTING_ENGINE_VERSION,
    createdAt:new Date().toISOString()
  };
  await add('journal',entry);
  if(typeof logAudit==='function') await logAudit('ترحيل قيد محاسبي موحد',`${source||entry.code} | ${description} | مدين=${entry.totalDebit} دائن=${entry.totalCredit}`);
  return entry;
}

async function calculateInvoiceCost(lines){
  const items=await all('items');
  return (lines||[]).reduce((sum,l)=>{
    const it=items.find(x=>x.id===num(l.itemId));
    return sum + num(l.qty)*num(it?.cost);
  },0);
}

async function postJournalForInvoice(inv,isSale){
  await ensureAccountingAccounts();
  const cash=isSale ? (inv.payment==='بنك'?ACCOUNT_CODES.BANK:ACCOUNT_CODES.CASH) : (inv.payment==='بنك'?ACCOUNT_CODES.BANK:ACCOUNT_CODES.CASH);
  const cashId=await accountIdByCode(cash);
  const arId=await accountIdByCode(ACCOUNT_CODES.AR);
  const apId=await accountIdByCode(ACCOUNT_CODES.AP);
  const salesId=await accountIdByCode(ACCOUNT_CODES.SALES);
  const inventoryId=await accountIdByCode(ACCOUNT_CODES.INVENTORY);
  const cogsId=await accountIdByCode(ACCOUNT_CODES.COGS);
  const taxPayableId=await accountIdByCode(ACCOUNT_CODES.TAX_PAYABLE);
  const taxReceivableId=await accountIdByCode(ACCOUNT_CODES.TAX_RECEIVABLE);
  const discountId=await accountIdByCode(ACCOUNT_CODES.DISCOUNTS);

  if(isSale){
    const revenue=num(inv.subtotal)-num(inv.discount);
    const lines=[
      {accountId:cashId,debit:num(inv.paid),credit:0},
      {accountId:arId,debit:num(inv.remaining),credit:0},
      {accountId:salesId,debit:0,credit:revenue},
    ];
    if(num(inv.tax)>0) lines.push({accountId:taxPayableId,debit:0,credit:num(inv.tax)});
    if(num(inv.discount)>0) lines.push({accountId:discountId,debit:num(inv.discount),credit:0});
    await postAccountingEntry({
      date:inv.date,source:inv.code,description:'ترحيل فاتورة مبيعات',
      lines,module:'SALES',currency:inv.currency||'SAR',exchangeRate:num(inv.exchangeRate)||1
    });

    const cost=await calculateInvoiceCost(inv.lines);
    if(cost>0){
      await postAccountingEntry({
        date:inv.date,source:inv.code+'-COGS',description:'إثبات تكلفة البضاعة المباعة',currency:inv.currency||'SAR',exchangeRate:num(inv.exchangeRate)||1,
        lines:[
          {accountId:cogsId,debit:cost,credit:0},
          {accountId:inventoryId,debit:0,credit:cost}
        ],module:'INVENTORY'
      });
    }
  }else{
    const net=num(inv.subtotal)-num(inv.discount);
    const lines=[
      {accountId:inventoryId,debit:net,credit:0},
      {accountId:cashId,debit:0,credit:num(inv.paid)},
      {accountId:apId,debit:0,credit:num(inv.remaining)}
    ];
    if(num(inv.tax)>0) lines.push({accountId:taxReceivableId,debit:num(inv.tax),credit:0});
    if(num(inv.discount)>0){
      // الخصم يخفض تكلفة الشراء بالفعل عبر صافي المخزون
    }
    await postAccountingEntry({
      date:inv.date,source:inv.code,description:'ترحيل فاتورة مشتريات',
      lines,module:'PURCHASES',currency:inv.currency||'SAR',exchangeRate:num(inv.exchangeRate)||1
    });
  }
}

async function postPartyPaymentJournal({date,source,type,amount,payment='نقدي',description=''}) {
  await ensureAccountingAccounts();
  const cashId=await accountIdByCode(payment==='بنك'?ACCOUNT_CODES.BANK:ACCOUNT_CODES.CASH);
  const partyId=await accountIdByCode(type==='customer'?ACCOUNT_CODES.AR:ACCOUNT_CODES.AP);
  const lines=type==='customer'
    ? [{accountId:cashId,debit:amount,credit:0},{accountId:partyId,debit:0,credit:amount}]
    : [{accountId:partyId,debit:amount,credit:0},{accountId:cashId,debit:0,credit:amount}];
  return postAccountingEntry({date,source,description:description||(type==='customer'?'تحصيل من عميل':'سداد لمورد'),lines,module:'TREASURY'});
}

async function postInventoryAdjustmentJournal({date,source,itemId,diff,unitCost,description='تسوية مخزون'}){
  if(!diff) return;
  await ensureAccountingAccounts();
  const inventoryId=await accountIdByCode(ACCOUNT_CODES.INVENTORY);
  const adjustmentId=await accountIdByCode(ACCOUNT_CODES.INVENTORY_ADJUSTMENT);
  const value=Math.abs(num(diff)*num(unitCost));
  if(value<=0) return;
  const increase=diff>0;
  return postAccountingEntry({
    date,source,description,
    lines:increase
      ? [{accountId:inventoryId,debit:value,credit:0},{accountId:adjustmentId,debit:0,credit:value}]
      : [{accountId:adjustmentId,debit:value,credit:0},{accountId:inventoryId,debit:0,credit:value}],
    module:'INVENTORY'
  });
}

/* تصحيح التحصيلات ومدفوعات الموردين */
async function savePartyPayment(e,store,type){
  e.preventDefault();
  try{
    const partyStore=type==='customer'?'customers':'suppliers';
    const p=await get(partyStore,ppParty.value),amount=num(ppAmount.value);
    if(!p||amount<=0) throw new Error('تحقق من الطرف والمبلغ');
    if(type==='customer'){
      if(amount>num(p.balance)+0.009) throw new Error('مبلغ التحصيل أكبر من رصيد العميل');
      p.balance-=amount;
    }else{
      if(amount>num(p.balance)+0.009) throw new Error('مبلغ السداد أكبر من رصيد المورد');
      p.balance-=amount;
    }
    await put(partyStore,p);
    const code=(type==='customer'?'RCV-':'PAY-')+Date.now();
    await add(store,{date:ppDate.value,partyId:p.id,amount,payment:ppPay.value,code,status:'مرحل'});
    await postPartyPaymentJournal({date:ppDate.value,source:code,type,amount,payment:ppPay.value});
    toast('تم تسجيل وترحيل العملية محاسبيًا');
    loadPage(type==='customer'?'salesPayments':'purchasePayments');
  }catch(err){toast(err.message,'error')}
}

function invKey(itemId,warehouseId){return Number(itemId)+'-'+Number(warehouseId)}
async function ensureInventoryBalances(){
  const items=await all('items'), balances=await all('inventoryBalances');
  for(const it of items){
    const exists=balances.some(b=>Number(b.itemId)===Number(it.id)&&Number(b.warehouseId)===Number(it.warehouseId));
    if(!exists) await add('inventoryBalances',{itemId:it.id,warehouseId:Number(it.warehouseId)||1,qty:num(it.qty),reservedQty:0,minQty:num(it.minQty||5),updatedAt:new Date().toISOString()});
  }
}
async function getBalance(itemId,warehouseId){
  const bs=await all('inventoryBalances');
  return bs.find(b=>Number(b.itemId)===Number(itemId)&&Number(b.warehouseId)===Number(warehouseId))||null;
}
async function setBalance(itemId,warehouseId,qty){
  let b=await getBalance(itemId,warehouseId);
  if(!b) b={itemId:Number(itemId),warehouseId:Number(warehouseId),qty:0,reservedQty:0,minQty:5,updatedAt:''};
  b.qty=num(qty); b.updatedAt=new Date().toISOString();
  if(b.id) await put('inventoryBalances',b); else await add('inventoryBalances',b);
  return b;
}
async function moveInventory(itemId,warehouseId,delta,meta={}){
  const b=await getBalance(itemId,warehouseId), current=num(b?.qty);
  const next=current+num(delta);
  if(next<-0.0001) throw new Error('رصيد الصنف غير كافٍ في المخزن المحدد');
  await setBalance(itemId,warehouseId,Math.max(0,next));
  const it=await get('items',itemId);
  if(it && Number(it.warehouseId)===Number(warehouseId)){it.qty=Math.max(0,next);await put('items',it)}
  await add('stockMoves',{date:meta.date||today(),type:meta.type||'حركة مخزون',itemId:Number(itemId),warehouseId:Number(warehouseId),qty:num(delta),ref:meta.ref||('INV-'+Date.now()),fromWarehouseId:meta.fromWarehouseId||null,toWarehouseId:meta.toWarehouseId||null,note:meta.note||''});
}

saveInvoice=async function(e,kind){
  e.preventDefault();
  try{
    if(!window.invoiceLines.length)throw new Error('أضف صنفًا واحدًا على الأقل');
    const isSale=kind==='sale',store=isSale?'salesInvoices':'purchaseInvoices',partyStore=isSale?'customers':'suppliers';
    const partyId=num(fParty.value),date=fDate.value,payment=fPay.value,warehouseId=num(fWh.value);
    const sub=window.invoiceLines.reduce((a,x)=>a+num(x.qty)*num(x.price),0),discount=num(fDiscount.value),tax=num(fTax.value),total=Math.max(0,sub-discount+tax),paid=num(fPaid.value),remaining=Math.max(0,total-paid);
    for(const l of window.invoiceLines){if(isSale && await inventoryQty(l.itemId,warehouseId)<num(l.qty))throw new Error('المخزون غير كافٍ في المخزن المحدد')}
    const inv={code:(isSale?'SINV-':'PINV-')+Date.now(),date,partyId,warehouseId,payment,lines:window.invoiceLines.map(x=>({...x})),subtotal:sub,discount,tax,total,paid,remaining,currency:'SAR',status:'مرحل'};await add(store,inv);
    for(const l of inv.lines){await moveInventory(l.itemId,warehouseId,isSale?-num(l.qty):num(l.qty),{date,type:isSale?'بيع':'شراء',ref:inv.code});}
    const party=await get(partyStore,partyId);if(party){party.balance+=isSale?remaining:remaining;await put(partyStore,party)}
    await postJournalForInvoice(inv,isSale);closeModal();toast('تم حفظ وترحيل الفاتورة وربطها بالمخزن المحدد');loadPage(isSale?'salesInvoices':'purchases');
  }catch(err){toast(err.message,'error')}
};

async function closePOSShift(){
 try{const sh=await getActivePOSShift();if(!sh)return toast('لا توجد وردية مفتوحة','error');
 const sales=(await all('salesInvoices')).filter(x=>Number(x.posShiftId)===Number(sh.id)&&x.status==='مرحل');

<script>
/* =========================
