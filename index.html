<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام المحاسبي المتكامل | أمين الشيباني</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primaryBlue: '#0f172a',
                        accentBlue: '#2563eb',
                        accentHover: '#1d4ed8',
                        bgLight: '#f1f5f9',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        @media print {
            body * { visibility: hidden; }
            #printableArea, #printableArea * { visibility: visible; }
            #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="flex flex-col h-full select-none overflow-hidden">

    <div id="toastContainer" class="fixed top-5 left-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- نافذة قائمة ملف الاحترافية -->
    <div id="fileModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-80 p-4">
            <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-100">
                <div class="flex items-center gap-1.5"><span class="text-sm">📁</span><h3 class="font-bold text-xs text-slate-800">قائمة ملف النظام الأساسية</h3></div>
                <button onclick="toggleModal('fileModal')" class="w-6 h-6 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500 font-bold transition-all cursor-pointer text-xs">✕</button>
            </div>
            <div class="space-y-1">
                <button onclick="loadHomeView(); toggleModal('fileModal');" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-blue-50 hover:text-accentBlue transition-all cursor-pointer"><span>🏠 الصفحة الرئيسية</span><span>◀️</span></button>
                <button onclick="loadPageView('إدارة المبيعات', '🛒'); toggleModal('fileModal');" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-blue-50 hover:text-accentBlue transition-all cursor-pointer"><span>🛒 إدارة المبيعات والعملاء</span><span>◀️</span></button>
                <button onclick="loadPageView('إدارة المشتريات', '🛍️'); toggleModal('fileModal');" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-blue-50 hover:text-accentBlue transition-all cursor-pointer"><span>🛍️ إدارة المشتريات والموردين</span><span>◀️</span></button>
                <button onclick="loadPageView('إدارة المخزون', '📦'); toggleModal('fileModal');" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-blue-50 hover:text-accentBlue transition-all cursor-pointer"><span>📦 إدارة المخزون والمستودعات</span><span>◀️</span></button>
                <button onclick="loadPageView('الأصول الثابتة', '🏢'); toggleModal('fileModal');" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-blue-50 hover:text-accentBlue transition-all cursor-pointer"><span>🏢 إدارة الأصول الثابتة</span><span>◀️</span></button>
                <button onclick="loadPageView('الموارد البشرية', '👥'); toggleModal('fileModal');" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-blue-50 hover:text-accentBlue transition-all cursor-pointer"><span>👥 الموارد البشرية والرواتب</span><span>◀️</span></button>
                <button onclick="loadPageView('دفتر الأستاذ', '📚'); toggleModal('fileModal');" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-blue-50 hover:text-accentBlue transition-all cursor-pointer"><span>📚 دفتر الأستاذ العام</span><span>◀️</span></button>
                <button onclick="loadPageView('المخرجات المالية', '📊'); toggleModal('fileModal');" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-blue-50 hover:text-accentBlue transition-all cursor-pointer"><span>📊 المخرجات والتقارير المالية</span><span>◀️</span></button>
                <button onclick="exportDatabase(); toggleModal('fileModal');" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-blue-50 hover:text-accentBlue transition-all cursor-pointer"><span>📤 تصدير البيانات والنسخ</span><span>◀️</span></button>
                <button onclick="lockSystem(); toggleModal('fileModal');" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-semibold text-amber-600 hover:bg-amber-50 transition-all cursor-pointer"><span>🔒 قفل النظام</span><span>◀️</span></button>
            </div>
        </div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="flex-grow flex items-center justify-center p-4 bg-slate-900 overflow-hidden">
        <div class="bg-white border border-slate-200 rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <div class="text-center mb-4">
                <div class="w-12 h-12 rounded-xl bg-accentBlue flex items-center justify-center mx-auto mb-2 shadow-lg shadow-blue-500/20">
                    <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-lg font-bold text-slate-900">النظام المحاسبي المتكامل</h1>
                <p class="text-[11px] text-slate-500 mt-0.5">أمين الشيباني (admin / 123456)</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اسم المستخدم</label>
                    <input type="text" id="loginUser" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-accentBlue font-mono" placeholder="admin">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" id="loginPassword" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-accentBlue font-mono" placeholder="123456">
                </div>
                <button type="submit" class="w-full bg-accentBlue text-white font-bold text-xs py-2.5 rounded-xl hover:bg-accentHover transition-all cursor-pointer shadow-md">تسجيل الدخول للنظام</button>
            </form>
        </div>
    </div>

    <!-- لوحة النظام الأساسية -->
    <div id="dashboardSection" class="hidden flex-col h-full overflow-hidden">
        
        <!-- شريط التنقل العلوي -->
        <header class="bg-primaryBlue text-white shadow-md shrink-0 relative z-40">
            <div class="max-w-7xl mx-auto px-4 h-12 flex items-center justify-between gap-2">
                <div class="flex items-center gap-3 shrink-0">
                    <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-accentBlue text-white font-black text-xs shadow">AS</span>
                    <span id="headerYearDisplay" class="bg-slate-800 text-blue-300 px-2.5 py-1 rounded-lg text-xs font-mono font-bold border border-slate-700">السنة: 2026</span>
                    <h1 class="font-bold text-xs text-slate-100 hidden lg:inline">النظام المحاسبي المتكامل | إدارة المبيعات والعملاء</h1>
                </div>

                <div class="flex items-center gap-1.5 shrink-0 text-xs font-medium">
                    <button onclick="loadHomeView()" class="px-2.5 py-1.5 hover:bg-slate-800 rounded-lg transition-all cursor-pointer text-slate-300 flex items-center gap-1"><i data-lucide="home" class="w-3.5 h-3.5"></i> الرئيسية</button>
                    <button onclick="loadPageView('إدارة المبيعات', '🛒')" class="px-2.5 py-1.5 bg-blue-600 rounded-lg text-white font-bold transition-all cursor-pointer flex items-center gap-1"><i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i> المبيعات</button>
                    <button onclick="toggleModal('fileModal')" class="px-3 py-1.5 bg-accentBlue hover:bg-accentHover text-white font-bold rounded-lg transition-all cursor-pointer flex items-center gap-1 shadow"><i data-lucide="menu" class="w-3.5 h-3.5"></i> قائمة ملف</button>
                </div>
            </div>

            <!-- شريط الأزرار الفرعية للخريطة المحاسبية -->
            <div class="bg-slate-900 border-t border-slate-800 px-2 py-1.5 flex items-center justify-center gap-1.5 flex-wrap">
                <button onclick="loadPageView('إدارة المبيعات', '🛒')" class="flex items-center gap-1 bg-blue-600 text-white border border-blue-500 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer shadow"><span>🛒</span><span>المبيعات والعملاء</span></button>
                <button onclick="loadPageView('إدارة المشتريات', '🛍️')" class="flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer"><span>🛍️</span><span>المشتريات</span></button>
                <button onclick="loadPageView('إدارة المخزون', '📦')" class="flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer"><span>📦</span><span>المخزون</span></button>
                <button onclick="loadPageView('الأصول الثابتة', '🏢')" class="flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer"><span>🏢</span><span>الأصول</span></button>
                <button onclick="loadPageView('الموارد البشرية', '👥')" class="flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer"><span>👥</span><span>الموارد البشرية</span></button>
                <button onclick="loadPageView('دفتر الأستاذ', '📚')" class="flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer"><span>📚</span><span>الأستاذ العام</span></button>
                <button onclick="loadPageView('المخرجات المالية', '📊')" class="flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer"><span>📊</span><span>التقارير</span></button>
            </div>
        </header>

        <!-- منطقة المحتوى الديناميكية -->
        <div id="mainContentArea" class="flex-grow p-3 flex flex-col items-center justify-center bg-slate-100 overflow-hidden">
        </div>

        <footer class="bg-primaryBlue text-white py-1.5 px-4 flex items-center justify-between shrink-0 text-[11px]">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-bold tracking-wide">إدارة المبيعات والعملاء المركزية - متكاملة 100%</span>
            </div>
            <div class="font-mono text-slate-400">Ameen Al-Shaibani System v9.4</div>
        </footer>
    </div>

    <!-- النافذة المنبثقة التفصيلية لفاتورة المبيعات والعملاء (شاملة وكاملة) -->
    <div id="salesModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-3">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-3xl p-5 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
                <div class="flex items-center gap-2">
                    <span class="text-base">🧾</span>
                    <h3 class="font-bold text-xs text-slate-800" id="salesModalTitle">إصدار فاتورة بيع جديدة / ملف عميل</h3>
                </div>
                <button onclick="toggleModal('salesModal')" class="w-6 h-6 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500 font-bold transition-all cursor-pointer text-xs">✕</button>
            </div>

            <form onsubmit="handleSalesFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="salesEditIndex" value="-1">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">رقم الفاتورة</label>
                        <input type="text" id="invNumber" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-mono text-slate-800 focus:outline-none focus:border-accentBlue" value="INV-2026-003">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">اسم العميل / المؤسسة</label>
                        <input type="text" id="invClientName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-accentBlue" placeholder="مثال: مؤسسة النور للتجارة">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">رقم الهاتف / العنوان</label>
                        <input type="text" id="invClientPhone" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-accentBlue" placeholder="مثال: 771234567 - تعز">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">نوع المعاملة</label>
                        <select id="invType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-accentBlue font-bold">
                            <option value="فاتورة بيع نقدي">فاتورة بيع نقدي</option>
                            <option value="فاتورة بيع آجل">فاتورة بيع آجل (على الحساب)</option>
                            <option value="عرض سعر">عرض سعر (غير مرحل)</option>
                            <option value="مردودات مبيعات">مردودات مبيعات</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">حد الائتمان المالي</label>
                        <input type="text" id="invCreditLimit" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-mono text-slate-800 focus:outline-none focus:border-accentBlue" value="1,000,000 ر.ي">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">المستودع الرئيسي للخصم</label>
                        <select id="invWarehouse" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-accentBlue">
                            <option value="المستودع الرئيسي - تعز">المستودع الرئيسي - تعز</option>
                            <option value="مستودع الفرع - التربة">مستودع الفرع - التربة</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1">المبلغ الإجمالي (ر.ي)</label>
                        <input type="text" id="invTotalAmount" required class="w-full bg-blue-50 border border-blue-200 rounded-xl px-3 py-1.5 text-xs font-mono font-bold text-accentBlue focus:outline-none" placeholder="0.00">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-1">بيان الأصناف والبنود داخل الفاتورة</label>
                    <textarea id="invItemsDesc" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-accentBlue" placeholder="اكتب الأصناف والكميات وأسعار الوحدات هنا..."></textarea>
                </div>

                <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="toggleModal('salesModal')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer">إلغاء</button>
                    <button type="submit" class="bg-accentBlue hover:bg-accentHover text-white px-5 py-2 rounded-xl text-xs font-bold cursor-pointer shadow flex items-center gap-1.5"><i data-lucide="save" class="w-4 h-4"></i> حفظ وترحيل القيد المحاسبي</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let selectedActiveYear = '2026';

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-bold shadow-xl transition-all duration-300 translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600 text-white border border-emerald-500' : 'bg-red-600 text-white border border-red-500'
            }`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleLogin(event) {
            event.preventDefault();
            const userInput = document.getElementById('loginUser').value.trim();
            const passInput = document.getElementById('loginPassword').value.trim();

            if (userInput === 'admin' && passInput === '123456') {
                showToast("تم تشغيل النظام المحاسبي المتكامل بنجاح!", "success");
                document.getElementById('loginSection').classList.add('hidden');
                const dash = document.getElementById('dashboardSection');
                dash.classList.remove('hidden');
                dash.classList.add('flex');
                loadPageView('إدارة المبيعات', '🛒');
            } else {
                showToast("بيانات الدخول غير صحيحة (admin / 123456).", "error");
            }
        }

        function lockSystem() {
            document.getElementById('dashboardSection').classList.remove('flex');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            showToast("تم قفل النظام بنجاح.", "success");
        }

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.toggle('hidden');
        }

        function loadHomeView() {
            loadPageView('إدارة المبيعات', '🛒');
        }

        function getPageData(title) {
            const key = 'system_sales_pro_db_' + selectedActiveYear + '_' + title;
            const saved = localStorage.getItem(key);
            if (saved) return JSON.parse(saved);

            if (title === 'إدارة المبيعات') return [
                { id: 1, invNum: 'INV-1001', client: 'مؤسسة النور التجارية', phone: '771234567', type: 'فاتورة بيع آجل', total: '450,000 ر.ي', items: '2x شاشة ذكية 50 بوصة، 5x راوتر لاسلكي' },
                { id: 2, invNum: 'INV-1002', client: 'عميل نقدي عام', phone: '733000000', type: 'فاتورة بيع نقدي', total: '120,000 ر.ي', items: '1x طابعة إبسون باركود وتوصيلات' }
            ];
            return [{ id: 1, invNum: 'REC-01', client: 'سجل افتراضي', phone: '000000000', type: 'معتمد', total: '0 ر.ي', items: 'بيانات افتراضية' }];
        }

        function savePageData(title, data) {
            const key = 'system_sales_pro_db_' + selectedActiveYear + '_' + title;
            localStorage.setItem(key, JSON.stringify(data));
        }

        function exportDatabase() {
            const backup = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes('system_sales_pro_db_')) {
                    backup[key] = localStorage.getItem(key);
                }
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Ameen_Alshaibani_Sales_Pro_Backup_${selectedActiveYear}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("تم تصدير قاعدة بيانات المبيعات بنجاح!", "success");
        }

        function loadPageView(title, icon) {
            const area = document.getElementById('mainContentArea');
            let data = getPageData(title);

            area.innerHTML = `
                <div id="printableArea" class="bg-white border border-slate-200 rounded-2xl p-4 max-w-6xl w-full mx-auto shadow-md flex flex-col h-full overflow-hidden">
                    <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-100 shrink-0 gap-2">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-blue-50 border border-blue-100 flex items-center justify-center text-sm shadow-inner">${icon}</div>
                            <div>
                                <h2 class="font-bold text-xs text-slate-800">${title} والعملاء (السنة المالية: ${selectedActiveYear})</h2>
                                <p class="text-[10px] text-slate-500">إدارة ملفات العملاء، حدود الائتمان، فواتير البيع، وعروض الأسعار طبقاً للخريطة المحاسبية</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="openSalesModal(-1)" class="bg-accentBlue hover:bg-accentHover text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1 shadow"><i data-lucide="plus" class="w-3.5 h-3.5"></i> إصدار فاتورة / عميل جديد</button>
                            <button onclick="exportDatabase()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1 shadow"><i data-lucide="download" class="w-3.5 h-3.5"></i> تصدير البيانات</button>
                            <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1"><i data-lucide="printer" class="w-3.5 h-3.5"></i> طباعة</button>
                        </div>
                    </div>

                    <div class="border border-slate-200 rounded-xl overflow-hidden flex flex-col flex-grow mt-2">
                        <div class="bg-slate-50 px-3 py-1.5 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between items-center shrink-0">
                            <span>قائمة فواتير وحركة المبيعات (${data.length} سجلات نشطة)</span>
                            <span class="text-[10px] text-emerald-600 font-bold">● مربوط تلقائياً بدفتر الأستاذ العام والدفاتر الفرعية</span>
                        </div>
                        <div class="overflow-y-auto flex-grow">
                            <table class="w-full text-right text-xs">
                                <thead class="bg-slate-50 text-slate-600 border-b border-slate-200 sticky top-0">
                                    <tr>
                                        <th class="p-2">#</th>
                                        <th class="p-2">رقم الفاتورة</th>
                                        <th class="p-2">اسم العميل / الهاتف</th>
                                        <th class="p-2">نوع المعاملة</th>
                                        <th class="p-2">الأصناف والبنود</th>
                                        <th class="p-2">إجمالي المبلغ</th>
                                        <th class="p-2 text-center">العمليات والخيارات</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 bg-white">
                                    ${data.length === 0 ? `<tr><td colspan="7" class="p-6 text-center text-slate-400 text-xs">لا توجد فواتير مبيعات مسجلة حالياً.</td></tr>` :
                                      data.map((item, index) => `
                                        <tr class="hover:bg-slate-50 transition-all">
                                            <td class="p-2 font-mono text-slate-400">${index + 1}</td>
                                            <td class="p-2 font-mono font-bold text-blue-600">${item.invNum}</td>
                                            <td class="p-2 font-bold text-slate-800">${item.client}<br><span class="text-[10px] font-normal text-slate-400">${item.phone}</span></td>
                                            <td class="p-2 text-slate-700"><span class="px-2 py-0.5 rounded bg-blue-50 text-accentBlue font-bold text-[10px]">${item.type}</span></td>
                                            <td class="p-2 text-slate-600 max-w-xs truncate">${item.items}</td>
                                            <td class="p-2 font-bold text-emerald-600 font-mono">${item.total}</td>
                                            <td class="p-2 text-center space-x-1 space-x-reverse">
                                                <button onclick="openSalesModal(${index})" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[10px] font-bold cursor-pointer transition-all">تعديل</button>
                                                <button onclick="deleteSalesRecord(${index})" class="bg-red-50 hover:bg-red-100 text-red-600 px-2 py-0.5 rounded text-[10px] font-bold cursor-pointer transition-all">حذف</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function openSalesModal(index) {
            document.getElementById('salesEditIndex').value = index;
            if (index === -1) {
                document.getElementById('salesModalTitle').innerText = 'إصدار فاتورة بيع جديدة / ملف عميل تفصيلي';
                document.getElementById('invNumber').value = 'INV-2026-' + Math.floor(100 + Math.random() * 900);
                document.getElementById('invClientName').value = '';
                document.getElementById('invClientPhone').value = '';
                document.getElementById('invCreditLimit').value = '1,000,000 ر.ي';
                document.getElementById('invTotalAmount').value = '';
                document.getElementById('invItemsDesc').value = '';
            } else {
                document.getElementById('salesModalTitle').innerText = 'تعديل بيانات فاتورة المبيعات والسجل';
                let data = getPageData('إدارة المبيعات');
                let record = data[index];
                document.getElementById('invNumber').value = record.invNum;
                document.getElementById('invClientName').value = record.client;
                document.getElementById('invClientPhone').value = record.phone;
                document.getElementById('invType').value = record.type;
                document.getElementById('invTotalAmount').value = record.total;
                document.getElementById('invItemsDesc').value = record.items;
            }
            toggleModal('salesModal');
        }

        function handleSalesFormSubmit(event) {
            event.preventDefault();
            const editIndex = parseInt(document.getElementById('salesEditIndex').value);
            const invNum = document.getElementById('invNumber').value.trim();
            const client = document.getElementById('invClientName').value.trim();
            const phone = document.getElementById('invClientPhone').value.trim();
            const type = document.getElementById('invType').value;
            const total = document.getElementById('invTotalAmount').value.trim();
            const items = document.getElementById('invItemsDesc').value.trim();

            if (!invNum || !client || !total) {
                showToast("تنبيه: حقول رقم الفاتورة واسم العميل والإجمالي إجبارية!", "error");
                return;
            }

            let data = getPageData('إدارة المبيعات');
            if (editIndex === -1) {
                data.push({ id: Date.now(), invNum, client, phone, type, total, items });
                showToast("تم إصدار وحفظ وترحيل الفاتورة بنجاح!", "success");
            } else {
                data[editIndex] = { id: data[editIndex].id, invNum, client, phone, type, total, items };
                showToast("تم تحديث الفاتورة والسجل بنجاح!", "success");
            }
            savePageData('إدارة المبيعات', data);
            toggleModal('salesModal');
            loadPageView('إدارة المبيعات', '🛒');
        }

        function deleteSalesRecord(index) {
            if (confirm("هل أنت متأكد من حذف فاتورة المبيعات هذه نهائياً؟")) {
                let data = getPageData('إدارة المبيعات');
                data.splice(index, 1);
                savePageData('إدارة المبيعات', data);
                showToast("تم حذف الفاتورة وتحديث الحسابات بنجاح.", "success");
                loadPageView('إدارة المبيعات', '🛒');
            }
        }
    </script>
</body>
</html>
