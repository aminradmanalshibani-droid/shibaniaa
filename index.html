    <!-- نافذة منبثقة مخصصة ديناميكياً لكل زر على حدة -->

                    </div>

                        <label class="block text-[11px] font-bold text-slate-700 mb-1" id="lblField2">الحقل 2</label>

                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-1" id="lblField3">الحقل 3</label>
                        <input type="text" id="uniField3" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-accentBlue">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

                        <label class="block text-[11px] font-bold text-slate-700 mb-1" id="lblField4">الحقل 4</label>
                        <input type="text" id="uniField4" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-accentBlue">

                    </div>

                    <textarea id="uniField6" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-accentBlue" placeholder="اكتب الملاحظات والتفاصيل هنا..."></textarea>

                </div>

    <script>
        lucide.createIcons();
        let selectedActiveYear = '2026';
        let currentActivePage = 'إدارة المبيعات';
        let currentActiveIcon = '🛒';

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-2 px-3.5 py-2.5 rounded-xl text-xs font-bold shadow-xl transition-all duration-300 translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600 text-white border border-emerald-500' : 'bg-red-600 text-white border border-red-500'
            }`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleLogin(event) {
            event.preventDefault();
            const userInput = document.getElementById('loginUser').value.trim();
            const passInput = document.getElementById('loginPassword').value.trim();

            if (userInput === 'admin' && passInput === '123456') {
                showToast("تم تشغيل النظام المحاسبي المتكامل بنجاح!", "success");
                document.getElementById('loginSection').classList.add('hidden');
                const dash = document.getElementById('dashboardSection');
                dash.classList.remove('hidden');
                dash.classList.add('flex');
                loadPageView('إدارة المبيعات', '🛒');
            } else {
                showToast("بيانات الدخول غير صحيحة (admin / 123456).", "error");
            }
        }

        function lockSystem() {
            document.getElementById('dashboardSection').classList.remove('flex');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            showToast("تم قفل النظام بنجاح.", "success");
        }

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.toggle('hidden');
        }

        function loadHomeView() {
            loadPageView('إدارة المبيعات', '🛒');
        }

        // إعدادات خاصة ومستقلة لكل زر على حدة
        function getPageConfig(title) {
            if (title === 'إدارة المبيعات') {
                return {
                    headers: ['#', 'رقم الفاتورة', 'اسم العميل', 'نوع البيع (نقدي/آجل)', 'حالة السداد', 'إجمالي الفاتورة', 'بيان الأصناف المباعة'],
                    defaultData: [
                        { id: 1, f1: 'INV-1001', f2: 'مؤسسة النور التجارية', f3: 'بيع آجل', f4: 'معتمد وغير مسدد', f5: '450,000 ر.ي', f6: '2x شاشة ذكية، 5x راوتر شبكات' }
                    ]
                };
            }
            if (title === 'إدارة العملاء') {
                return {
                    headers: ['#', 'كود العميل', 'اسم العميل الثلاثي', 'رقم الهاتف والمنطقة', 'حد الإئتمان المسموح', 'الرصيد الحالي', 'ملاحظات وحالة الحساب'],
                    defaultData: [
                        { id: 1, f1: 'CUS-501', f2: 'أحمد علي القاضي', f3: '771234567 - تعز / التربة', f4: '1,000,000 ر.ي', f5: '450,000 ر.ي مدين', f6: 'عميل منتظم ومسجل رسمياً' }
                    ]
                };
            }
            if (title === 'إدارة المشتريات') {
                return {
                    headers: ['#', 'رقم أمر الشراء', 'اسم المورد', 'نوع الشراء (نقدي/آجل)', 'شروط الاستلام', 'قيمة المشتريات', 'تفاصيل الأصناف الواردة'],
                    defaultData: [
                        { id: 1, f1: 'PO-101', f2: 'شركة الاستيراد الحديثة', f3: 'شراء آجل', f4: 'مستودع رئيسي', f5: '850,000 ر.ي', f6: 'توريد أجهزة حاسوب وشاشات عرض' }
                    ]
                };
            }
            if (title === 'إدارة الموردين') {
                return {
                    headers: ['#', 'كود المورد', 'اسم الشركة / المورد', 'رقم المسؤول والهاتف', 'طبيعة التوريد', 'الرصيد المستحق', 'شروط وفترات السداد'],
                    defaultData: [
                        { id: 1, f1: 'SUP-301', f2: 'شركة الاستيراد الحديثة', f3: '733445566 - صنعاء/تعز', f4: 'أجهزة إلكترونية وشبكات', f5: '850,000 ر.ي دائن', f6: 'آجل لمدة 30 يوماً' }
                    ]
                };
            }
            if (title === 'إدارة المخزون') {
                return {
                    headers: ['#', 'كود الصنف', 'اسم الصنف ووحدته', 'المستودع المخزن فيه', 'الكمية المتوفرة', 'سعر التكلفة الإجمالي', 'مواصفات الصنف'],
                    defaultData: [
                        { id: 1, f1: 'STK-01', f2: 'شاشة ذكية 32 بوصة', f3: 'المستودع الرئيسي - تعز', f4: '15 وحدة', f5: '2,400,000 ر.ي', f6: 'أصناف أصلية ومفحوصة' }
                    ]
                };
            }
            if (title === 'الأصول الثابتة') {
                return {
                    headers: ['#', 'كود الأصل', 'اسم الأصل الثابت', 'موقع الاستخدام', 'نسبة الإهلاك السنوي', 'القيمة الدفترية', 'حالة الصيانة والضمان'],
                    defaultData: [
                        { id: 1, f1: 'AST-01', f2: 'أجهزة الحاسوب والشبكات', f3: 'الإدارة العامة - تعز', f4: '10% سنوياً', f5: '1,200,000 ر.ي', f6: 'بحالة ممتازة وتحت الضمان' }
                    ]
                };
            }
            if (title === 'الموارد البشرية') {
                return {
                    headers: ['#', 'رقم الموظف', 'الاسم الثلاثي', 'المسمى الوظيفي', 'تاريخ التعيين', 'الحالة الوظيفية', 'القسم التابع له'],
                    defaultData: [
                        { id: 1, f1: 'EMP-01', f2: 'أمين ردمان الشيباني', f3: 'مدير النظام المحاسبي', f4: '2020/01/01', f5: 'على رأس العمل', f6: 'الإدارة والتقنية' }
                    ]
                };
            }
            if (title === 'مسير الرواتب') {
                return {
                    headers: ['#', 'رقم المسير', 'اسم الموظف', 'الراتب الأساسي', 'الإضافات والبدلات', 'الاستقطاعات والخصومات', 'صافي الراتب المستحق'],
                    defaultData: [
                        { id: 1, f1: 'PAY-2026', f2: 'أمين ردمان الشيباني', f3: '250,000 ر.ي', f4: '50,000 ر.ي', f5: '10,000 ر.ي', f6: '290,000 ر.ي' }
                    ]
                };
            }
            if (title === 'دفتر الأستاذ') {
                return {
                    headers: ['#', 'رقم القيد', 'الحساب المدين', 'الحساب الدائن', 'نوع القيد المحاسبي', 'مبلغ الحركة', 'شرح البيان والتوجيه'],
                    defaultData: [
                        { id: 1, f1: 'JE-001', f2: 'حساب الصندوق الرئيسي', f3: 'حساب رأس المال', f4: 'قيد افتتاحى', f5: '5,000,000 ر.ي', f6: 'إثبات رأس المال والأرصدة' }
                    ]
                };
            }
            if (title === 'المخرجات المالية') {
                return {
                    headers: ['#', 'رمز التقرير', 'اسم التقرير المالي', 'الفترة المالية', 'حالة الاعتماد', 'المؤشر المالي', 'خلاصة النتائج'],
                    defaultData: [
                        { id: 1, f1: 'REP-01', f2: 'قائمة المركز المالي (الميزانية)', f3: 'السنة المالية 2026', f4: 'تقرير معتمد', f5: 'مطابق 100%', f6: 'الأصول تساوي الخصوم وحقوق الملكية' }
                    ]
                };
            }
            return {
                headers: ['#', 'الكود', 'البيان الرئيسي', 'التفاصيل', 'التصنيف', 'القيمة', 'ملاحظات'],
                defaultData: [{ id: 1, f1: 'REC-01', f2: 'سجل افتراضي', f3: 'افتراضي', f4: 'معتمد', f5: '0 ر.ي', f6: 'بيانات عامة' }]
            };
        }

        // تسميات الحقول المنبثقة لكل زر
        function getModalFieldLabels(title) {
            if (title === 'إدارة المبيعات') return ['رقم الفاتورة', 'اسم العميل', 'نوع البيع (نقدي/آجل)', 'حالة السداد', 'إجمالي الفاتورة', 'بيان الأصناف المباعة'];
            if (title === 'إدارة العملاء') return ['كود العميل', 'اسم العميل الثلاثي', 'رقم الهاتف والمنطقة', 'حد الإئتمان المسموح', 'الرصيد الحالي', 'ملاحظات وحالة الحساب'];
            if (title === 'إدارة المشتريات') return ['رقم أمر الشراء', 'اسم المورد', 'نوع الشراء (نقدي/آجل)', 'شروط الاستلام', 'قيمة المشتريات', 'تفاصيل الأصناف الواردة'];
            if (title === 'إدارة الموردين') return ['كود المورد', 'اسم الشركة / المورد', 'رقم المسؤول والهاتف', 'طبيعة التوريد', 'الرصيد المستحق', 'شروط وفترات السداد'];
            if (title === 'إدارة المخزون') return ['كود الصنف', 'اسم الصنف ووحدته', 'المستودع المخزن فيه', 'الكمية المتوفرة', 'سعر التكلفة الإجمالي', 'مواصفات الصنف'];
            if (title === 'الأصول الثابتة') return ['كود الأصل', 'اسم الأصل الثابت', 'موقع الاستخدام', 'نسبة الإهلاك السنوي', 'القيمة الدفترية', 'حالة الصيانة والضمان'];
            if (title === 'الموارد البشرية') return ['رقم الموظف', 'الاسم الثلاثي', 'المسمى الوظيفي', 'تاريخ التعيين', 'الحالة الوظيفية', 'القسم التابع له'];
            if (title === 'مسير الرواتب') return ['رقم المسير', 'اسم الموظف', 'الراتب الأساسي', 'الإضافات والبدلات', 'الاستقطاعات والخصومات', 'صافي الراتب المستحق'];
            if (title === 'دفتر الأستاذ') return ['رقم القيد', 'الحساب المدين', 'الحساب الدائن', 'نوع القيد المحاسبي', 'مبلغ الحركة', 'شرح البيان والتوجيه'];
            if (title === 'المخرجات المالية') return ['رمز التقرير', 'اسم التقرير المالي', 'الفترة المالية', 'حالة الاعتماد', 'المؤشر المالي', 'خلاصة النتائج'];
            return ['الحقل 1', 'الحقل 2', 'الحقل 3', 'الحقل 4', 'القيمة', 'الملاحظات'];
        }

        function getPageData(title) {
            const key = 'system_independent_btns_db_' + selectedActiveYear + '_' + title;
            const saved = localStorage.getItem(key);
            if (saved) return JSON.parse(saved);
            return getPageConfig(title).defaultData;
        }

        function savePageData(title, data) {
            const key = 'system_independent_btns_db_' + selectedActiveYear + '_' + title;
            localStorage.setItem(key, JSON.stringify(data));
        }

        function exportDatabase() {
            const backup = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.includes('system_independent_btns_db_')) {
                    backup[key] = localStorage.getItem(key);
                }
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Ameen_Alshaibani_Independent_System_Backup_${selectedActiveYear}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("تم تصدير قواعد البيانات المستقلة بنجاح!", "success");
        }

        function loadPageView(title, icon) {
            currentActivePage = title;
            currentActiveIcon = icon;
            const area = document.getElementById('mainContentArea');
            let config = getPageConfig(title);
            let data = getPageData(title);

            area.innerHTML = `
                <div id="printableArea" class="bg-white border border-slate-200 rounded-2xl p-4 max-w-6xl w-full mx-auto shadow-md flex flex-col h-full overflow-hidden">
                    <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-100 shrink-0 gap-2">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-blue-50 border border-blue-100 flex items-center justify-center text-sm shadow-inner">${icon}</div>
                            <div>
                                <h2 class="font-bold text-xs text-slate-800">${title} (السنة المالية: ${selectedActiveYear})</h2>
                                <p class="text-[10px] text-slate-500">صفحة مستقلة ومكتملة الحقول والمهام خاصة بزر ${title}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="openUniversalModal(-1)" class="bg-accentBlue hover:bg-accentHover text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1 shadow"><i data-lucide="plus" class="w-3.5 h-3.5"></i> إضافة سجل جديد</button>
                            <button onclick="exportDatabase()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1 shadow"><i data-lucide="download" class="w-3.5 h-3.5"></i> تصدير</button>
                            <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer flex items-center gap-1"><i data-lucide="printer" class="w-3.5 h-3.5"></i> طباعة</button>
                        </div>
                    </div>

                    <div class="border border-slate-200 rounded-xl overflow-hidden flex flex-col flex-grow mt-2">
                        <div class="bg-slate-50 px-3 py-1.5 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between items-center shrink-0">
                            <span>سجلات قسم ${title} (${data.length} سجلات نشطة)</span>
                            <span class="text-[10px] text-emerald-600 font-bold">● زر مستقل ببياناته الخاصة 100%</span>
                        </div>
                        <div class="overflow-y-auto flex-grow">
                            <table class="w-full text-right text-xs">
                                <thead class="bg-slate-50 text-slate-600 border-b border-slate-200 sticky top-0">
                                    <tr>
                                        <th class="p-2">${config.headers[0]}</th>
                                        <th class="p-2">${config.headers[1]}</th>
                                        <th class="p-2">${config.headers[2]}</th>
                                        <th class="p-2">${config.headers[3]}</th>
                                        <th class="p-2">${config.headers[4]}</th>
                                        <th class="p-2">${config.headers[5]}</th>
                                        <th class="p-2">${config.headers[6]}</th>
                                        <th class="p-2 text-center">الخيارات</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 bg-white">
                                    ${data.length === 0 ? `<tr><td colspan="8" class="p-6 text-center text-slate-400 text-xs">لا توجد سجلات مسجلة في هذا القسم حالياً.</td></tr>` :
                                      data.map((item, index) => `
                                        <tr class="hover:bg-slate-50 transition-all">
                                            <td class="p-2 font-mono text-slate-400">${index + 1}</td>
                                            <td class="p-2 font-mono font-bold text-blue-600">${item.f1}</td>
                                            <td class="p-2 font-bold text-slate-800">${item.f2}</td>
                                            <td class="p-2 text-slate-600">${item.f3}</td>
                                            <td class="p-2 text-slate-700"><span class="px-2 py-0.5 rounded bg-blue-50 text-accentBlue font-bold text-[10px]">${item.f4}</span></td>
                                            <td class="p-2 font-bold text-emerald-600 font-mono">${item.f5}</td>
                                            <td class="p-2 text-slate-600 text-[11px]">${item.f6}</td>
                                            <td class="p-2 text-center space-x-1 space-x-reverse whitespace-nowrap">
                                                <button onclick="openUniversalModal(${index})" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[10px] font-bold cursor-pointer transition-all">تعديل</button>
                                                <button onclick="deleteUniversalRecord(${index})" class="bg-red-50 hover:bg-red-100 text-red-600 px-2 py-0.5 rounded text-[10px] font-bold cursor-pointer transition-all">حذف</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function openUniversalModal(index) {
            document.getElementById('uniEditIndex').value = index;
            document.getElementById('uniPageTitle').value = currentActivePage;
            document.getElementById('modalIconTitle').innerText = currentActiveIcon;

            let labels = getModalFieldLabels(currentActivePage);
            document.getElementById('lblField1').innerText = labels[0];
            document.getElementById('lblField2').innerText = labels[1];
            document.getElementById('lblField3').innerText = labels[2];
            document.getElementById('lblField4').innerText = labels[3];
            document.getElementById('lblField5').innerText = labels[4];
            document.getElementById('lblField6').innerText = labels[5];

            if (index === -1) {
                document.getElementById('universalModalTitle').innerText = `إضافة سجل جديد في: ${currentActivePage}`;
                document.getElementById('uniField1').value = 'REF-' + Math.floor(100 + Math.random() * 900);
                document.getElementById('uniField2').value = '';
                document.getElementById('uniField3').value = '';
                document.getElementById('uniField4').value = '';
                document.getElementById('uniField5').value = '';
                document.getElementById('uniField6').value = '';
            } else {
                document.getElementById('universalModalTitle').innerText = `تعديل السجل في: ${currentActivePage}`;
                let data = getPageData(currentActivePage);
                let record = data[index];
                document.getElementById('uniField1').value = record.f1;
                document.getElementById('uniField2').value = record.f2;
                document.getElementById('uniField3').value = record.f3;
                document.getElementById('uniField4').value = record.f4;
                document.getElementById('uniField5').value = record.f5;
                document.getElementById('uniField6').value = record.f6;
            }
            toggleModal('universalModal');
        }

        function handleUniversalFormSubmit(event) {
            event.preventDefault();
            const editIndex = parseInt(document.getElementById('uniEditIndex').value);
            const pageTitle = document.getElementById('uniPageTitle').value;
            const f1 = document.getElementById('uniField1').value.trim();
            const f2 = document.getElementById('uniField2').value.trim();
            const f3 = document.getElementById('uniField3').value.trim();
            const f4 = document.getElementById('uniField4').value.trim();
            const f5 = document.getElementById('uniField5').value.trim();
            const f6 = document.getElementById('uniField6').value.trim();

            if (!f1 || !f2 || !f5) {
                showToast("تنبيه: الحقول الأساسية إجبارية!", "error");
                return;
            }

            let data = getPageData(pageTitle);
            if (editIndex === -1) {
                data.push({ id: Date.now(), f1, f2, f3, f4, f5, f6 });
                showToast("تم حفظ السجل بنجاح!", "success");
            } else {
                data[editIndex] = { id: data[editIndex].id, f1, f2, f3, f4, f5, f6 };
                showToast("تم تحديث السجل بنجاح!", "success");
            }
            savePageData(pageTitle, data);
            toggleModal('universalModal');
            loadPageView(pageTitle, currentActiveIcon);
        }

        function deleteUniversalRecord(index) {
            if (confirm("هل أنت متأكد من حذف هذا السجل نهائياً؟")) {
                let data = getPageData(currentActivePage);
                data.splice(index, 1);
                savePageData(currentActivePage, data);
                showToast("تم حذف السجل بنجاح.", "success");
                loadPageView(currentActivePage, currentActiveIcon);
            }
        }
    </script>
</body>
</html>
