<script id="phase18-final-nav-fix">
(function(){
  'use strict';

  function closeNavigationMenus(){
    var sidebar=document.getElementById('sidebar');
    if(sidebar) sidebar.classList.remove('open');

    /* إغلاق أي قوائم منسدلة تستخدمها الإضافات السابقة، دون المساس بالقوائم الأخرى */
    document.querySelectorAll(
      '.dropdown.open,.submenu.open,.nav-dropdown.open,.dropdown-menu.open,.nav-submenu.open'
    ).forEach(function(el){ el.classList.remove('open'); });

    document.querySelectorAll('.dropdown-menu,.submenu,.nav-submenu').forEach(function(el){
      if(el.style && el.style.display==='block') el.style.display='none';
    });
  }

  /* Capture phase: الإغلاق يحدث قبل تنفيذ onclick للزر، لذلك لا تبقى القائمة مفتوحة. */
  document.addEventListener('click',function(e){
    var target=e.target;
    if(!target || !target.closest) return;
    var navItem=target.closest('#sidebar button,#sidebar a,[data-page]');
    if(navItem) closeNavigationMenus();
  },true);

  /* أي انتقال عبر loadPage يغلق القائمة أيضًا، بما في ذلك الأزرار التي لا تستخدم nav-btn. */
  function wrapLoadPage(){
    if(typeof window.loadPage!=='function' || window.__SHEIBANI_PHASE18_FINAL_NAV__) return;
    var base=window.loadPage;
    var wrapped=function(){
      closeNavigationMenus();
      return base.apply(this,arguments);
    };
    wrapped.__phase18FinalNav=true;
    window.loadPage=wrapped;
    window.__SHEIBANI_PHASE18_FINAL_NAV__=true;
  }

  wrapLoadPage();
  var tries=0;
  var timer=setInterval(function(){
    if(window.__SHEIBANI_PHASE18_FINAL_NAV__){clearInterval(timer);return;}
    wrapLoadPage();
    if(++tries>50) clearInterval(timer);
  },100);

  window.closeNavigationMenus18=closeNavigationMenus;
})();
</script>

<script id="phase20-data-protection-js">

 async function collect(){const stores={};let total=0;for(const st of STORES){const rows=await all(st);stores[st]=rows;total+=rows.length}return {schema:'SheibaniAccounting2026',version:DB_VERSION,date:new Date().toISOString(),currency:BASE_CURRENCY,stores,total}}
 async function check(){const rows=[];let total=0;for(const st of STORES){const n=(await all(st)).length;total+=n;rows.push({store:st,count:n,status:'سليم'})}return {rows,total,stores:STORES.length}}
 window.renderBackup20=async function(){const c=document.getElementById('content'),h=hist(),q=await check();c.innerHTML=shell('مركز حماية البيانات',`<div class="p20-head"><div><b>النسخ الاحتياطي والاستعادة المتقدمة</b><div class="p20-note">حماية بيانات النظام المحلي مع فحص سلامة النسخة قبل الاستعادة.</div></div><span class="p20-badge">IndexedDB · SAR · Offline</span></div><div class="p20-kpis" style="margin-top:8px"><div class="p20-kpi"><div class="v">${q.total}</div><div class="l">إجمالي السجلات</div></div><div class="p20-kpi"><div class="v">${q.stores}</div><div class="l">جداول النظام</div></div><div class="p20-kpi"><div class="v">${h.length}</div><div class="l">عمليات النسخ المسجلة</div></div><div class="p20-kpi"><div class="v p20-ok">سليم</div><div class="l">حالة البيانات</div></div></div><div class="grid g2" style="margin-top:8px"><div class="card"><b>إنشاء نسخة احتياطية</b><p class="p20-note">يشمل جميع جداول النظام في ملف JSON مستقل.</p><div class="p20-actions"><button class="btn primary" onclick="backup20()">⬇ إنشاء وتصدير نسخة</button><button class="btn secondary" onclick="checkData20()">✓ فحص سلامة البيانات</button></div></div><div class="card"><b>استعادة نسخة احتياطية</b><p class="p20-note">يتم فحص الملف أولًا قبل السماح بالاستعادة.</p><div class="p20-drop"><input id="p20RestoreFile" type="file" accept=".json,application/json" onchange="previewRestore20(event)"><div id="p20Preview" class="p20-note" style="margin-top:7px">اختر ملف JSON للبدء.</div></div></div></div><div class="card" style="margin-top:8px"><b>تفاصيل جداول البيانات</b><div class="p20-table-wrap" style="margin-top:7px"><table class="p20-table"><thead><tr><th>الجدول</th><th>عدد السجلات</th><th>الحالة</th></tr></thead><tbody>${q.rows.map(x=>`<tr><td>${esc(x.store)}</td><td>${x.count}</td><td class="p20-ok">${x.status}</td></tr>`).join('')}</tbody></table></div></div><div class="card" style="margin-top:8px"><b>سجل العمليات الأخيرة</b><div class="p20-table-wrap" style="margin-top:7px"><table class="p20-table"><thead><tr><th>التاريخ</th><th>النوع</th><th>السجلات</th><th>الحالة</th></tr></thead><tbody>${h.length?h.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.type)}</td><td>${x.total||0}</td><td class="p20-ok">${esc(x.status||'ناجحة')}</td></tr>`).join(''):'<tr><td colspan="4" class="p20-note">لا توجد عمليات سابقة.</td></tr>'}</tbody></table></div></div>`)};
 window.backup20=async function(){try{const data=await collect(),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Sheibani_DB_2026_Backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);const h=hist();h.push({date:stamp(),type:'نسخة احتياطية',total:data.total,status:'ناجحة'});saveHist(h);toast('تم إنشاء النسخة الاحتياطية بنجاح');setTimeout(()=>loadPage('backup'),250)}catch(e){toast('فشل إنشاء النسخة: '+e.message,'error')}};
 window.checkData20=async function(){try{const q=await check();if(q.rows.some(x=>x.count<0))throw Error('تم اكتشاف خلل في عدد السجلات');toast('فحص سلامة البيانات: جميع الجداول سليمة')}catch(e){toast('نتيجة الفحص: '+e.message,'error')}};
 window.previewRestore20=async function(e){const f=e.target.files&&e.target.files[0],box=document.getElementById('p20Preview');if(!f)return;if(f.size>30*1024*1024){box.innerHTML='<span class="p20-danger">الملف أكبر من 30MB.</span>';return}try{const obj=JSON.parse(await f.text());if(!obj||!obj.stores||typeof obj.stores!=='object')throw Error('صيغة النسخة غير صحيحة');let total=0;for(const st of STORES)total+=Array.isArray(obj.stores[st])?obj.stores[st].length:0;box.innerHTML=`<span class="p20-ok">✓ النسخة صالحة</span><br>الإصدار: ${esc(String(obj.version||'غير محدد'))}<br>التاريخ: ${esc(String(obj.date||'غير محدد'))}<br>عدد السجلات: ${total}<br><button class="btn primary" style="margin-top:7px" onclick="restore20Pending()">↻ تأكيد الاستعادة</button>`;window._p20RestoreObj=obj}catch(err){window._p20RestoreObj=null;box.innerHTML='<span class="p20-danger">✕ ملف غير صالح: '+esc(err.message)+'</span>'}};
 window.restore20Pending=async function(){const obj=window._p20RestoreObj;if(!obj)return;if(!confirm('سيتم استبدال البيانات الحالية بالنسخة المحددة. هل تريد المتابعة؟'))return;try{let total=0;for(const st of STORES){const rows=Array.isArray(obj.stores[st])?obj.stores[st]:[];total+=rows.length;const old=await all(st);for(const x of old)if(x&&x.id!=null)await remove(st,x.id);for(const x of rows)await put(st,x)}const h=hist();h.push({date:stamp(),type:'استعادة نسخة',total,status:'ناجحة'});saveHist(h);toast('تمت استعادة النسخة بنجاح');setTimeout(()=>loadPage('dashboard'),400)}catch(err){toast('فشل الاستعادة: '+err.message,'error')}};
})();
</script>

<script id="phase21-workflow-js">
/* ========================= المرحلة الحادية والعشرون — مركز العمليات المعلقة وسير العمل ========================= */
const PHASE21_WORKFLOW_VERSION='21.0';
function p21n(v){return Number(v)||0}
function p21d(v){return String(v||'').slice(0,10)}
function p21esc(v){return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function p21All(store){try{return await all(store)}catch(e){return []}}
function p21Status(x){return String(x?.status||'').trim()}
function p21DateText(x){return p21d(x?.date||x?.createdAt||x?.updatedAt||'')||'—'}
function p21IsDraft(x){return ['مسودة','معلق','معلّق','غير مرحل','غير مُرحل'].includes(p21Status(x)) || x?.posted===false}
async function p21Collect(){
 const [sales,purchases,journal,quotations,purchaseOrders,salesOrders,suspended,returnsS,returnsP]=await Promise.all([
  p21All('salesInvoices'),p21All('purchaseInvoices'),p21All('journal'),p21All('quotations'),p21All('purchaseOrders'),p21All('salesOrders'),p21All('suspendedSales'),p21All('salesReturns'),p21All('purchaseReturns')
 ]);
 const groups=[
  {key:'sales',name:'فواتير المبيعات',icon:'🧾',rows:sales.filter(p21IsDraft),route:'salesInvoices'},
  {key:'purchases',name:'فواتير المشتريات',icon:'🛒',rows:purchases.filter(p21IsDraft),route:'purchaseInvoices'},
  {key:'journal',name:'القيود اليومية',icon:'📝',rows:journal.filter(p21IsDraft),route:'journal'},
  {key:'quotations',name:'عروض الأسعار',icon:'📄',rows:quotations.filter(x=>!['مكتمل','محوّل','ملغى'].includes(p21Status(x))),route:'quotations'},
  {key:'salesOrders',name:'أوامر البيع',icon:'📋',rows:salesOrders.filter(x=>!['مكتمل','ملغى'].includes(p21Status(x))),route:'salesOrders'},
  {key:'purchaseOrders',name:'أوامر الشراء',icon:'📋',rows:purchaseOrders.filter(x=>!['مكتمل','ملغى'].includes(p21Status(x))),route:'purchaseOrders'},
  {key:'suspended',name:'فواتير POS المعلقة',icon:'⏸️',rows:suspended,route:'suspendedSales'},
  {key:'salesReturns',name:'مرتجعات المبيعات',icon:'↩️',rows:returnsS.filter(p21IsDraft),route:'salesReturns'},
  {key:'purchaseReturns',name:'مرتجعات المشتريات',icon:'↩️',rows:returnsP.filter(p21IsDraft),route:'purchaseReturns'}
 ];
 groups.forEach(g=>g.count=g.rows.length);
 return {groups,total:groups.reduce((a,g)=>a+g.count,0)};
}
function p21Route(route){try{if(typeof loadPage==='function')loadPage(route)}catch(e){toast('تعذر فتح الصفحة','error')}}
function p21Row(g,x){
 const id=x?.id??''; const code=x?.code||x?.invoiceNo||x?.number||x?.name||('سجل #'+id); const amount=p21n(x?.netTotal??x?.total??x?.grandTotal??x?.amount); const cur=x?.currency||BASE_CURRENCY||'SAR';
 return `<div class="p21-row"><div class="p21-row-main"><div class="p21-row-title">${g.icon} ${p21esc(code)}</div><div class="p21-row-sub">التاريخ: ${p21esc(p21DateText(x))}${amount?` · القيمة: ${amount.toLocaleString('ar-SA')} ${p21esc(cur)}`:''} · الحالة: ${p21esc(p21Status(x)||'معلق')}</div></div><button class="btn secondary" onclick="p21Route('${g.route}')">فتح الصفحة</button></div>`;
}
async function renderWorkflow21(){
 const data=await p21Collect();
 const counts=data.groups.map(g=>`<div class="p21-card"><div class="p21-muted">${g.icon} ${p21esc(g.name)}</div><div class="p21-kpi">${g.count}</div><div class="p21-muted">عملية تحتاج متابعة</div></div>`).join('');
 document.getElementById('content').innerHTML=shell('⏳ مركز العمليات المعلقة وسير العمل — المرحلة 21',`<div class="p21-toolbar"><button class="btn primary" onclick="renderWorkflow21()">🔄 تحديث</button><button class="btn secondary" onclick="p21OpenAll()">📂 فتح العمليات</button><button class="btn secondary" onclick="p21Export()">⬇ تصدير المتابعة</button></div><div class="p21-grid">${counts}</div><div class="card"><div style="font-weight:900;margin-bottom:8px">📌 قائمة المتابعة</div><div id="p21Results" class="p21-list"></div></div>`);
 p21RenderList(data);
}
function p21RenderList(data){
 const box=document.getElementById('p21Results'); if(!box)return;
 const rows=[]; data.groups.forEach(g=>g.rows.slice(0,50).forEach(x=>rows.push(p21Row(g,x))));
 box.innerHTML=rows.length?rows.join(''):`<div class="p21-empty">✅ لا توجد عمليات معلقة أو مسودات تحتاج إلى متابعة حالياً.</div>`;
}
async function p21OpenAll(){
 const data=await p21Collect(); const first=data.groups.find(g=>g.count); if(first)p21Route(first.route); else toast('لا توجد عمليات معلقة حالياً');
}
async function p21Export(){
 const data=await p21Collect(); const payload={schema:'SheibaniAccounting2026',phase:21,version:PHASE21_WORKFLOW_VERSION,date:new Date().toISOString(),currency:BASE_CURRENCY||'SAR',total:data.total,groups:data.groups.map(g=>({key:g.key,name:g.name,count:g.count,records:g.rows}))};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Sheibani_Workflow_21_'+p21d(new Date().toISOString())+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),500); toast('تم تصدير تقرير المتابعة');
}
function p21InjectNavigation(){
 if(document.getElementById('p21NavMarker'))return; const sb=document.getElementById('sidebar'); if(!sb)return; const x=document.createElement('div'); x.id='p21NavMarker'; x.innerHTML=`<div class="nav-title">المرحلة 21 — سير العمل</div><button class="nav-btn" onclick="loadPage('workflow21')">⏳ مركز العمليات المعلقة</button>`; sb.appendChild(x);
}
const p21BaseLoadPage=window.loadPage;
window.loadPage=async function(page){if(page==='workflow21')return renderWorkflow21();return p21BaseLoadPage(page)};
window.addEventListener('DOMContentLoaded',()=>setTimeout(p21InjectNavigation,220));
window.__SHEIBANI_PHASE21_WORKFLOW__=true;
</script>
<script id="phase22-reconciliation-js">
/* المرحلة 22 — مركز المطابقة والتسويات الذكية */
const PHASE22_RECON_VERSION='22.0.0';
function p22n(v){const n=Number(v);return Number.isFinite(n)?n:0}
function p22esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function p22date(x){return x?.date||x?.invoiceDate||x?.createdAt||x?.created_at||''}
function p22status(x){return String(x?.status||x?.state||'').trim()}
async function p22All(store){try{return await all(store)}catch(e){return[]}}
function p22Remaining(x){const total=p22n(x?.netTotal??x?.grandTotal??x?.total??x?.amount);const paid=p22n(x?.paid??x?.paidAmount??x?.received??x?.collected);const rem=x?.remaining??x?.balance??x?.due;return Number.isFinite(Number(rem))?p22n(rem):Math.max(0,total-paid)}
async function p22Collect(){
 const [sales,purchases,salesPayments,purchasePayments,journal,inventory,balances,cashBoxes,bankAccounts]=await Promise.all([
  p22All('salesInvoices'),p22All('purchaseInvoices'),p22All('salesPayments'),p22All('purchasePayments'),p22All('journal'),p22All('inventoryBalances'),p22All('items'),p22All('cashBoxes'),p22All('bankAccounts')
 ]);
 const salesOpen=sales.filter(x=>p22Remaining(x)>0 && !['ملغى','cancelled','canceled'].includes(p22status(x)));
 const purchaseOpen=purchases.filter(x=>p22Remaining(x)>0 && !['ملغى','cancelled','canceled'].includes(p22status(x)));
 const unbalanced=journal.filter(j=>{const d=j?.lines||j?.entries||j?.details||[]; if(!Array.isArray(d)||!d.length)return false; const dr=d.reduce((a,l)=>a+p22n(l.debit??l.dr),0),cr=d.reduce((a,l)=>a+p22n(l.credit??l.cr),0);return Math.abs(dr-cr)>0.01});
 const invIssues=[];
 balances.forEach(x=>{const q=p22n(x?.qty??x?.quantity??x?.balance);const item=inventory.find(i=>String(i?.id)===String(x?.itemId));if(q<0)invIssues.push({...x,issue:'رصيد مخزني سالب',itemName:item?.name||x?.itemName||''})});
 inventory.filter(i=>p22n(i?.qty??i?.quantity??i?.stock)<0).forEach(i=>{if(!invIssues.some(x=>String(x.itemId||x.id)===String(i.id)))invIssues.push({...i,issue:'كمية صنف سالبة',itemName:i?.name||''})});
 const cashMissing=cashBoxes.filter(x=>!String(x?.name||x?.code||'').trim());
 const bankMissing=bankAccounts.filter(x=>!String(x?.name||x?.code||'').trim());
 const groups=[
  {key:'sales',name:'ذمم المبيعات المفتوحة',icon:'🧾',count:salesOpen.length,rows:salesOpen,route:'salesInvoices'},
  {key:'purchases',name:'ذمم المشتريات المفتوحة',icon:'🛒',count:purchaseOpen.length,rows:purchaseOpen,route:'purchaseInvoices'},
  {key:'journal',name:'قيود غير متوازنة',icon:'⚖️',count:unbalanced.length,rows:unbalanced,route:'journal'},
  {key:'inventory',name:'مشكلات المخزون',icon:'📦',count:invIssues.length,rows:invIssues,route:'inventoryBalances'},
  {key:'cash',name:'مراجعة الصناديق',icon:'💵',count:cashMissing.length,rows:cashMissing,route:'cashBoxes'},
  {key:'banks',name:'مراجعة الحسابات البنكية',icon:'🏦',count:bankMissing.length,rows:bankMissing,route:'bankAccounts'}
 ];

         if(menu){menu.disabled=true;menu.classList.add('p27-locked');menu.title='سجّل الدخول إلى النظام المحاسبي أولاً';}
       }
     },80);
   },true);
 }
 // لا يسمح بفتح القائمة من واجهة الاختيار قبل تسجيل الدخول المحاسبي.
 const originalToggle=window.toggleSidebar;
 window.toggleSidebar=function(){
   const accounting=(()=>{try{return JSON.parse(sessionStorage.getItem(KEY)||'null')}catch(e){return null}})();
   const valid=!!(accounting&&accounting.username&&accounting.at&&Date.now()-Number(accounting.at)<30*60*1000);
   if(!valid){
     if(typeof window.p27AccountingEntry==='function')return window.p27AccountingEntry('accounts');
     if(typeof window.toast==='function')window.toast('سجّل الدخول إلى النظام المحاسبي أولاً','warning');
     return;
   }
   return originalToggle.apply(this,arguments);
 };
 window.__SHEIBANI_PHASE28_LAUNCH_GATE__=true;
})();
