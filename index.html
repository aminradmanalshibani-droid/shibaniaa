    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="flex-grow flex items-center justify-center p-4 bg-slate-100">
        <div class="bg-white border border-slate-200 rounded-2xl p-8 max-w-md w-full shadow-xl">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-primaryBlue flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/20">
                    <i data-lucide="lock" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-800">النظام التشغيلي المتكامل</h1>
                <p class="text-xs text-slate-500 mt-1">تسجيل الدخول (admin / 123456)</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-600 mb-1">اسم المستخدم</label>
                    <input type="text" id="loginUser" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-primaryBlue font-mono" placeholder="admin">

                <div>
                    <label class="block text-xs text-slate-600 mb-1">كلمة المرور</label>
                    <input type="password" id="loginPassword" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-primaryBlue font-mono" placeholder="123456">
                </div>
                <button type="submit" class="w-full bg-primaryBlue text-white font-bold text-xs py-3 rounded-xl hover:bg-primaryBlueHover transition-all cursor-pointer shadow-lg shadow-blue-500/20">تشغيل النظام</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->

                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="overflow-x-auto no-scrollbar py-1 flex-grow order-2">
                    <nav class="flex items-center gap-1.5 min-w-max justify-center">
                        <button onclick="toggleModal('fileModal')" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-white/25 hover:bg-white/35 border border-white/30 transition-all shadow-sm cursor-pointer whitespace-nowrap flex items-center gap-1.5"><span>📁</span><span>ملف</span></button>
                        <button onclick="toggleModal('viewModal')" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-white/20 hover:bg-white/30 border border-white/30 transition-all shadow-sm cursor-pointer whitespace-nowrap flex items-center gap-1.5"><span>👁️</span><span>عرض</span></button>
                        <button onclick="toggleModal('financeModal')" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-white/30 hover:bg-white/40 border border-white/40 transition-all shadow-sm cursor-pointer whitespace-nowrap flex items-center gap-1.5 ring-2 ring-white/50"><span>⚖️</span><span>ميزان المراجعة (نشط)</span></button>
                        <button onclick="toggleModal('inventoryModal')" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-white/20 hover:bg-white/30 border border-white/30 transition-all shadow-sm cursor-pointer whitespace-nowrap flex items-center gap-1.5"><span>📦</span><span>المخزون</span></button>
                        <button onclick="toggleModal('settingsModal')" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-white/20 hover:bg-white/30 border border-white/30 transition-all shadow-sm cursor-pointer whitespace-nowrap flex items-center gap-1.5"><span>⚙️</span><span>إعدادات</span></button>
                    </nav>
                </div>
                <div class="flex items-center gap-2.5 shrink-0 order-3">
                    <span class="font-bold text-xs sm:text-sm tracking-wide whitespace-nowrap hidden sm:inline">أمين الشيباني</span>
                    <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center border border-white/20 overflow-hidden shadow-sm">
                        <img src="https://i.postimg.cc/rpG9QxkW/Screenshot-20260820-015259-Gallery.jpg" alt="شعار" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </header>

        <div class="flex flex-grow overflow-hidden relative">
            <aside class="w-64 bg-white border-l border-slate-200 hidden md:flex flex-col p-4 shrink-0 shadow-sm overflow-y-auto">
                <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3 px-2">التشغيل المحاسبي</div>
                <nav class="space-y-1.5 flex-grow">
                    <a href="#" onclick="loadPageView('ميزان المراجعة', '⚖️')" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-blue-50 text-primaryBlue font-bold text-xs shadow-xs">
                        <i data-lucide="scale" class="w-4 h-4"></i><span>ميزان المراجعة (رئيسي)</span>
                    </a>
                    <a href="#" onclick="loadPageView('لوحة التحكم', '🏠')" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-50 font-semibold text-xs transition-all cursor-pointer">
                        <i data-lucide="layout-dashboard" class="w-4 h-4 text-primaryBlue"></i><span>لوحة المؤشرات</span>
                    </a>
                    <a href="#" onclick="loadPageView('دليل الحسابات', '🌳')" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-50 font-semibold text-xs transition-all cursor-pointer">
                        <i data-lucide="folder-tree" class="w-4 h-4 text-primaryBlue"></i><span>دليل الحسابات</span>
                    </a>
                    <a href="#" onclick="loadPageView('سندات القبض والصرف', '💰')" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-50 font-semibold text-xs transition-all cursor-pointer">
                        <i data-lucide="receipt" class="w-4 h-4 text-primaryBlue"></i><span>سندات القبض والصرف</span>
                    </a>
                </nav>
            </aside>

            <!-- منطقة العرض الرئيسية المانعة للتمرير الرأسي الخارجي -->
            <main id="mainContentArea" class="flex-grow p-4 md:p-6 overflow-hidden flex flex-col relative bg-slate-50">
            </main>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl text-xs font-bold shadow-xl transition-all duration-300 translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600 text-white border border-emerald-500' : 'bg-red-600 text-white border border-red-500'
            }`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleLogin(event) {
            event.preventDefault();
            const userInput = document.getElementById('loginUser').value.trim();
            const passInput = document.getElementById('loginPassword').value.trim();

            if (userInput === 'admin' && passInput === '123456') {
                showToast("تم تشغيل النظام بكفاءة تامة!", "success");
                document.getElementById('loginSection').classList.add('hidden');
                const dash = document.getElementById('dashboardSection');
                dash.classList.remove('hidden');
                dash.classList.add('flex');
                loadPageView('ميزان المراجعة', '⚖️');
            } else {
                showToast("بيانات الدخول غير صحيحة.", "error");
            }
        }

        function logout() {
            document.getElementById('dashboardSection').classList.remove('flex');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPassword').value = '';
            showToast("تم إيقاف الجلسة بنجاح.", "success");
        }

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.toggle('hidden');
        }

        // قاعدة البيانات المؤقتة مع عينة دقيقة لميزان المراجعة
        function getPageData(title) {
            const key = 'system_db_' + title;
            const saved = localStorage.getItem(key);
            if (saved) return JSON.parse(saved);
            
            if (title === 'ميزان المراجعة') return [
                { id: 1, code: '101', name: 'الخزينة النقدية الرئيسية', debit: 45000, credit: 15000 },
                { id: 2, code: '102', name: 'حساب البنك التجاري', debit: 250000, credit: 100000 },
                { id: 3, code: '201', name: 'حساب الموردين والمقاولين', debit: 12000, credit: 57000 },
                { id: 4, code: '301', name: 'رأس المال الأساسي', debit: 0, credit: 200000 },
                { id: 5, code: '401', name: 'مصروفات التشغيل والإيجار', debit: 35000, credit: 0 }
            ];
            return [
                { id: 1, col1: 'سجل تشغيلي 1', col2: 'معتمد', col3: '5000' },
                { id: 2, col1: 'سجل تشغيلي 2', col2: 'تحت المراجعة', col3: '3200' }
            ];
        }

        function savePageData(title, data) {
            const key = 'system_db_' + title;
            localStorage.setItem(key, JSON.stringify(data));
        }

        function exportDatabase() {
            const backup = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('system_db_')) {
                    backup[key] = localStorage.getItem(key);
                }
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "Ameen_Alshaibani_TrialBalance.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("تم تصدير النسخة الاحتياطية بنجاح!", "success");
        }

        function triggerImport() {
            document.getElementById('importFile').click();
        }

        function importDatabase(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const backup = JSON.parse(e.target.result);
                    for (const key in backup) {
                        localStorage.setItem(key, backup[key]);
                    }
                    showToast("تم استيراد البيانات وتحديث ميزان المراجعة بنجاح!", "success");
                    loadPageView('ميزان المراجعة', '⚖️');
                } catch (err) {
                    showToast("ملف النسخة الاحتياطية غير صالح.", "error");
                }
            };
            reader.readAsText(file);
        }

        // محرك عرض الصفحات المتكامل (مخصص بالكامل لميزان المراجعة للخطوة الأولى وبأعلى جاهزية)
        function loadPageView(title, icon) {
            const area = document.getElementById('mainContentArea');
            
            if (title === 'لوحة التحكم') {
                area.innerHTML = `
                    <div class="max-w-5xl w-full mx-auto space-y-4">
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm text-center">
                            <h2 class="text-base font-bold text-slate-800 mb-2">لوحة المؤشرات التشغيلية</h2>
                            <p class="text-xs text-slate-500 mb-4">انتقل إلى ميزان المراجعة لمراجعة الأرصدة المدينة والدائنة.</p>
                            <button onclick="loadPageView('ميزان المراجعة', '⚖️')" class="bg-primaryBlue text-white text-xs font-bold px-4 py-2 rounded-xl shadow-md cursor-pointer">فتح ميزان المراجعة (الخطوة 1)</button>
                        </div>
                    </div>
                `;
                return;
            }

            if (title === 'ميزان المراجعة') {
                let data = getPageData('ميزان المراجعة');
                let totalDebit = data.reduce((sum, item) => sum + Number(item.debit || 0), 0);
                let totalCredit = data.reduce((sum, item) => sum + Number(item.credit || 0), 0);
                let isBalanced = totalDebit === totalCredit;

                area.innerHTML = `
                    <div id="printableArea" class="bg-white border border-slate-200 rounded-3xl p-5 max-w-6xl w-full mx-auto shadow-lg flex flex-col h-full overflow-hidden">
                        
                        <!-- رأس الصفحة والأزرار الإدارية الكاملة -->
                        <div class="flex flex-wrap items-center justify-between pb-3 mb-3 border-b border-slate-100 shrink-0 gap-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-lg">${icon}</div>
                                <div>
                                    <h2 class="font-bold text-sm text-slate-800">ميزان المراجعة المحاسبي (بالمجاميع والأرصدة)</h2>
                                    <p class="text-[11px] text-slate-500">منصة المراجعة المالية والمطابقة الفورية</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1.5 rounded-xl text-xs font-bold ${isBalanced ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}">
                                    ${isBalanced ? '⚖️ الميزان متطابق وموزون' : '⚠️ الميزان غير متطابق'}
                                </span>
                                <button onclick="window.print()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5"><i data-lucide="printer" class="w-3.5 h-3.5"></i> طباعة</button>
                                <button onclick="openTrialBalanceModal()" class="bg-primaryBlue hover:bg-primaryBlueHover text-white px-3.5 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5"><i data-lucide="plus" class="w-3.5 h-3.5"></i> إضافة حساب للميزان</button>
                            </div>
                        </div>

                        <!-- نموذج الإضافة السريع ضمن الصفحة المكتملة -->
                        <div id="tbFormContainer" class="hidden p-3 rounded-2xl bg-blue-50/70 border border-blue-100 mb-3 shrink-0">
                            <h3 class="font-bold text-xs text-slate-800 mb-2" id="tbFormTitle">إضافة حساب جديد إلى الميزان</h3>
                            <form onsubmit="handleTBFormSubmit(event)" class="grid grid-cols-1 sm:grid-cols-5 gap-2">
                                <input type="hidden" id="tbEditIndex" value="-1">
                                <div>
                                    <input type="text" id="tbCode" required placeholder="رقم الحساب..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-mono text-slate-800 focus:outline-none focus:border-primaryBlue">
                                </div>
                                <div class="sm:col-span-2">
                                    <input type="text" id="tbName" required placeholder="اسم الحساب المالي..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-primaryBlue">
                                </div>
                                <div>
                                    <input type="number" step="any" id="tbDebit" required placeholder="المدين (ر.س)..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-mono text-slate-800 focus:outline-none focus:border-primaryBlue">
                                </div>
                                <div>
                                    <input type="number" step="any" id="tbCredit" required placeholder="الدائن (ر.س)..." class="w-full bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-mono text-slate-800 focus:outline-none focus:border-primaryBlue">
                                </div>
                                <div class="sm:col-span-5 flex justify-end gap-2 pt-1">
                                    <button type="button" onclick="document.getElementById('tbFormContainer').classList.add('hidden')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer">إلغاء</button>
                                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-xl text-xs font-bold cursor-pointer">حفظ وترصيد مباشر</button>
                                </div>
                            </form>
                        </div>

                        <!-- جدول البيانات المحكم (بدون تمرير رأسي للخارج، تمرير داخلي فقط عند الحاجة) -->
                        <div class="border border-slate-200 rounded-2xl overflow-hidden flex flex-col flex-grow">
                            <div class="bg-slate-100 px-4 py-2 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between items-center shrink-0">
                                <span>الحسابات المدرجة في الميزان (${data.length})</span>
                                <span class="text-[11px] text-slate-500 font-mono">العملة: ريال سعودي (ر.س)</span>
                            </div>
                            <div class="overflow-y-auto flex-grow">
                                <table class="w-full text-right text-xs">
                                    <thead class="bg-slate-50 text-slate-600 border-b border-slate-200 sticky top-0">
                                        <tr>
                                            <th class="p-2.5">#</th>
                                            <th class="p-2.5 font-mono">رقم الحساب</th>
                                            <th class="p-2.5">اسم الحساب المالي</th>
                                            <th class="p-2.5 font-mono text-left">مدين</th>
                                            <th class="p-2.5 font-mono text-left">دائن</th>
                                            <th class="p-2.5 text-center">العمليات</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 bg-white">
                                        ${data.length === 0 ? `<tr><td colspan="6" class="p-8 text-center text-slate-400">لا توجد حسابات مضافة حالياً.</td></tr>` :
                                          data.map((item, index) => `
                                            <tr class="hover:bg-slate-50 transition-all">
                                                <td class="p-2.5 font-mono text-slate-400">${index + 1}</td>
                                                <td class="p-2.5 font-mono font-bold text-primaryBlue">${item.code}</td>
                                                <td class="p-2.5 font-semibold text-slate-800">${item.name}</td>
                                                <td class="p-2.5 font-mono text-left text-slate-700">${Number(item.debit).toLocaleString()}</td>
                                                <td class="p-2.5 font-mono text-left text-slate-700">${Number(item.credit).toLocaleString()}</td>
                                                <td class="p-2.5 text-center space-x-1 space-x-reverse">
                                                    <button onclick="editTBRecord(${index})" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-2 py-1 rounded-lg text-[11px] font-bold cursor-pointer transition-all">تعديل</button>
                                                    <button onclick="deleteTBRecord(${index})" class="bg-red-50 hover:bg-red-100 text-red-600 px-2 py-1 rounded-lg text-[11px] font-bold cursor-pointer transition-all">حذف</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                            <!-- شريط الإجماليات السفلي الثابت -->
                            <div class="bg-slate-900 text-white px-4 py-3 border-t border-slate-800 font-bold text-xs flex justify-between items-center shrink-0">
                                <span>إجمالي المجاميع العامة للميزان:</span>
                                <div class="flex gap-8 font-mono">
                                    <span>المدين الكلي: <span class="text-emerald-400">${totalDebit.toLocaleString()}</span> ر.س</span>
                                    <span>الدائن الكلي: <span class="text-emerald-400">${totalCredit.toLocaleString()}</span> ر.س</span>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // عرض افتراضي للصفحات الأخرى إذا طلبت
            area.innerHTML = `
                <div class="bg-white border border-slate-200 rounded-3xl p-6 max-w-4xl w-full mx-auto shadow-md">
                    <h2 class="font-bold text-sm text-slate-800 mb-2">${title}</h2>
                    <p class="text-xs text-slate-500">تم تجهيز هذه الصفحة ضمن النسق التشغيلي للمظام.</p>
                </div>
            `;
            lucide.createIcons();
        }

        function openTrialBalanceModal() {
            document.getElementById('tbFormContainer').classList.remove('hidden');
            document.getElementById('tbFormTitle').innerText = 'إضافة حساب جديد إلى ميزان المراجعة';
            document.getElementById('tbEditIndex').value = '-1';
            document.getElementById('tbCode').value = '';
            document.getElementById('tbName').value = '';
            document.getElementById('tbDebit').value = '';
            document.getElementById('tbCredit').value = '';
        }

        function handleTBFormSubmit(event) {
            event.preventDefault();
            const editIndex = parseInt(document.getElementById('tbEditIndex').value);
            const code = document.getElementById('tbCode').value;
            const name = document.getElementById('tbName').value;
            const debit = parseFloat(document.getElementById('tbDebit').value) || 0;
            const credit = parseFloat(document.getElementById('tbCredit').value) || 0;

            let data = getPageData('mيزان المراجعة'); // مفتاح التخزين
            let storageKey = 'system_db_ميزان المراجعة';
            let currentData = JSON.parse(localStorage.getItem(storageKey)) || getPageData('ميزان المراجعة');

            if (editIndex === -1) {
                currentData.push({ id: Date.now(), code, name, debit, credit });
                showToast("تمت إضافة الحساب وترصيد الميزان بنجاح!", "success");
            } else {
                currentData[editIndex] = { id: currentData[editIndex].id, code, name, debit, credit };
                showToast("تم تحديث بيانات الحساب بنجاح!", "success");
            }

            localStorage.setItem(storageKey, JSON.stringify(currentData));
            document.getElementById('tbFormContainer').classList.add('hidden');
            loadPageView('ميزان المراجعة', '⚖️');
        }

        function editTBRecord(index) {
            let storageKey = 'system_db_ميزان المراجعة';
            let currentData = JSON.parse(localStorage.getItem(storageKey)) || getPageData('ميزان المراجعة');
            const record = currentData[index];

            document.getElementById('tbFormContainer').classList.remove('hidden');
            document.getElementById('tbFormTitle').innerText = 'تعديل الحساب المالي رقم ' + record.code;
            document.getElementById('tbEditIndex').value = index;
            document.getElementById('tbCode').value = record.code;
            document.getElementById('tbName').value = record.name;
            document.getElementById('tbDebit').value = record.debit;
            document.getElementById('tbCredit').value = record.credit;
        }

        function deleteTBRecord(index) {
            if (confirm("هل أنت متأكد من حذف هذا الحساب من ميزان المراجعة؟")) {
                let storageKey = 'system_db_ميزان المراجعة';
                let currentData = JSON.parse(localStorage.getItem(storageKey)) || getPageData('ميزان المراجعة');
                currentData.splice(index, 1);
                localStorage.setItem(storageKey, JSON.stringify(currentData));
                showToast("تم حذف الحساب بنجاح وتحديث الأرصدة.", "success");
                loadPageView('ميزان المراجعة', '⚖️');
            }
        }

        window.addEventListener('click', function(e) {
            ['fileModal', 'viewModal', 'financeModal', 'inventoryModal', 'settingsModal'].forEach(id => {
                const modal = document.getElementById(id);
                if (modal && e.target === modal) {
                    modal.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
