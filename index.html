const PHASE7_ACCOUNTING_VERSION='7.0';
function p7n(v){return Number(v)||0}
function p7fx(j){return Math.max(0.000001,p7n(j?.exchangeRate)||413)}
function p7MoneyPair(sar,rate){return `${money(sar)} SAR<br><small class="muted">${money(p7n(sar)*rate)} YER</small>`}
async function p7Audit(action,details=''){try{await add('auditLog',{date:new Date().toISOString(),action,details,user:(window.currentUser&&window.currentUser.username)||'admin',phase:7})}catch(e){console.warn(e)}}

async function renderAccounts_v7(){
 const accounts=await all('accounts');
 const rows=accounts.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code))).map(a=>{
  const hasChildren=accounts.some(x=>x.parentId===a.id); const used=(window.__p7JournalUsed||[]).includes(a.id);
  return `<tr><td>${esc(a.code||'')}</td><td>${esc(a.name||'')}</td><td>${esc(a.type||'')}</td><td>${a.parentId||'—'}</td><td>${hasChildren?'تجميعي':'حركة'}</td><td><button class="btn secondary" onclick="p7EditAccount(${a.id})">✏️ تعديل</button> <button class="btn danger" onclick="p7DeleteAccount(${a.id})">حذف</button></td></tr>`;
 }).join('');
 const journal=await all('journal');window.__p7JournalUsed=[...new Set(journal.flatMap(j=>(j.lines||[]).map(l=>l.accountId)))];
 document.getElementById('content').innerHTML=shell('دليل الحسابات — المرحلة السابعة',pageLayout(
 `<div class="card"><form onsubmit="p7SaveAccount(event)"><input type="hidden" id="p7AccId"><div class="form-grid"><div class="field"><label>رمز الحساب</label><input id="p7AccCode" required></div><div class="field wide"><label>اسم الحساب</label><input id="p7AccName" required></div><div class="field"><label>النوع</label><select id="p7AccType"><option>أصل</option><option>التزام</option><option>حقوق ملكية</option><option>إيراد</option><option>مصروف</option></select></div><div class="field"><label>الحساب الأب</label><select id="p7AccParent"><option value="">بدون أب</option>${accounts.map(a=>`<option value="${a.id}">${esc(a.code+' - '+a.name)}</option>`).join('')}</select></div></div><div class="actions" style="margin-top:8px"><button class="btn primary">💾 حفظ الحساب</button><button type="button" class="btn secondary" onclick="p7ResetAccount()">جديد</button></div></form></div>`,
 `<div class="table-wrap"><table><thead><tr><th>الرمز</th><th>الحساب</th><th>النوع</th><th>الأب</th><th>التصنيف</th><th>إجراءات</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">لا توجد حسابات</td></tr>'}</tbody></table></div>`));
}
function p7ResetAccount(){p7AccId.value='';p7AccCode.value='';p7AccName.value='';p7AccParent.value=''}
async function p7SaveAccount(e){e.preventDefault();const id=p7n(p7AccId.value);const rec={code:p7AccCode.value.trim(),name:p7AccName.value.trim(),type:p7AccType.value,parentId:p7AccParent.value?p7n(p7AccParent.value):null};if(!rec.code||!rec.name)return;const dup=(await all('accounts')).find(a=>a.code===rec.code&&a.id!==id);if(dup)return toast('رمز الحساب مستخدم بالفعل','error');if(id){rec.id=id;await put('accounts',rec);await p7Audit('تعديل حساب',rec.code+' - '+rec.name)}else{await add('accounts',rec);await p7Audit('إضافة حساب',rec.code+' - '+rec.name)}toast('تم حفظ الحساب');renderAccounts_v7()}
async function p7EditAccount(id){const a=await get('accounts',id);if(!a)return;p7AccId.value=a.id;p7AccCode.value=a.code||'';p7AccName.value=a.name||'';p7AccType.value=a.type||'أصل';p7AccParent.value=a.parentId||'';window.scrollTo?.(0,0)}
async function p7DeleteAccount(id){const accounts=await all('accounts'), journal=await all('journal');if(accounts.some(a=>a.parentId===id))return toast('لا يمكن حذف حساب لديه حسابات فرعية','error');if(journal.some(j=>(j.lines||[]).some(l=>l.accountId===id)))return toast('لا يمكن حذف حساب مرتبط بقيود','error');if(confirm('حذف الحساب؟')){await remove('accounts',id);await p7Audit('حذف حساب',String(id));renderAccounts_v7()}}

let p7Lines=[];
async function renderJournal_v7(){const accounts=await all('accounts');const journals=(await all('journal')).slice().reverse();if(!p7Lines.length&&accounts.length>=2)p7Lines=[{accountId:accounts[0].id,debit:'',credit:''},{accountId:accounts[1].id,debit:'',credit:''}];
 const rows=journals.map(j=>`<tr><td>${esc(j.code||'')}</td><td>${esc(j.date||'')}</td><td>${esc(j.status||'مرحل')}</td><td>${esc(j.source||'يدوي')}</td><td>${esc(j.description||'')}</td><td>${p7MoneyPair(j.totalDebit||0,p7fx(j))}</td><td>${p7MoneyPair(j.totalCredit||0,p7fx(j))}</td><td><button class="btn secondary" onclick="p7ViewJournal(${j.id})">عرض</button></td></tr>`).join('');
 document.getElementById('content').innerHTML=shell('القيود اليومية — المرحلة السابعة',pageLayout(
 `<div class="card"><form onsubmit="p7PostJournal(event)"><div class="form-grid"><div class="field"><label>التاريخ</label><input id="p7JDate" type="date" value="${today()}" required></div><div class="field wide"><label>البيان</label><input id="p7JDesc" required placeholder="وصف العملية"></div><div class="field"><label>سعر صرف YER لكل SAR</label><input id="p7JRate" type="number" min=".000001" step=".000001" value="413"></div></div><div id="p7JournalLines" style="margin-top:8px"></div><div class="acc-toolbar"><button type="button" class="btn secondary" onclick="p7AddLine()">➕ إضافة سطر</button><button class="btn primary">📌 ترحيل القيد</button></div><div id="p7JournalTotals" class="acc-kpis"></div></form></div>`,
 `<div class="table-wrap"><table><thead><tr><th>رقم</th><th>التاريخ</th><th>الحالة</th><th>المصدر</th><th>البيان</th><th>مدين SAR/YER</th><th>دائن SAR/YER</th><th>تفاصيل</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">لا توجد قيود</td></tr>'}</tbody></table></div>`));p7RenderLines(accounts)}
function p7RenderLines(accounts){const el=document.getElementById('p7JournalLines');if(!el)return;el.innerHTML=p7Lines.map((l,i)=>`<div class="jline"><div class="field"><label>الحساب</label><select onchange="p7Lines[${i}].accountId=Number(this.value)">${accounts.map(a=>`<option value="${a.id}" ${a.id===l.accountId?'selected':''}>${esc(a.code+' - '+a.name)}</option>`).join('')}</select></div><div class="field"><label>مدين SAR</label><input type="number" step=".01" min="0" value="${l.debit||''}" oninput="p7Lines[${i}].debit=this.value;p7UpdateTotals()"></div><div class="field"><label>دائن SAR</label><input type="number" step=".01" min="0" value="${l.credit||''}" oninput="p7Lines[${i}].credit=this.value;p7UpdateTotals()"></div><button type="button" class="btn danger" onclick="p7Lines.splice(${i},1);renderJournal_v7()">×</button></div>`).join('');p7UpdateTotals()}
async function p7AddLine(){const a=await all('accounts');p7Lines.push({accountId:a[0]?.id,debit:'',credit:''});p7RenderLines(a)}
function p7UpdateTotals(){const d=p7Lines.reduce((s,l)=>s+p7n(l.debit),0),c=p7Lines.reduce((s,l)=>s+p7n(l.credit),0),rate=p7n(document.getElementById('p7JRate')?.value)||413;const el=document.getElementById('p7JournalTotals');if(el)el.innerHTML=`<div class="acc-kpi"><small>إجمالي المدين</small><b>${money(d)} SAR<br><small>${money(d*rate)} YER</small></b></div><div class="acc-kpi"><small>إجمالي الدائن</small><b>${money(c)} SAR<br><small>${money(c*rate)} YER</small></b></div><div class="acc-kpi"><small>حالة التوازن</small><b>${Math.abs(d-c)<0.005?'✅ متوازن':'❌ غير متوازن'}</b></div>`}
async function p7PostJournal(e){e.preventDefault();const lines=p7Lines.map(l=>({accountId:p7n(l.accountId),debit:p7n(l.debit),credit:p7n(l.credit)})).filter(l=>l.accountId&&(l.debit||l.credit));const d=lines.reduce((s,l)=>s+l.debit,0),c=lines.reduce((s,l)=>s+l.credit,0);if(lines.length<2)return toast('أدخل سطرين على الأقل','error');if(lines.some(l=>l.debit>0&&l.credit>0))return toast('لا يمكن أن يكون السطر مدينًا ودائنًا معًا','error');if(Math.abs(d-c)>=0.005)return toast('القيد غير متوازن ولا يمكن ترحيله','error');const rate=p7n(p7JRate.value)||413;const rec={code:'JV-'+Date.now(),date:p7JDate.value,source:'يدوي',description:p7JDesc.value,lines:lines.map(l=>({...l,foreignDebit:l.debit*rate,foreignCredit:l.credit*rate})),totalDebit:d,totalCredit:c,currency:'SAR',baseCurrency:'SAR',exchangeRate:rate,status:'مرحل',postedAt:new Date().toISOString()};await add('journal',rec);await p7Audit('ترحيل قيد يومية',rec.code+' | '+rec.description);p7Lines=[];toast('تم ترحيل القيد المتوازن');renderJournal_v7()}
async function p7ViewJournal(id){const j=await get('journal',id),a=await all('accounts');if(!j)return;const rate=p7fx(j);const lines=(j.lines||[]).map(l=>{const ac=a.find(x=>x.id===l.accountId);return `<tr><td>${esc(ac?.code||'')}</td><td>${esc(ac?.name||'')}</td><td>${p7MoneyPair(l.debit,rate)}</td><td>${p7MoneyPair(l.credit,rate)}</td></tr>`}).join('');document.getElementById('content').innerHTML=shell('تفاصيل القيد '+esc(j.code),`<div class="card"><div class="stat"><span>التاريخ</span><b>${esc(j.date)}</b></div><div class="stat"><span>البيان</span><b>${esc(j.description||'')}</b></div><div class="stat"><span>سعر الصرف</span><b>1 SAR = ${rate} YER</b></div></div><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>الرمز</th><th>الحساب</th><th>مدين SAR / YER</th><th>دائن SAR / YER</th></tr></thead><tbody>${lines}</tbody></table></div><div class="actions" style="margin-top:8px"><button class="btn secondary" onclick="loadPage('journal')">رجوع</button></div>`)}

async function renderLedger_v7(){const accounts=await all('accounts'),journal=await all('journal');const used=accounts.filter(a=>journal.some(j=>(j.lines||[]).some(l=>l.accountId===a.id)));document.getElementById('content').innerHTML=shell('دفتر الأستاذ العام — متعدد العملات',`<div class="card"><div class="field"><label>اختر الحساب</label><select id="p7LedgerAcc" onchange="p7ShowLedger()"><option value="">اختر حسابًا</option>${used.map(a=>`<option value="${a.id}">${esc(a.code+' - '+a.name)}</option>`).join('')}</select></div></div><div id="p7LedgerResult" style="margin-top:8px"><div class="empty">اختر حسابًا لعرض حركاته</div></div>`)}
async function p7ShowLedger(){const id=p7n(p7LedgerAcc.value),res=document.getElementById('p7LedgerResult');if(!id)return;const a=await get('accounts',id),j=(await all('journal')).filter(x=>x.status!=='مسودة').sort((x,y)=>String(x.date).localeCompare(String(y.date)));let bal=0;const rows=j.flatMap(x=>(x.lines||[]).filter(l=>l.accountId===id).map(l=>{const d=p7n(l.debit),c=p7n(l.credit),rate=p7fx(x);bal+=d-c;return `<tr><td>${esc(x.date)}</td><td>${esc(x.code)}</td><td>${esc(x.description||'')}</td><td>${p7MoneyPair(d,rate)}</td><td>${p7MoneyPair(c,rate)}</td><td>${p7MoneyPair(bal,rate)}</td></tr>`}));res.innerHTML=`<div class="card"><b>${esc(a.code+' - '+a.name)}</b></div><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>التاريخ</th><th>القيد</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="6" class="empty">لا توجد حركات</td></tr>'}</tbody></table></div>`}

async function renderTrial_v7(){const accounts=await all('accounts'),journal=(await all('journal')).filter(j=>j.status!=='مسودة');const sums={};journal.forEach(j=>(j.lines||[]).forEach(l=>{const s=sums[l.accountId]||(sums[l.accountId]={d:0,c:0});s.d+=p7n(l.debit);s.c+=p7n(l.credit)}));let td=0,tc=0;const rows=accounts.map(a=>{const s=sums[a.id]||{d:0,c:0};td+=s.d;tc+=s.c;return `<tr><td>${esc(a.code||'')}</td><td>${esc(a.name||'')}</td><td>${money(s.d)} SAR<br><small>${money(s.d*413)} YER*</small></td><td>${money(s.c)} SAR<br><small>${money(s.c*413)} YER*</small></td><td>${money(Math.max(0,s.d-s.c))}</td><td>${money(Math.max(0,s.c-s.d))}</td></tr>`}).join('');document.getElementById('content').innerHTML=shell('ميزان المراجعة — المرحلة السابعة',`<div class="acc-kpis"><div class="acc-kpi"><small>إجمالي المدين</small><b>${money(td)} SAR</b></div><div class="acc-kpi"><small>إجمالي الدائن</small><b>${money(tc)} SAR</b></div><div class="acc-kpi"><small>الحالة</small><b>${Math.abs(td-tc)<0.005?'✅ متوازن':'❌ غير متوازن'}</b></div></div><div class="table-wrap"><table><thead><tr><th>الرمز</th><th>الحساب</th><th>مدين</th><th>دائن</th><th>رصيد مدين</th><th>رصيد دائن</th></tr></thead><tbody>${rows}</tbody></table></div><small class="muted">* عرض YER المقابل في الميزان يتم بسعر العرض الحالي 413؛ أما تفاصيل كل حركة فتستخدم سعر الصرف المثبت معها.</small>`)}

/* توحيد مسارات المرحلة السابعة في آخر تعريف فعلي للمسارات */
const __phase7LoadPage=window.loadPage;
window.loadPage=async function(page){
 if(page==='accounts')return renderAccounts_v7();
 if(page==='journal')return renderJournal_v7();
 if(page==='ledger')return renderLedger_v7();

window.renderAccounts=renderAccounts_v7;window.renderJournal=renderJournal_v7;window.renderLedger=renderLedger_v7;window.renderTrial=renderTrial_v7;
window.__SHEIBANI_PHASE7_ACCOUNTING__=true;

<script>
/* =========================
   المرحلة الثامنة — المخزون والمشتريات التنفيذي
   IndexedDB فقط — لا Backend ولا SQL Server
========================= */
const PHASE8_INVENTORY_VERSION='8.0';
function p8n(v){return Number(v)||0}
async function p8Audit(action,details=''){try{await add('auditLog',{date:new Date().toISOString(),action,details,user:(window.currentUser&&window.currentUser.username)||'admin',phase:8})}catch(e){console.warn(e)}}
async function p8Balance(itemId,warehouseId){const rows=await all('inventoryBalances');const r=rows.find(x=>p8n(x.itemId)===p8n(itemId)&&p8n(x.warehouseId)===p8n(warehouseId));if(r)return p8n(r.qty);const it=await get('items',itemId);return p8n(it?.warehouseId)===p8n(warehouseId)?p8n(it?.qty):0}
async function p8SetBalance(itemId,warehouseId,qty){const rows=await all('inventoryBalances');const r=rows.find(x=>p8n(x.itemId)===p8n(itemId)&&p8n(x.warehouseId)===p8n(warehouseId));if(r){r.qty=p8n(qty);r.updatedAt=new Date().toISOString();await put('inventoryBalances',r)}else await add('inventoryBalances',{itemId:p8n(itemId),warehouseId:p8n(warehouseId),qty:p8n(qty),updatedAt:new Date().toISOString()})}
async function p8Move(itemId,warehouseId,qty,type,ref='',note=''){const before=await p8Balance(itemId,warehouseId),after=before+p8n(qty);if(after<0)throw new Error('لا يمكن أن يصبح رصيد المخزون سالبًا');await p8SetBalance(itemId,warehouseId,after);await add('stockMoves',{date:new Date().toISOString(),itemId:p8n(itemId),warehouseId:p8n(warehouseId),type,qty:p8n(qty),beforeQty:before,afterQty:after,reference:ref,note});return {before,after}}
async function renderInventory_v8(){const [items,warehouses,moves]=await Promise.all([all('items'),all('warehouses'),all('stockMoves')]);const low=[];for(const it of items){let total=0;for(const w of warehouses)total+=await p8Balance(it.id,w.id);if(total<=p8n(it.minQty||0))low.push({it,total})}
const rows=[];for(const it of items){let total=0;for(const w of warehouses)total+=await p8Balance(it.id,w.id);rows.push(`<tr><td>${esc(it.code||'')}</td><td>${esc(it.name||'')}</td><td>${esc(it.barcode||'—')}</td><td>${money(total)}</td><td>${money(p8n(it.cost))} SAR</td><td><button class="btn secondary" onclick="p8ItemCard(${it.id})">بطاقة</button></td></tr>`)}
document.getElementById('content').innerHTML=shell('📦 المخزون متعدد المخازن — المرحلة الثامنة',`<div class="p8-grid"><div class="p8-card"><small>عدد الأصناف</small><b>${items.length}</b></div><div class="p8-card"><small>المخازن</small><b>${warehouses.length}</b></div><div class="p8-card"><small>حركات المخزون</small><b>${moves.length}</b></div><div class="p8-card"><small>منخفضة المخزون</small><b>${low.length}</b></div></div><div class="p8-toolbar" style="margin-top:8px"><button class="btn primary" onclick="renderPurchase_v8()">🛒 المشتريات</button><button class="btn secondary" onclick="renderTransfers_v8()">🔄 تحويل مخزني</button><button class="btn secondary" onclick="renderStockCount_v8()">📋 الجرد والتسوية</button><button class="btn secondary" onclick="renderStockReport_v8()">📊 تقارير المخزون</button></div><div class="table-wrap p8-scroll"><table><thead><tr><th>الكود</th><th>الصنف</th><th>الباركود</th><th>الرصيد الكلي</th><th>التكلفة</th><th>تفاصيل</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="6" class="empty">لا توجد أصناف</td></tr>'}</tbody></table></div>`)}
async function p8ItemCard(id){const [it,ws,moves]=await Promise.all([get('items',id),all('warehouses'),all('stockMoves')]);let balances='';for(const w of ws)balances+=`<tr><td>${esc(w.name)}</td><td>${money(await p8Balance(id,w.id))}</td></tr>`;const mr=moves.filter(m=>p8n(m.itemId)===p8n(id)).slice().reverse().map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.type)}</td><td>${money(m.qty)}</td><td>${money(m.beforeQty)}</td><td>${money(m.afterQty)}</td><td>${esc(m.reference||'')}</td></tr>`).join('');document.getElementById('content').innerHTML=shell('بطاقة الصنف',`<div class="card"><b>${esc(it.name)}</b><div class="form-grid" style="margin-top:8px"><div class="field"><label>الباركود</label><input value="${esc(it.barcode||'')}" disabled></div><div class="field"><label>سعر البيع</label><input value="${p8n(it.price)} SAR" disabled></div><div class="field"><label>التكلفة</label><input value="${p8n(it.cost)} SAR" disabled></div></div></div><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>المخزن</th><th>الرصيد</th></tr></thead><tbody>${balances}</tbody></table></div><div class="table-wrap p8-scroll" style="margin-top:8px"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الحركة</th><th>قبل</th><th>بعد</th><th>مرجع</th></tr></thead><tbody>${mr||'<tr><td colspan="6" class="empty">لا توجد حركات</td></tr>'}</tbody></table></div><div class="actions" style="margin-top:8px"><button class="btn secondary" onclick="renderInventory_v8()">رجوع</button></div>`)}

let p8PurchaseLines=[];
async function renderPurchase_v8(){const [items,suppliers,warehouses,invoices]=await Promise.all([all('items'),all('suppliers'),all('warehouses'),all('purchaseInvoices')]);document.getElementById('content').innerHTML=shell('🛒 دورة المشتريات — المرحلة الثامنة',`<div class="card"><div class="form-grid"><div class="field"><label>المورد</label><select id="p8Sup">${suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>المخزن المستلم</label><select id="p8PurWh">${warehouses.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>طريقة الدفع</label><select id="p8Pay"><option>نقدي</option><option>بنك</option><option>آجل</option></select></div></div><div class="p8-toolbar" style="margin-top:8px"><button class="btn secondary" onclick="p8AddPurchaseLine()">➕ إضافة صنف</button><button class="btn primary" onclick="p8PostPurchase()">📌 ترحيل فاتورة الشراء</button></div><div id="p8PurchaseLines"></div></div><div class="table-wrap p8-scroll"><table><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>المورد</th><th>الإجمالي</th><th>الدفع</th></tr></thead><tbody>${invoices.slice().reverse().map(x=>`<tr><td>${esc(x.code||'')}</td><td>${esc(x.date||'')}</td><td>${esc(x.supplierName||'')}</td><td>${money(x.total||0)} SAR</td><td>${esc(x.paymentMethod||'')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد فواتير شراء</td></tr>'}</tbody></table></div>`);p8PurchaseLines=[];p8AddPurchaseLine()}
async function p8AddPurchaseLine(){const items=await all('items');p8PurchaseLines.push({itemId:items[0]?.id||0,qty:1,cost:p8n(items[0]?.cost)});p8RenderPurchaseLines(items)}
function p8RenderPurchaseLines(items){const el=document.getElementById('p8PurchaseLines');if(!el)return;el.innerHTML=p8PurchaseLines.map((l,i)=>`<div class="jline"><div class="field"><label>الصنف</label><select onchange="p8PurchaseLines[${i}].itemId=Number(this.value);const x=__p8Items.find(z=>z.id===Number(this.value));if(x)p8PurchaseLines[${i}].cost=Number(x.cost)||0;p8RenderPurchaseLines(__p8Items)">${items.map(x=>`<option value="${x.id}" ${x.id===l.itemId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>الكمية</label><input type="number" min=".001" step=".001" value="${l.qty}" oninput="p8PurchaseLines[${i}].qty=this.value;p8PurchaseLines[${i}].qty=Number(p8PurchaseLines[${i}].qty)||0;p8PurchaseTotal()"></div><div class="field"><label>التكلفة SAR</label><input type="number" min="0" step=".01" value="${l.cost}" oninput="p8PurchaseLines[${i}].cost=Number(this.value)||0;p8PurchaseTotal()"></div><button class="btn danger" onclick="p8PurchaseLines.splice(${i},1);p8RenderPurchaseLines(__p8Items)">×</button></div>`).join('')+'<div id="p8PurTotal" class="p8-card"></div>';window.__p8Items=items;p8PurchaseTotal()}
function p8PurchaseTotal(){const t=p8PurchaseLines.reduce((s,l)=>s+p8n(l.qty)*p8n(l.cost),0);const e=document.getElementById('p8PurTotal');if(e)e.innerHTML=`<small>إجمالي الفاتورة</small><b>${money(t)} SAR</b>`}
async function p8PostPurchase(){const lines=p8PurchaseLines.filter(l=>l.itemId&&p8n(l.qty)>0).map(l=>({...l,qty:p8n(l.qty),cost:p8n(l.cost)}));if(!lines.length)return toast('أضف صنفًا واحدًا على الأقل','error');const wh=p8n(p8PurWh.value),sup=p8n(p8Sup.value),supplier=(await get('suppliers',sup));const total=lines.reduce((s,l)=>s+l.qty*l.cost,0),code='PUR-'+Date.now();for(const l of lines){const it=await get('items',l.itemId);await p8Move(l.itemId,wh,l.qty,'شراء',code,'استلام من المورد');if(it){it.cost=l.cost;await put('items',it)}}const inv={code,date:today(),supplierId:sup,supplierName:supplier?.name||'',warehouseId:wh,lines,total,paymentMethod:p8Pay.value,status:'مرحل',currency:'SAR',exchangeRate:Number(localStorage.getItem('sheibani_pos_sar_yer_rate')||413),createdAt:new Date().toISOString()};await add('purchaseInvoices',inv);await p8Audit('ترحيل فاتورة شراء',code);toast('تم ترحيل فاتورة الشراء وتحديث المخزون');renderPurchase_v8()}

let p8TransferLines=[];
async function renderTransfers_v8(){const [items,ws,transfers]=await Promise.all([all('items'),all('warehouses'),all('stockTransfers')]);document.getElementById('content').innerHTML=shell('🔄 التحويل بين المخازن',`<div class="card"><div class="form-grid"><div class="field"><label>من مخزن</label><select id="p8From">${ws.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>إلى مخزن</label><select id="p8To">${ws.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div></div><div class="p8-toolbar" style="margin-top:8px"><button class="btn secondary" onclick="p8AddTransferLine()">➕ إضافة صنف</button><button class="btn primary" onclick="p8PostTransfer()">🔄 تنفيذ التحويل</button></div><div id="p8TransferLines"></div></div><div class="table-wrap p8-scroll"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>من</th><th>إلى</th><th>الحالة</th></tr></thead><tbody>${transfers.slice().reverse().map(t=>`<tr><td>${esc(t.code)}</td><td>${esc(t.date)}</td><td>${esc(t.fromName)}</td><td>${esc(t.toName)}</td><td>${esc(t.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد تحويلات</td></tr>'}</tbody></table></div>`);p8TransferLines=[];p8AddTransferLine()}
async function p8AddTransferLine(){const items=await all('items');p8TransferLines.push({itemId:items[0]?.id||0,qty:1});p8RenderTransferLines(items)}
function p8RenderTransferLines(items){const e=document.getElementById('p8TransferLines');if(!e)return;e.innerHTML=p8TransferLines.map((l,i)=>`<div class="jline"><div class="field"><label>الصنف</label><select onchange="p8TransferLines[${i}].itemId=Number(this.value)">${items.map(x=>`<option value="${x.id}" ${x.id===l.itemId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>الكمية</label><input type="number" min=".001" step=".001" value="${l.qty}" oninput="p8TransferLines[${i}].qty=Number(this.value)||0"></div><button class="btn danger" onclick="p8TransferLines.splice(${i},1);p8RenderTransferLines(__p8TransferItems)">×</button></div>`).join('');window.__p8TransferItems=items}
async function p8PostTransfer(){const from=p8n(p8From.value),to=p8n(p8To.value);if(from===to)return toast('اختر مخزنين مختلفين','error');const lines=p8TransferLines.filter(l=>l.itemId&&p8n(l.qty)>0);if(!lines.length)return toast('أضف أصنافًا للتحويل','error');for(const l of lines)if(await p8Balance(l.itemId,from)<p8n(l.qty))return toast('المخزون غير كافٍ للتحويل','error');const ws=await all('warehouses'),code='TRF-'+Date.now();for(const l of lines){await p8Move(l.itemId,from,-p8n(l.qty),'تحويل صادر',code);await p8Move(l.itemId,to,p8n(l.qty),'تحويل وارد',code)}await add('stockTransfers',{code,date:today(),fromWarehouseId:from,toWarehouseId:to,fromName:ws.find(w=>w.id===from)?.name||'',toName:ws.find(w=>w.id===to)?.name||'',lines,status:'مكتمل'});await p8Audit('تحويل مخزني',code);toast('تم التحويل وتحديث أرصدة المخازن');renderTransfers_v8()}
async function renderStockCount_v8(){const [items,ws]=await Promise.all([all('items'),all('warehouses')]);document.getElementById('content').innerHTML=shell('📋 الجرد والتسويات',`<div class="card"><div class="field"><label>المخزن</label><select id="p8CountWh" onchange="p8LoadCountRows()">${ws.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div id="p8CountRows" class="table-wrap p8-scroll" style="margin-top:8px"></div><div class="actions" style="margin-top:8px"><button class="btn primary" onclick="p8PostCount()">📌 ترحيل التسوية</button></div></div>`);window.__p8CountItems=items;p8LoadCountRows()}
async function p8LoadCountRows(){const wh=p8n(p8CountWh.value),items=window.__p8CountItems||await all('items');const rows=[];for(const it of items){const q=await p8Balance(it.id,wh);rows.push(`<tr data-id="${it.id}" data-book="${q}"><td>${esc(it.name)}</td><td>${money(q)}</td><td><input class="p8Actual" type="number" step=".001" min="0" value="${q}"></td><td class="p8Diff">0</td></tr>`)}const e=document.getElementById('p8CountRows');if(e)e.innerHTML=`<table><thead><tr><th>الصنف</th><th>الدفتري</th><th>الفعلي</th><th>الفرق</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;document.querySelectorAll('.p8Actual').forEach(x=>x.oninput=()=>{const tr=x.closest('tr');tr.querySelector('.p8Diff').textContent=money(p8n(x.value)-p8n(tr.dataset.book))})}
async function p8PostCount(){const wh=p8n(p8CountWh.value),trs=[...document.querySelectorAll('#p8CountRows tbody tr')],code='ADJ-'+Date.now();let changed=0;for(const tr of trs){const id=p8n(tr.dataset.id),book=p8n(tr.dataset.book),actual=p8n(tr.querySelector('.p8Actual').value),diff=actual-book;if(Math.abs(diff)>0.000001){await p8Move(id,wh,diff,'تسوية جرد',code,'تسوية فرق الجرد');changed++}}await p8Audit('تسوية جرد',code+' | '+changed+' أصناف');toast(changed?'تم ترحيل تسويات الجرد':'لا توجد فروقات');renderStockCount_v8()}
async function renderStockReport_v8(){const [items,ws,moves]=await Promise.all([all('items'),all('warehouses'),all('stockMoves')]);let rows=[];for(const it of items){let q=0;for(const w of ws)q+=await p8Balance(it.id,w.id);rows.push(`<tr><td>${esc(it.code||'')}</td><td>${esc(it.name)}</td><td>${money(q)}</td><td>${money(q*p8n(it.cost))} SAR</td></tr>`)}document.getElementById('content').innerHTML=shell('📊 تقارير المخزون',`<div class="p8-grid"><div class="p8-card"><small>إجمالي الأصناف</small><b>${items.length}</b></div><div class="p8-card"><small>إجمالي الحركات</small><b>${moves.length}</b></div></div><div class="table-wrap p8-scroll" style="margin-top:8px"><table><thead><tr><th>الكود</th><th>الصنف</th><th>الرصيد</th><th>التقييم</th></tr></thead><tbody>${rows.join('')}</tbody></table></div><div class="actions" style="margin-top:8px"><button class="btn secondary" onclick="renderInventory_v8()">رجوع للمخزون</button></div>`)}

const __phase8LoadPage=window.loadPage;
window.loadPage=async function(page){
 if(page==='inventory'||page==='items')return renderInventory_v8();
 if(page==='purchases'||page==='purchaseInvoices')return renderPurchase_v8();
 if(page==='stockTransfers')return renderTransfers_v8();
 if(page==='stockCount')return renderStockCount_v8();
 if(page==='stockReport')return renderStockReport_v8();
 return __phase8LoadPage(page);
};
window.renderInventory=renderInventory_v8;window.renderPurchase=renderPurchase_v8;window.renderTransfers=renderTransfers_v8;window.__SHEIBANI_PHASE8_INVENTORY__=true;
</script>
<style>
/* =========================================================
   المرحلة التاسعة — الخزينة والبنوك والعملاء والموردون
   إضافة تنفيذية فوق BASELINE المرحلة الثامنة
   ========================================================= */
.p9-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.p9-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px}.p9-card small{display:block;color:#64748b;font-size:10px}.p9-card b{display:block;font-size:18px;margin-top:4px}.p9-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.p9-toolbar .btn{min-width:135px;flex:1}.p9-note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:8px;color:#1e3a8a;font-size:10px}.p9-balance-positive{color:#059669;font-weight:900}.p9-balance-negative{color:#dc2626;font-weight:900}
@media(max-width:700px){.p9-grid{grid-template-columns:1fr 1fr}.p9-toolbar .btn{min-width:calc(50% - 6px)}}
</style>
<script>
/* ========================= المرحلة التاسعة ========================= */
const PHASE9_VERSION='9.0';
const P9_DEFAULT_RATE=413;
function p9n(v){return Number(v)||0}
function p9Rate(){return Math.max(.000001,p9n(localStorage.getItem('sheibani_pos_sar_yer_rate'))||P9_DEFAULT_RATE)}
function p9Currency(){return localStorage.getItem('sheibani_pos_currency')||'YER'}
function p9Foreign(base,currency,rate){return currency==='YER'?p9n(base)*p9n(rate):p9n(base)}
function p9Base(amount,currency,rate){return currency==='YER'?p9n(amount)/Math.max(.000001,p9n(rate)):p9n(amount)}
function p9Fmt(v,c='SAR'){return new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(p9n(v))+' '+c}
async function p9Audit(action,details=''){try{await add('auditLog',{date:new Date().toISOString(),action,details,user:(window.currentUser&&window.currentUser.username)||'admin',phase:9})}catch(e){console.warn(e)}}
async function p9EnsureAccount(code,name,type='أصل',parentId=null){let a=(await all('accounts')).find(x=>String(x.code)===String(code));if(a)return a.id;return add('accounts',{code,name,type,parentId})}
async function p9EnsureStructure(){
  const cash=await p9EnsureAccount('1100','الصندوق','أصل');
  const bank=await p9EnsureAccount('1200','البنك','أصل');
  await p9EnsureAccount('1110','الصناديق','أصل',cash);
  await p9EnsureAccount('1210','الحسابات البنكية','أصل',bank);
  await p9EnsureAccount('1300','العملاء','أصل');
  await p9EnsureAccount('2100','الموردون','التزام');
  const boxes=await all('cashBoxes');
  if(!boxes.length){const id=await p9EnsureAccount('1111','الصندوق الرئيسي','أصل',await p9EnsureAccount('1110','الصناديق','أصل',cash));await add('cashBoxes',{code:'CASH-001',name:'الصندوق الرئيسي',currency:'SAR',accountId:id,openingBalance:0,balance:0,status:'نشط',createdAt:new Date().toISOString()})}
  const banks=await all('bankAccounts');
  if(!banks.length){const id=await p9EnsureAccount('1211','البنك الرئيسي','أصل',await p9EnsureAccount('1210','الحسابات البنكية','أصل',bank));await add('bankAccounts',{code:'BANK-001',name:'الحساب البنكي الرئيسي',bankName:'',accountNumber:'',currency:'SAR',accountId:id,openingBalance:0,balance:0,status:'نشط',createdAt:new Date().toISOString()})}
}
async function p9AccountIdByCode(code){const a=(await all('accounts')).find(x=>String(x.code)===String(code));return a?.id||null}
async function p9Post({date,source,description,lines,currency='SAR',exchangeRate=1,module='TREASURY'}){return postAccountingEntry({date,source,description,lines,currency,exchangeRate,module})}
async function p9JournalForTwo(date,source,description,debitId,creditId,amount,currency,rate,module='TREASURY'){const base=p9Base(amount,currency,rate);return p9Post({date,source,description,currency,exchangeRate:rate,module,lines:[{accountId:debitId,debit:base,credit:0,foreignDebit:p9Foreign(base,currency,rate),foreignCredit:0},{accountId:creditId,debit:0,credit:base,foreignDebit:0,foreignCredit:p9Foreign(base,currency,rate)}]})}
async function p9RecalcBalances(){
  const trs=await all('treasuryTransactions'), boxes=await all('cashBoxes'), banks=await all('bankAccounts');
  for(const b of boxes){let v=p9n(b.openingBalance);for(const t of trs.filter(x=>x.assetType==='cash'&&p9n(x.assetId)===p9n(b.id))){v+=x.direction==='in'?p9n(x.baseAmount):-p9n(x.baseAmount)}b.balance=v;await put('cashBoxes',b)}
  for(const b of banks){let v=p9n(b.openingBalance);for(const t of trs.filter(x=>x.assetType==='bank'&&p9n(x.assetId)===p9n(b.id))){v+=x.direction==='in'?p9n(x.baseAmount):-p9n(x.baseAmount)}b.balance=v;await put('bankAccounts',b)}

 sales.forEach(x=>{const rem=p19Num(x.remaining);const due=String(x.dueDate||x.paymentDueDate||'').slice(0,10);if(rem>0&&due&&due<today)out.push({id:'sd-'+(x.id||x.number),type:'sales',level:'ذمم متأخرة',title:'فاتورة مبيعات '+(x.number||x.invoiceNo||x.id||''),detail:'المتبقي: '+p19Num(rem)+' SAR — الاستحقاق: '+due})});

async function p10Data(){const [journal,accounts,sales,purchases,customers,suppliers,boxes,banks,stock,invBal]=await Promise.all([all('journal'),all('accounts'),all('salesInvoices'),all('purchaseInvoices'),all('customers'),all('suppliers'),all('cashBoxes'),all('bankAccounts'),all('stockMoves'),all('inventoryBalances')]);return {journal,accounts,sales,purchases,customers,suppliers,boxes,banks,stock,invBal}}
function p10JournalSums(journal,from='',to=''){const sums={};journal.filter(j=>j.status!=='مسودة'&&p10InRange(j,from,to)).forEach(j=>(j.lines||[]).forEach(l=>{const s=sums[l.accountId]||(sums[l.accountId]={debit:0,credit:0});s.debit+=p10n(l.debit);s.credit+=p10n(l.credit)}));return sums}
async function renderReportsCenter10(){const d=await p10Data();const journal=d.journal.filter(j=>j.status!=='مسودة');const sums=p10JournalSums(journal);const account=d.accounts;const byCode=c=>account.find(a=>String(a.code)===String(c));const bal=a=>{const s=sums[a?.id]||{debit:0,credit:0};return p10n(s.debit)-p10n(s.credit)};const sales=bal(byCode('4100'));const cash=d.boxes.reduce((s,x)=>s+p10n(x.balance),0),bank=d.banks.reduce((s,x)=>s+p10n(x.balance),0),ar=d.customers.reduce((s,x)=>s+p10n(x.balance),0),ap=d.suppliers.reduce((s,x)=>s+p10n(x.balance),0);document.getElementById('content').innerHTML=shell('📊 مركز التقارير والتحليل — المرحلة العاشرة',`<div class="p10-grid"><div class="p10-card"><small>المبيعات المحاسبية</small><b>${money(Math.abs(sales))} SAR</b></div><div class="p10-card"><small>النقدية</small><b>${money(cash)} SAR</b></div><div class="p10-card"><small>البنوك</small><b>${money(bank)} SAR</b></div><div class="p10-card"><small>ذمم العملاء</small><b>${money(ar)} SAR</b></div><div class="p10-card"><small>ذمم الموردين</small><b>${money(ap)} SAR</b></div><div class="p10-card"><small>القيود المرحلة</small><b>${journal.length}</b></div><div class="p10-card"><small>فواتير المبيعات</small><b>${d.sales.length}</b></div><div class="p10-card"><small>فواتير المشتريات</small><b>${d.purchases.length}</b></div></div><div class="p10-toolbar" style="margin-top:9px"><button class="btn primary" onclick="loadPage('financialReports10')">📈 التقارير المالية</button><button class="btn secondary" onclick="loadPage('managementReports10')">📊 التقارير الإدارية</button><button class="btn secondary" onclick="loadPage('customerAging10')">👥 أعمار ديون العملاء</button><button class="btn secondary" onclick="loadPage('supplierAging10')">🚚 أعمار الموردين</button><button class="btn secondary" onclick="loadPage('cashFlow10')">💰 التدفقات النقدية</button><button class="btn secondary" onclick="loadPage('trialAdvanced10')">⚖️ ميزان مراجعة متقدم</button></div><div class="p10-note card"><b>تنبيه منهجي</b><p class="muted" style="margin-top:6px">جميع تقارير المرحلة العاشرة تقرأ من البيانات الفعلية المخزنة في IndexedDB ومن القيود المرحلة، ولا تنشئ بيانات محاسبية جديدة.</p></div>`)}

async function p10RenderBS(){const {from,to}=p10DateRange(),d=await p10Data(),s=p10JournalSums(d.journal,from,to);const types=['أصل','التزام','حقوق ملكية'];const block=t=>{const arr=d.accounts.filter(a=>a.type===t).map(a=>{const x=s[a.id]||{debit:0,credit:0};return {name:a.name,amount:t==='أصل'?x.debit-x.credit:x.credit-x.debit}}).filter(x=>Math.abs(x.amount)>.0001);const total=arr.reduce((z,x)=>z+x.amount,0);return `<div class="card"><b>${t==='أصل'?'الأصول':t==='التزام'?'الالتزامات':'حقوق الملكية'}</b>${arr.map(x=>`<div class="stat"><span>${esc(x.name)}</span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">لا توجد أرصدة</div>'}<div class="stat"><span>الإجمالي</span><b>${money(total)} SAR</b></div></div>`};document.getElementById('p10Result').innerHTML=`<div class="grid g2">${block('أصل')}${block('التزام')}</div><div style="margin-top:8px">${block('حقوق ملكية')}</div>`;await p10Audit('عرض الميزانية العمومية',`${from||'البداية'} إلى ${to||'النهاية'}`)}
async function renderBalanceSheet10(){document.getElementById('content').innerHTML=shell('🏛️ الميزانية العمومية المتقدمة',`<div class="card"><div class="form-grid"><div class="field"><label>من تاريخ</label><input id="p10From" type="date"></div><div class="field"><label>إلى تاريخ</label><input id="p10To" type="date"></div></div><div class="actions" style="margin-top:8px"><button class="btn primary" onclick="p10RenderBS()">عرض التقرير</button><button class="btn secondary" onclick="p10Print('الميزانية العمومية')">🖨️ طباعة</button></div></div><div id="p10Result" style="margin-top:8px"></div>`);p10RenderBS()}
async function renderCashFlow10(){const d=await p10Data(),trs=await all('treasuryTransactions');let inflow=0,outflow=0;trs.forEach(t=>{if(t.direction==='in')inflow+=p10n(t.baseAmount);else outflow+=p10n(t.baseAmount)});document.getElementById('content').innerHTML=shell('💰 تقرير التدفقات النقدية',`<div class="p10-grid"><div class="p10-card"><small>إجمالي المقبوضات</small><b>${money(inflow)} SAR</b></div><div class="p10-card"><small>إجمالي المدفوعات</small><b>${money(outflow)} SAR</b></div><div class="p10-card"><small>صافي التدفق</small><b>${money(inflow-outflow)} SAR</b></div><div class="p10-card"><small>عدد الحركات</small><b>${trs.length}</b></div></div><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>التاريخ</th><th>المرجع</th><th>الأصل</th><th>الاتجاه</th><th>القيمة SAR</th><th>العملة</th><th>البيان</th></tr></thead><tbody>${trs.slice().reverse().map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.code)}</td><td>${esc(t.assetType)}</td><td>${esc(t.direction==='in'?'وارد':'صادر')}</td><td>${money(t.baseAmount)}</td><td>${esc(t.currency||'SAR')}</td><td>${esc(t.description||'')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا توجد حركات خزينة</td></tr>'}</tbody></table></div><div class="actions" style="margin-top:8px"><button class="btn secondary" onclick="p10Print('تقرير التدفقات النقدية')">🖨️ طباعة</button></div>`);await p10Audit('عرض التدفقات النقدية','جميع الحركات')}
async function renderTrialAdvanced10(){const d=await p10Data();document.getElementById('content').innerHTML=shell('⚖️ ميزان المراجعة المتقدم',`<div class="card"><div class="form-grid"><div class="field"><label>من تاريخ</label><input id="p10From" type="date"></div><div class="field"><label>إلى تاريخ</label><input id="p10To" type="date"></div></div><div class="actions" style="margin-top:8px"><button class="btn primary" onclick="p10DrawTrial()">عرض</button><button class="btn secondary" onclick="p10Print('ميزان المراجعة')">🖨️ طباعة</button></div></div><div id="p10Result" class="table-wrap" style="margin-top:8px"></div>`);p10DrawTrial()}
async function p10DrawTrial(){const {from,to}=p10DateRange(),d=await p10Data(),before=p10JournalSums(d.journal,'',from?new Date(new Date(from).getTime()-86400000).toISOString().slice(0,10):''),period=p10JournalSums(d.journal,from,to);let td=0,tc=0;const rows=d.accounts.map(a=>{const o=before[a.id]||{debit:0,credit:0},p=period[a.id]||{debit:0,credit:0};const open=o.debit-o.credit,move=p.debit-p.credit,close=open+move;td+=p.debit;tc+=p.credit;return `<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${money(open)}</td><td>${money(p.debit)}</td><td>${money(p.credit)}</td><td>${money(close)}</td></tr>`}).join('');document.getElementById('p10Result').innerHTML=`<table><thead><tr><th>الكود</th><th>الحساب</th><th>افتتاحي</th><th>حركة مدين</th><th>حركة دائن</th><th>ختامي</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="3">الإجمالي</th><th>${money(td)}</th><th>${money(tc)}</th><th>${Math.abs(td-tc)<.005?'متوازن':'تحقق'}</th></tr></tfoot></table>`;await p10Audit('عرض ميزان مراجعة متقدم',`${from||'البداية'} إلى ${to||'النهاية'}`)}
async function renderLedgerAdvanced10(){const d=await p10Data();document.getElementById('content').innerHTML=shell('📒 الأستاذ التفصيلي المتقدم',`<div class="card"><div class="form-grid"><div class="field wide"><label>الحساب</label><select id="p10Acc"><option value="">اختر الحساب</option>${d.accounts.map(a=>`<option value="${a.id}">${esc(a.code+' - '+a.name)}</option>`).join('')}</select></div><div class="field"><label>من</label><input id="p10From" type="date"></div><div class="field"><label>إلى</label><input id="p10To" type="date"></div></div><div class="actions" style="margin-top:8px"><button class="btn primary" onclick="p10DrawLedger()">عرض</button><button class="btn secondary" onclick="p10Print('الأستاذ التفصيلي')">🖨️ طباعة</button></div></div><div id="p10Result" class="table-wrap" style="margin-top:8px"><div class="empty">اختر حسابًا</div></div>`)}
async function p10DrawLedger(){const id=p10n(document.getElementById('p10Acc').value),{from,to}=p10DateRange();if(!id)return toast('اختر حسابًا','error');const j=(await all('journal')).filter(x=>x.status!=='مسودة'&&p10InRange(x,from,to)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));let bal=0;const rows=[];j.forEach(x=>(x.lines||[]).filter(l=>p10n(l.accountId)===id).forEach(l=>{bal+=p10n(l.debit)-p10n(l.credit);rows.push(`<tr><td>${esc(x.date)}</td><td>${esc(x.code)}</td><td>${esc(x.description||'')}</td><td>${money(l.debit)}</td><td>${money(l.credit)}</td><td>${money(bal)}</td></tr>`)}));document.getElementById('p10Result').innerHTML=`<table><thead><tr><th>التاريخ</th><th>المرجع</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="6" class="empty">لا توجد حركة</td></tr>'}</tbody></table>`;await p10Audit('عرض الأستاذ التفصيلي',String(id))}
async function renderManagementReports10(){const d=await p10Data();const salesTotal=d.sales.reduce((s,x)=>s+p10n(x.total),0),purchaseTotal=d.purchases.reduce((s,x)=>s+p10n(x.total),0);const topCustomer=d.customers.slice().sort((a,b)=>p10n(b.balance)-p10n(a.balance)).slice(0,10);const topSupplier=d.suppliers.slice().sort((a,b)=>p10n(b.balance)-p10n(a.balance)).slice(0,10);document.getElementById('content').innerHTML=shell('📊 التقارير الإدارية والتحليلية',`<div class="p10-grid"><div class="p10-card"><small>إجمالي المبيعات</small><b>${money(salesTotal)}</b></div><div class="p10-card"><small>إجمالي المشتريات</small><b>${money(purchaseTotal)}</b></div><div class="p10-card"><small>عدد العملاء</small><b>${d.customers.length}</b></div><div class="p10-card"><small>عدد الموردين</small><b>${d.suppliers.length}</b></div></div><div class="grid g2" style="margin-top:8px"><div class="card"><b>أعلى أرصدة العملاء</b>${topCustomer.map(x=>`<div class="stat"><span>${esc(x.name)}</span><b>${money(x.balance)}</b></div>`).join('')||'<div class="empty">لا توجد بيانات</div>'}</div><div class="card"><b>أعلى أرصدة الموردين</b>${topSupplier.map(x=>`<div class="stat"><span>${esc(x.name)}</span><b>${money(x.balance)}</b></div>`).join('')||'<div class="empty">لا توجد بيانات</div>'}</div></div>`);await p10Audit('عرض التقارير الإدارية','ملخص الإدارة')}
async function p10Aging(type){const store=type==='customer'?'customers':'suppliers',invStore=type==='customer'?'salesInvoices':'purchaseInvoices',payStore=type==='customer'?'salesPayments':'purchasePayments';const [parties,inv,pay]=await Promise.all([all(store),all(invStore),all(payStore)]);const now=new Date();const rows=parties.map(p=>{const invoices=inv.filter(x=>p10n(x.partyId??x.customerId??x.supplierId)===p10n(p.id));const payments=pay.filter(x=>p10n(x.partyId)===p10n(p.id)).reduce((s,x)=>s+p10n(x.amount),0);let total=invoices.reduce((s,x)=>s+p10n(x.total),0)-payments;let b=[0,0,0,0];invoices.forEach(x=>{const age=Math.max(0,Math.floor((now-new Date(x.date||now))/86400000));const amount=p10n(x.total);if(age<=30)b[0]+=amount;else if(age<=60)b[1]+=amount;else if(age<=90)b[2]+=amount;else b[3]+=amount});return {name:p.name,total,b}});return rows}
async function renderAging10(type){const rows=await p10Aging(type),title=type==='customer'?'👥 أعمار ديون العملاء':'🚚 أعمار أرصدة الموردين';document.getElementById('content').innerHTML=shell(title,`<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>0-30 يوم</th><th>31-60</th><th>61-90</th><th>أكثر من 90</th><th>الإجمالي الصافي</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${money(r.b[0])}</td><td>${money(r.b[1])}</td><td>${money(r.b[2])}</td><td>${money(r.b[3])}</td><td>${money(r.total)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد بيانات</td></tr>'}</tbody></table></div><div class="actions" style="margin-top:8px"><button class="btn secondary" onclick="p10Print('${type==='customer'?'أعمار ديون العملاء':'أعمار الموردين'}')">🖨️ طباعة</button></div>`);await p10Audit('عرض تقرير الأعمار',type)}

<!-- ================= المرحلة الثانية عشرة: الأصول الثابتة والإهلاك — امتداد مباشر للمرحلة 11 ================= -->
<script>
/* ================= المرحلة الثانية عشرة: الأصول الثابتة والإهلاك ================= */
(function(){
 const P12_STORES=['assetCategories','fixedAssets','assetDepreciation','assetDisposals'];
 async function p12Ensure(){
   if(typeof fallbackMode!=='undefined'&&fallbackMode){ P12_STORES.forEach(k=>{fallbackData[k]??=[]}); return; }
   const missing=P12_STORES.filter(k=>!db.objectStoreNames.contains(k)); if(!missing.length)return;
   const v=(db.version||1)+1; db.close();
   await new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,v);r.onupgradeneeded=e=>{const d=e.target.result;P12_STORES.forEach(k=>{if(!d.objectStoreNames.contains(k))d.createObjectStore(k,{keyPath:'id',autoIncrement:true})})};r.onsuccess=e=>{db=e.target.result;resolve()};r.onerror=()=>reject(r.error)});
 }
 async function p12All(store){await p12Ensure(); return await all(store)}
 async function p12Put(store,obj){await p12Ensure(); return await put(store,obj)}
 function p12Money(v,c='SAR'){return new Intl.NumberFormat('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v||0))+' '+c}
 function p12Esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
 async function p12Audit(action,details){try{if(typeof p11Audit==='function')return await p11Audit(action,details);if(typeof addAudit==='function')return await addAudit(action,details);if(typeof audit==='function')return await audit(action,details)}catch(e){console.warn(e)}}
 function p12ActivePeriod(){return (typeof window.p11ActivePeriod==='function')?window.p11ActivePeriod():null}
 async function p12CheckDate(date){try{if(typeof p11GuardPosting==='function'){await p11GuardPosting(date);return;}const ps=await p12All('financialPeriods');const p=ps.find(x=>String(date)>=String(x.startDate)&&String(date)<=String(x.endDate));if(p&&['مغلقة','مقفلة نهائيًا','closed'].includes(String(p.status)))throw new Error('لا يمكن تنفيذ العملية داخل فترة مالية مغلقة');}catch(e){throw e;}}
 async function p12Shell(){await p12Ensure();const cats=await p12All('assetCategories');if(!cats.length){for(const n of ['المباني','السيارات','الأجهزة والمعدات','الأثاث','أصول أخرى'])await p12Put('assetCategories',{name:n,createdAt:new Date().toISOString()});}}
 async function renderAssets12(){await p12Shell();const assets=await p12All('fixedAssets');const active=assets.filter(a=>a.status!=='disposed');const cost=active.reduce((s,a)=>s+Number(a.cost||0),0);const accum=active.reduce((s,a)=>s+Number(a.accumulatedDepreciation||0),0);document.getElementById('content').innerHTML=shell('🏢 الأصول الثابتة',`<div class="grid g4"><div class="kpi"><b>${active.length}</b><span>الأصول النشطة</span></div><div class="kpi"><b>${p12Money(cost)}</b><span>إجمالي التكلفة</span></div><div class="kpi"><b>${p12Money(accum)}</b><span>مجمع الإهلاك</span></div><div class="kpi"><b>${p12Money(cost-accum)}</b><span>القيمة الدفترية</span></div></div><div class="card"><div class="actions"><button class="btn" onclick="p12AddAsset()">➕ إضافة أصل</button><button class="btn secondary" onclick="loadPage('assetCategories12')">📂 التصنيفات</button><button class="btn secondary" onclick="loadPage('depreciation12')">📉 الإهلاك</button><button class="btn secondary" onclick="loadPage('assetReports12')">📊 التقارير</button></div></div><div class="card table-wrap"><table><thead><tr><th>رقم الأصل</th><th>الأصل</th><th>التصنيف</th><th>التكلفة</th><th>مجمع الإهلاك</th><th>القيمة الدفترية</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${assets.map(a=>`<tr><td>${p12Esc(a.code)}</td><td>${p12Esc(a.name)}</td><td>${p12Esc(a.category)}</td><td>${p12Money(a.cost,a.currency)}</td><td>${p12Money(a.accumulatedDepreciation,a.currency)}</td><td>${p12Money(Number(a.cost||0)-Number(a.accumulatedDepreciation||0),a.currency)}</td><td>${a.status==='disposed'?'مستبعد':'نشط'}</td><td><button class="btn secondary" onclick="p12EditAsset(${a.id})">تعديل</button> ${a.status!=='disposed'?`<button class="btn danger" onclick="p12Dispose(${a.id})">استبعاد</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8">لا توجد أصول مسجلة</td></tr>'}</tbody></table></div>`)}
 async function p12AddAsset(){await p12Shell();const cats=await p12All('assetCategories');openModal('➕ إضافة أصل',`<form onsubmit="p12SaveAsset(event)"><div class="form-grid"><div class="field"><label>رقم الأصل</label><input id="p12Code" required></div><div class="field"><label>اسم الأصل</label><input id="p12Name" required></div><div class="field"><label>التصنيف</label><select id="p12Cat">${cats.map(c=>`<option>${p12Esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>تاريخ الشراء</label><input id="p12Date" type="date" required></div><div class="field"><label>التكلفة</label><input id="p12Cost" type="number" min="0" step="0.01" required></div><div class="field"><label>العملة</label><select id="p12Currency"><option>SAR</option><option>YER</option><option>USD</option></select></div><div class="field"><label>سعر الصرف التاريخي</label><input id="p12Rate" type="number" min="0" step="0.0001" value="1"></div><div class="field"><label>العمر الإنتاجي (بالأشهر)</label><input id="p12Life" type="number" min="1" value="60" required></div><div class="field"><label>القيمة المتبقية</label><input id="p12Residual" type="number" min="0" value="0"></div></div><div class="actions"><button class="btn" type="submit">💾 حفظ</button><button class="btn secondary" type="button" onclick="closeModal()">إلغاء</button></div></form>`)}
 async function p12SaveAsset(e){e.preventDefault();try{const date=document.getElementById('p12Date').value;await p12CheckDate(date);const a={code:p12Code.value.trim(),name:p12Name.value.trim(),category:p12Cat.value,purchaseDate:date,cost:Number(p12Cost.value),currency:p12Currency.value,exchangeRate:Number(p12Rate.value||1),usefulLifeMonths:Number(p12Life.value),residualValue:Number(p12Residual.value||0),accumulatedDepreciation:0,status:'active',createdAt:new Date().toISOString()};if(!a.code||!a.name)throw new Error('أدخل رقم واسم الأصل');await p12Put('fixedAssets',a);await p12Audit('إضافة أصل ثابت',a.code+' - '+a.name);closeModal();renderAssets12()}catch(err){toast(err.message||'تعذر الحفظ','error')}}
 async function p12EditAsset(id){const a=(await p12All('fixedAssets')).find(x=>x.id===id);if(!a)return;openModal('✏️ تعديل الأصل',`<form onsubmit="p12UpdateAsset(event,${id})"><div class="form-grid"><div class="field"><label>اسم الأصل</label><input id="p12EN" value="${p12Esc(a.name)}" required></div><div class="field"><label>العمر الإنتاجي (أشهر)</label><input id="p12EL" type="number" value="${a.usefulLifeMonths}" required></div><div class="field"><label>القيمة المتبقية</label><input id="p12ER" type="number" value="${a.residualValue||0}"></div></div><div class="actions"><button class="btn">حفظ التعديل</button><button class="btn secondary" type="button" onclick="closeModal()">إلغاء</button></div></form>`)}
 async function p12UpdateAsset(e,id){e.preventDefault();const rows=await p12All('fixedAssets');const a=rows.find(x=>x.id===id);a.name=p12EN.value.trim();a.usefulLifeMonths=Number(p12EL.value);a.residualValue=Number(p12ER.value||0);await p12Put('fixedAssets',a);await p12Audit('تعديل أصل ثابت',a.code);closeModal();renderAssets12()}
 async function renderCategories12(){await p12Shell();const cats=await p12All('assetCategories');document.getElementById('content').innerHTML=shell('📂 تصنيفات الأصول',`<div class="card"><form onsubmit="p12AddCategory(event)" class="form-grid"><div class="field"><label>اسم التصنيف</label><input id="p12CategoryName" required></div><div class="actions"><button class="btn">➕ إضافة</button></div></form></div><div class="card table-wrap"><table><thead><tr><th>التصنيف</th><th>تاريخ الإنشاء</th></tr></thead><tbody>${cats.map(c=>`<tr><td>${p12Esc(c.name)}</td><td>${String(c.createdAt||'').slice(0,10)}</td></tr>`).join('')}</tbody></table></div>`)}
 async function p12AddCategory(e){e.preventDefault();const name=p12CategoryName.value.trim();if(!name)return;await p12Put('assetCategories',{name,createdAt:new Date().toISOString()});await p12Audit('إضافة تصنيف أصل',name);renderCategories12()}
 async function p12PostDepJournal(a,date,amount){
  const accounts=await p12All('accounts');
  const expense=accounts.find(x=>String(x.code)==='5200')||accounts.find(x=>String(x.name||'').includes('إهلاك'));
  const accum=accounts.find(x=>String(x.code)==='1500')||accounts.find(x=>String(x.name||'').includes('مجمع إهلاك'));
  if(!expense||!accum)return;
  const code='DEP12-'+Date.now()+'-'+String(a.id);
  const exists=(await p12All('journal')).some(j=>j.source===code); if(exists)return;
  await p12Put('journal',{code,date,description:'إثبات إهلاك الأصل: '+a.name,source:code,periodId:null,status:'مرحل',currency:a.currency||'SAR',exchangeRate:Number(a.exchangeRate||1),baseCurrency:'SAR',lines:[{accountId:expense.id,debit:amount,credit:0},{accountId:accum.id,debit:0,credit:amount}],totalDebit:amount,totalCredit:amount,createdAt:new Date().toISOString()});
  await p12Audit('قيد إهلاك أصل ثابت',a.code+' | '+amount);
 }
 async function renderDep12(){const assets=(await p12All('fixedAssets')).filter(a=>a.status==='active');const rows=await p12All('assetDepreciation');document.getElementById('content').innerHTML=shell('📉 محرك الإهلاك',`<div class="card"><form onsubmit="p12RunDep(event)" class="form-grid"><div class="field"><label>تاريخ الإهلاك</label><input id="p12DepDate" type="date" required></div><div class="field"><label>الأصل</label><select id="p12DepAsset"><option value="all">جميع الأصول النشطة</option>${assets.map(a=>`<option value="${a.id}">${p12Esc(a.code)} — ${p12Esc(a.name)}</option>`).join('')}</select></div><div class="actions"><button class="btn">▶ تنفيذ الإهلاك</button></div></form></div><div class="card table-wrap"><table><thead><tr><th>التاريخ</th><th>الأصل</th><th>المبلغ</th><th>طريقة الإهلاك</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.date}</td><td>${p12Esc(r.assetCode)} - ${p12Esc(r.assetName)}</td><td>${p12Money(r.amount,r.currency)}</td><td>القسط الثابت</td></tr>`).join('')||'<tr><td colspan="4">لا توجد عمليات إهلاك</td></tr>'}</tbody></table></div>`)}
 async function p12RunDep(e){e.preventDefault();try{const date=p12DepDate.value;await p12CheckDate(date);let assets=(await p12All('fixedAssets')).filter(a=>a.status==='active');if(p12DepAsset.value!=='all')assets=assets.filter(a=>String(a.id)===p12DepAsset.value);const old=await p12All('assetDepreciation');let count=0,total=0;for(const a of assets){if(old.some(r=>r.assetId===a.id&&r.date===date))continue;const monthly=Math.max(0,(Number(a.cost)-Number(a.residualValue||0))/Number(a.usefulLifeMonths||1));const remaining=Math.max(0,Number(a.cost)-Number(a.residualValue||0)-Number(a.accumulatedDepreciation||0));const amount=Math.min(monthly,remaining);if(amount<=0)continue;a.accumulatedDepreciation=Number(a.accumulatedDepreciation||0)+amount;await p12Put('fixedAssets',a);await p12Put('assetDepreciation',{assetId:a.id,assetCode:a.code,assetName:a.name,date,amount,currency:a.currency,exchangeRate:a.exchangeRate,createdAt:new Date().toISOString()});await p12PostDepJournal(a,date,amount);count++;total+=amount;}await p12Audit('تنفيذ إهلاك',`${date}: ${count} أصل بقيمة ${total}`);toast(`تم احتساب الإهلاك لـ ${count} أصل`);renderDep12()}catch(err){toast(err.message||'تعذر تنفيذ الإهلاك','error')}}
 async function p12Dispose(id){const a=(await p12All('fixedAssets')).find(x=>x.id===id);if(!a)return;if(!confirm('هل تريد استبعاد هذا الأصل؟'))return;const date=new Date().toISOString().slice(0,10);try{await p12CheckDate(date);a.status='disposed';a.disposedAt=date;await p12Put('fixedAssets',a);await p12Put('assetDisposals',{assetId:id,assetCode:a.code,date,bookValue:Number(a.cost||0)-Number(a.accumulatedDepreciation||0),createdAt:new Date().toISOString()});await p12Audit('استبعاد أصل ثابت',a.code);renderAssets12()}catch(err){toast(err.message,'error')}}
 async function renderAssetReports12(){const assets=await p12All('fixedAssets');const deps=await p12All('assetDepreciation');const active=assets.filter(a=>a.status==='active');const cost=active.reduce((s,a)=>s+Number(a.cost||0),0),acc=active.reduce((s,a)=>s+Number(a.accumulatedDepreciation||0),0),depTotal=deps.reduce((s,r)=>s+Number(r.amount||0),0);document.getElementById('content').innerHTML=shell('📊 تقارير الأصول',`<div class="grid g4"><div class="kpi"><b>${active.length}</b><span>الأصول النشطة</span></div><div class="kpi"><b>${p12Money(cost)}</b><span>تكلفة الأصول</span></div><div class="kpi"><b>${p12Money(acc)}</b><span>مجمع الإهلاك</span></div><div class="kpi"><b>${p12Money(cost-acc)}</b><span>القيمة الدفترية</span></div></div><div class="card"><h3>ملخص الإهلاك المسجل: ${p12Money(depTotal)}</h3><button class="btn" onclick="window.print()">🖨️ طباعة التقرير</button></div><div class="card table-wrap"><table><thead><tr><th>الأصل</th><th>التكلفة</th><th>مجمع الإهلاك</th><th>القيمة الدفترية</th><th>الحالة</th></tr></thead><tbody>${assets.map(a=>`<tr><td>${p12Esc(a.code)} — ${p12Esc(a.name)}</td><td>${p12Money(a.cost,a.currency)}</td><td>${p12Money(a.accumulatedDepreciation,a.currency)}</td><td>${p12Money(Number(a.cost||0)-Number(a.accumulatedDepreciation||0),a.currency)}</td><td>${a.status==='disposed'?'مستبعد':'نشط'}</td></tr>`).join('')}</tbody></table></div>`)}
 window.p12AddAsset=p12AddAsset;window.p12SaveAsset=p12SaveAsset;window.p12EditAsset=p12EditAsset;window.p12UpdateAsset=p12UpdateAsset;window.p12Dispose=p12Dispose;window.p12AddCategory=p12AddCategory;window.p12RunDep=p12RunDep;
 const oldLoad=window.loadPage; window.loadPage=async function(page){if(page==='assets12')return renderAssets12();if(page==='assetCategories12')return renderCategories12();if(page==='depreciation12')return renderDep12();if(page==='assetReports12')return renderAssetReports12();return oldLoad(page)};
 function inject(){const sb=document.querySelector('.sidebar');if(!sb||document.getElementById('p12nav'))return;const box=document.createElement('div');box.id='p12nav';box.innerHTML=`<div class="nav-title">الأصول الثابتة</div><button class="nav-btn" onclick="loadPage('assets12')">🏢 إدارة الأصول</button><button class="nav-btn" onclick="loadPage('assetCategories12')">📂 تصنيفات الأصول</button><button class="nav-btn" onclick="loadPage('depreciation12')">📉 الإهلاك</button><button class="nav-btn" onclick="loadPage('assetReports12')">📊 تقارير الأصول</button>`;sb.appendChild(box)}
 window.addEventListener('DOMContentLoaded',()=>setTimeout(inject,300));setTimeout(inject,800);
 window.__SHEIBANI_PHASE12_FIXED_ASSETS__=true;
})();

<script>
/* ================= المرحلة 13: الهوية والأمان والصلاحيات - Offline IndexedDB ================= */
(()=>{
 'use strict';
 const P13_STORES=['roles','permissions','rolePermissions','userRoles','sessions'];
 const P13_KEY='sheibani_phase13_session';
 const P13_PERMS=[
  ['dashboard','لوحة المؤشرات'],['pos','نقطة البيع'],['inventory','المخزون'],['sales','المبيعات'],['purchases','المشتريات'],
  ['treasury','الخزينة والبنوك'],['accounting','المحاسبة'],['reports','التقارير'],['assets','الأصول الثابتة'],['users','المستخدمون'],
  ['roles','الأدوار والصلاحيات'],['sessions','الجلسات'],['settings','الإعدادات'],['backup','النسخ الاحتياطي'],['audit','سجل التدقيق']
 ];
 const P13_DEFAULT_ROLES=[
  {code:'ADMIN',name:'مدير النظام',description:'صلاحية كاملة على النظام',system:true},
  {code:'ACCOUNTANT',name:'محاسب',description:'المحاسبة والخزينة والتقارير',system:true},
  {code:'CASHIER',name:'كاشير',description:'نقطة البيع والتحصيلات',system:true},
  {code:'STOREKEEPER',name:'مخزن',description:'المخزون والمشتريات الأساسية',system:true}
 ];
 const P13_ROLE_PERMS={
  ADMIN:P13_PERMS.map(x=>x[0]),
  ACCOUNTANT:['dashboard','treasury','accounting','reports','audit'],
  CASHIER:['dashboard','pos','sales'],
  STOREKEEPER:['dashboard','inventory','purchases','assets']
 };
 const p13all=all, p13get=get, p13add=add, p13put=put;
 let p13Current=null;
 const esc13=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 async function p13Hash(value){
  const data=new TextEncoder().encode(String(value));
  if(window.crypto?.subtle){const b=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  // fallback checksum is only for legacy browsers; normal Android browsers use SHA-256 above.
  let h=2166136261;for(const x of data){h^=x;h=Math.imul(h,16777619)}return 'fallback-'+(h>>>0).toString(16);
 }
 async function p13EnsureStores(){
  if(window.fallbackMode){P13_STORES.forEach(s=>{if(!fallbackData[s])fallbackData[s]=[]});return;}
  const names=[...db.objectStoreNames];const missing=P13_STORES.filter(s=>!names.includes(s));
  if(!missing.length)return;
  const next=(db.version||1)+1;db.close();
  await new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,next);r.onupgradeneeded=e=>{const d=e.target.result;P13_STORES.forEach(k=>{if(!d.objectStoreNames.contains(k))d.createObjectStore(k,{keyPath:'id',autoIncrement:true})})};r.onsuccess=e=>{db=e.target.result;db.onversionchange=()=>{try{db.close()}catch{}};resolve()};r.onerror=()=>reject(r.error||new Error('تعذر تحديث قاعدة الأمان'))});
 }
 async function p13Audit(action,details=''){try{await p13add('auditLog',{date:new Date().toISOString(),action,details,user:p13Current?.username||'system',phase:13})}catch(e){console.warn(e)}}
 async function p13Seed(){
  await p13EnsureStores();
  for(const r of P13_DEFAULT_ROLES){if(!(await p13all('roles')).some(x=>x.code===r.code))await p13add('roles',r)}
  const perms=await p13all('permissions');for(const [code,name] of P13_PERMS){if(!perms.some(x=>x.code===code))await p13add('permissions',{code,name})}
  const roles=await p13all('roles'), ps=await p13all('permissions'), links=await p13all('rolePermissions');
  for(const r of roles){for(const code of (P13_ROLE_PERMS[r.code]||[])){const perm=ps.find(x=>x.code===code);if(perm&&!links.some(x=>Number(x.roleId)===Number(r.id)&&Number(x.permissionId)===Number(perm.id)))await p13add('rolePermissions',{roleId:r.id,permissionId:perm.id})}}
  const users=await p13all('users');
  for(const u of users){
   if(!u.passwordHash && u.password){u.passwordHash=await p13Hash(u.password);delete u.password;await p13put('users',u)}
   const role=roles.find(r=>r.name===u.role)||roles.find(r=>r.code==='ADMIN'&&u.username==='admin');
   if(role && !(await p13all('userRoles')).some(x=>Number(x.userId)===Number(u.id)&&Number(x.roleId)===Number(role.id)))await p13add('userRoles',{userId:u.id,roleId:role.id})
  }
 }
 async function p13RolesFor(userId){const links=await p13all('userRoles'),roles=await p13all('roles');return links.filter(x=>Number(x.userId)===Number(userId)).map(x=>roles.find(r=>Number(r.id)===Number(x.roleId))).filter(Boolean)}
 async function p13Permissions(userId){const roles=await p13RolesFor(userId),links=await p13all('rolePermissions'),perms=await p13all('permissions');if(roles.some(r=>r.code==='ADMIN'))return new Set(P13_PERMS.map(x=>x[0]));const out=new Set();for(const r of roles)for(const l of links.filter(x=>Number(x.roleId)===Number(r.id))){const p=perms.find(x=>Number(x.id)===Number(l.permissionId));if(p)out.add(p.code)}return out}
 async function p13Can(code){
  try{
   const loginName=String(document.getElementById('loginUser')?.value||'').trim().toLowerCase();
   const app=document.getElementById('app'),login=document.getElementById('login');
   if(app&&!app.classList.contains('hidden')&&login&&login.classList.contains('hidden')&&loginName==='admin'){
    p13Current=p13Current||{username:'admin',fullname:'مدير النظام',role:'مدير',isAdmin:true};
    p13Current.isAdmin=true;window.currentUser=p13Current;return true;
   }
  }catch(e){}
  let u=p13Current||window.currentUser||null;
  if(!u){try{const token=localStorage.getItem(P13_KEY);if(token){const ss=await p13all('sessions'),s=ss.find(x=>x.token===token&&x.status==='نشطة');if(s){const usr=await p13get('users',s.userId);if(usr&&usr.status!=='موقوف'){const rr=await p13RolesFor(usr.id),admin=String(usr.username||'').trim().toLowerCase()==='admin'||rr.some(r=>r.code==='ADMIN'||r.name==='مدير النظام')||String(usr.role||'').includes('مدير');p13Current={...usr,isAdmin:admin,sessionToken:token};window.currentUser=p13Current;u=p13Current}}}}catch(e){console.warn(e)}}
  if(!u)return false;
  const uname=String(u.username||'').trim().toLowerCase();
  if(u.isAdmin===true||uname==='admin'||String(u.role||'').includes('مدير'))return true;
  return (await p13Permissions(u.id)).has(code);
 }
 async function p13Require(code,msg='ليس لديك صلاحية لتنفيذ هذه العملية'){if(await p13Can(code))return true;toast(msg,'error');return false}
 async function p13Login(e){
  e.preventDefault();const u=(loginUser?.value||'').trim(),p=loginPass?.value||'';if(!u||!p)return toast('أدخل اسم المستخدم وكلمة المرور','error');
  try{await dbReadyPromise;await p13Seed();const users=await p13all('users');const user=users.find(x=>String(x.username||'').trim()===u);if(!user||user.status==='موقوف')return toast('بيانات الدخول غير صحيحة أو المستخدم موقوف','error');const hash=await p13Hash(p);if(user.passwordHash!==hash){if(user.password&&user.password===p){user.passwordHash=hash;delete user.password;await p13put('users',user)}else return toast('بيانات الدخول غير صحيحة','error')}
   const roles=await p13RolesFor(user.id),isAdmin=String(u).trim().toLowerCase()==='admin'||String(user.role||'').includes('مدير')||roles.some(r=>r.code==='ADMIN');
   const token=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random());const session={token,userId:user.id,username:user.username,loginAt:new Date().toISOString(),lastActivity:new Date().toISOString(),status:'نشطة',device:navigator.userAgent.slice(0,120)};await p13add('sessions',session);localStorage.setItem(P13_KEY,token);p13Current={...user,isAdmin,sessionToken:token};window.currentUser=p13Current;
   document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await p13Audit('تسجيل دخول','تم تسجيل دخول المستخدم '+user.username);await loadPage('dashboard');return false;
  }catch(err){console.error(err);toast('تعذر تهيئة نظام الهوية والأمان','error');return false}
 }
 async function p13Logout(){if(p13Current){await p13Audit('تسجيل خروج','تم تسجيل خروج المستخدم '+p13Current.username);const ss=await p13all('sessions'),s=ss.find(x=>x.token===p13Current.sessionToken);if(s){s.status='منتهية';s.logoutAt=new Date().toISOString();await p13put('sessions',s)}}localStorage.removeItem(P13_KEY);p13Current=null;window.currentUser=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');loginPass.value=''}
 async function p13Restore(){
   /* المرحلة 28: يمنع الاستعادة التلقائية للجلسة عند فتح أيقونة التطبيق.
      كل تشغيل جديد يبدأ من بوابة تسجيل الدخول الرئيسية كما طلب المستخدم. */
   try{
     localStorage.removeItem(P13_KEY);
     p13Current=null;window.currentUser=null;
     const app=document.getElementById('app'),login=document.getElementById('login');
     if(app)app.classList.add('hidden');
     if(login)login.classList.remove('hidden');
     const pass=document.getElementById('loginPass');if(pass)pass.value='';
   }catch(e){console.warn('launch login gate:',e)}
 }
 async function p13Users(){if(!await p13Require('users'))return;const users=await p13all('users'),roles=await p13all('roles'),links=await p13all('userRoles');const rows=[];for(const u of users){const rr=links.filter(x=>Number(x.userId)===Number(u.id)).map(x=>roles.find(r=>Number(r.id)===Number(x.roleId))).filter(Boolean).map(r=>r.name).join('، ')||u.role||'—';rows.push(`<tr><td>${esc13(u.username)}</td><td>${esc13(u.fullname)}</td><td>${esc13(rr)}</td><td>${esc13(u.status||'نشط')}</td><td><button class="btn secondary" onclick="p13EditUser(${u.id})">تعديل</button> ${u.username==='admin'?'':`<button class="btn danger" onclick="p13ToggleUser(${u.id})">${u.status==='موقوف'?'تفعيل':'إيقاف'}</button>`}</td></tr>`)}
 document.getElementById('content').innerHTML=shell('🔐 إدارة المستخدمين',`<div class="card"><div class="actions"><button class="btn primary" onclick="p13NewUser()">➕ مستخدم جديد</button><button class="btn secondary" onclick="loadPage('roles13')">🛡️ الأدوار والصلاحيات</button><button class="btn secondary" onclick="loadPage('sessions13')">🖥️ الجلسات</button></div></div><div class="card table-wrap"><table><thead><tr><th>اسم المستخدم</th><th>الاسم</th><th>الدور</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="5">لا يوجد مستخدمون</td></tr>'}</tbody></table></div>`)}
 function p13OpenModal(title,body){
 const modal=document.getElementById('modal');
 if(!modal){toast('تعذر فتح نافذة المستخدم الجديد','error');return}
 modal.innerHTML=`<div class="modal-card"><div class="modal-head"><span>${title}</span><button type="button" class="btn secondary" onclick="closeModal()">✕</button></div><div class="modal-body">${body}</div></div>`;
 modal.classList.remove('hidden');
}

async function p13NewUser(){if(!await p13Require('users'))return;const roles=await p13all('roles');p13OpenModal('➕ مستخدم جديد',`<form onsubmit="p13SaveUser(event)" class="form-grid"><div class="field"><label>اسم المستخدم</label><input id="p13UN" required></div><div class="field"><label>الاسم الكامل</label><input id="p13UF" required></div><div class="field"><label>كلمة المرور</label><input id="p13UP" type="password" minlength="4" required></div><div class="field"><label>الدور</label><select id="p13UR">${roles.map(r=>`<option value="${r.id}">${esc13(r.name)}</option>`).join('')}</select></div><div class="actions"><button class="btn primary">حفظ المستخدم</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div></form>`)}
 async function p13SaveUser(e){e.preventDefault();if(!await p13Require('users'))return;const users=await p13all('users');const username=p13UN.value.trim();if(users.some(x=>x.username===username))return toast('اسم المستخدم موجود مسبقًا','error');const id=await p13add('users',{username,fullname:p13UF.value.trim(),role:'',status:'نشط',passwordHash:await p13Hash(p13UP.value),createdAt:new Date().toISOString()});await p13add('userRoles',{userId:id,roleId:Number(p13UR.value)});await p13Audit('إنشاء مستخدم',username);closeModal();toast('تم إنشاء المستخدم');p13Users()}
 async function p13EditUser(id){if(!await p13Require('users'))return;const u=await p13get('users',id);if(!u)return;const roles=await p13all('roles'),links=await p13all('userRoles'),current=links.find(x=>Number(x.userId)===Number(id));p13OpenModal('✏️ تعديل المستخدم',`<form onsubmit="p13UpdateUser(event,${id})" class="form-grid"><div class="field"><label>اسم المستخدم</label><input value="${esc13(u.username)}" disabled></div><div class="field"><label>الاسم الكامل</label><input id="p13EF" value="${esc13(u.fullname)}" required></div><div class="field"><label>كلمة مرور جديدة (اختياري)</label><input id="p13EP" type="password" minlength="4"></div><div class="field"><label>الدور</label><select id="p13ER">${roles.map(r=>`<option value="${r.id}" ${current&&Number(current.roleId)===Number(r.id)?'selected':''}>${esc13(r.name)}</option>`).join('')}</select></div><div class="actions"><button class="btn primary">حفظ التعديل</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div></form>`)}

<script>
(function(){
'use strict';

let p14SelectedBackup=null;

async function p14Stores(){
  const base=Array.isArray(window.STORES)?window.STORES:[];
  return base.filter(s=>{
    try{return window.db ? db.objectStoreNames.contains(s) : true}catch(e){return true}
  });
}

async function p14CreateData(){
  const stores={};
  let total=0;
  for(const name of await p14Stores()){
    try{
      const rows=await all(name);
      stores[name]=rows;
      total+=rows.length;
    }catch(e){}
  }
  return {
    app:'نظام الشيباني المحاسبي 2026',
    type:'full-backup',
    version:'14.0',
    createdAt:new Date().toISOString(),
    stores,
    totalRecords:total
  };
}

function p14Download(data,name){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function p14Export(){
  try{
    toast('جاري تجهيز النسخة الاحتياطية...','warning');
    const data=await p14CreateData();
    p14Download(data,'Sheibani_Backup_'+new Date().toISOString().slice(0,10)+'.json');
    toast('تم إنشاء النسخة الاحتياطية بنجاح');
  }catch(e){
    console.error(e);
    toast('تعذر إنشاء النسخة الاحتياطية','error');
  }
}

async function p14SelectFile(e){
  const file=e.target.files && e.target.files[0];
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!data || data.type!=='full-backup' || !data.stores)throw new Error('ملف غير صالح');
    p14SelectedBackup=data;
    const count=Object.values(data.stores).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0);
    const status=document.getElementById('p14Status');
    if(status)status.innerHTML=`<div class="p14-note"><b>✓ تم التحقق من النسخة</b><br>عدد السجلات: ${count}<div class="actions" style="margin-top:8px"><button class="btn danger" onclick="p14Restore()">استعادة النسخة</button></div></div>`;
    toast('النسخة الاحتياطية جاهزة للاستعادة');
  }catch(err){
    p14SelectedBackup=null;
    toast('ملف النسخة غير صالح','error');
  }
}

async function p14Restore(){
  if(!p14SelectedBackup)return;
  if(!confirm('سيتم استبدال البيانات الحالية بالنسخة الاحتياطية. هل تريد المتابعة؟'))return;
  try{
    const safety=await p14CreateData();
    localStorage.setItem('SheibaniSafetyBackup14',JSON.stringify(safety));

    const available=await p14Stores();
    for(const store of available){
      if(!Array.isArray(p14SelectedBackup.stores[store]))continue;
      const current=await all(store);
      for(const row of current){
        if(row && row.id!=null)await remove(store,row.id);
      }
      for(const row of p14SelectedBackup.stores[store]){
        await put(store,row);
      }
    }
    toast('تمت استعادة البيانات بنجاح');
    setTimeout(()=>loadPage('dashboard'),500);
  }catch(e){
    console.error(e);
    toast('فشلت عملية الاستعادة','error');
  }
}

function p14ExportSafety(){
  try{
    const raw=localStorage.getItem('SheibaniSafetyBackup14');
    if(!raw)return toast('لا توجد نسخة أمان بعد','warning');
    p14Download(JSON.parse(raw),'Sheibani_Safety_Backup.json');
    toast('تم تصدير نسخة الأمان');
  }catch(e){toast('تعذر تصدير نسخة الأمان','error')}
}

async function renderP14Backup(){
  const names=await p14Stores();
  let total=0;
  for(const s of names){try{total+=(await all(s)).length}catch(e){}}
  const hasSafety=!!localStorage.getItem('SheibaniSafetyBackup14');

  document.getElementById('content').innerHTML=shell('💾 النسخ الاحتياطي والاستعادة',`
    <div id="p14Page" class="screen-layout">
      <div class="screen-scroll">
        <div class="p14-grid">
          <div class="kpi"><span>الجداول المحفوظة</span><b>${names.length}</b></div>
          <div class="kpi"><span>إجمالي السجلات</span><b>${total}</b></div>
          <div class="kpi"><span>نسخة الأمان</span><b>${hasSafety?'متوفرة':'غير متوفرة'}</b></div>
        </div>

        <div class="grid g2" style="margin-top:10px">
          <div class="p14-card">
            <h3>⬇️ إنشاء نسخة احتياطية</h3>
            <p class="muted">تصدير جميع بيانات النظام الحالية في ملف JSON.</p>
            <button class="btn primary" style="margin-top:10px" onclick="p14Export()">إنشاء وتصدير النسخة</button>
          </div>

          <div class="p14-card">
            <h3>📥 استعادة نسخة</h3>
            <p class="muted">اختر ملف النسخة الاحتياطية وسيتم التحقق منه قبل الاستعادة.</p>
            <input type="file" accept=".json,application/json" onchange="p14SelectFile(event)" style="margin-top:10px">
            <div id="p14Status"></div>
          </div>
        </div>

        <div class="p14-card" style="margin-top:10px">
          <h3>🛡️ نسخة الأمان</h3>
          <p class="muted">يتم حفظ نسخة من البيانات الحالية تلقائيًا قبل أي استعادة.</p>
          <button class="btn secondary" style="margin-top:10px" onclick="p14ExportSafety()" ${hasSafety?'':'disabled'}>تصدير نسخة الأمان</button>
        </div>
      </div>
    </div>
  `);
}

const p14BaseLoadPage=window.loadPage;
window.loadPage=async function(page){
  if(page==='backup')return renderP14Backup();
  return p14BaseLoadPage(page);
};

window.p14Export=p14Export;
window.p14SelectFile=p14SelectFile;
window.p14Restore=p14Restore;
window.p14ExportSafety=p14ExportSafety;
})();
</script>
