<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام التصميم الفاخر</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0a0c',
                        cardBg: '#131318',
                        gold: '#d4af37',
                        goldHover: '#f3e5ab',
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #0a0a0c;
            color: #ffffff;
        }
        @keyframes floatSlow1 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.1); }
        }
        @keyframes floatSlow2 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-40px, 30px) scale(0.95); }
        }
        .blob-1 { animation: floatSlow1 12s ease-in-out infinite; }
        .blob-2 { animation: floatSlow2 15s ease-in-out infinite; }
        .glow-gold:hover {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-full px-4 relative overflow-hidden select-none">

    <!-- الخلفية المتفاعلة -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-1/4 right-1/4 w-80 h-80 bg-purple-900/15 rounded-full blur-[130px] blob-1"></div>
        <div class="absolute bottom-1/4 left-1/4 w-80 h-80 bg-amber-600/10 rounded-full blur-[130px] blob-2"></div>
    </div>

    <!-- بطاقة تسجيل الدخول -->
    <div class="relative z-15 w-full max-w-md bg-[#131318]/90 backdrop-blur-2xl border border-white/15 rounded-3xl p-6 sm:p-8 shadow-2xl">
        
        <!-- رأس البطاقة -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-purple-600 flex items-center justify-center shadow-lg shadow-amber-500/20 mx-auto mb-3">
                <i data-lucide="crown" class="w-6 h-6 text-white"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">مرحباً بك مجدداً</h1>
            <p class="text-gray-400 text-xs mt-1">سجل دخولك للوصول إلى لوحة التحكم والمنظومة الذكية</p>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" class="flex flex-col gap-4" onsubmit="handleLogin(event)">
            
            <div class="flex flex-col gap-1.5">
                <label class="text-xs text-gray-300 font-medium">البريد الإلكتروني</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-500">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </span>
                    <input type="email" id="loginEmail" required placeholder="name@example.com" 
                        class="w-full bg-white/5 border border-white/15 rounded-xl pr-10 pl-3.5 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 transition-all">
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <div class="flex items-center justify-between">
                    <label class="text-xs text-gray-300 font-medium">كلمة المرور</label>
                    <a href="#" class="text-[11px] text-amber-400 hover:underline">نسيت كلمة المرور؟</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-500">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <input type="password" id="loginPassword" required placeholder="••••••••" 
                        class="w-full bg-white/5 border border-white/15 rounded-xl pr-10 pl-3.5 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-amber-400 transition-all">
                </div>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="rememberMe" class="rounded bg-white/5 border-white/20 text-amber-500 focus:ring-0 cursor-pointer">
                <label for="rememberMe" class="text-xs text-gray-400 cursor-pointer">تذكرني على هذا الجهاز</label>
            </div>

            <button type="submit" id="loginBtn" class="mt-2 flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-amber-600 text-gray-950 font-bold py-3 rounded-xl hover:from-amber-400 hover:to-amber-500 transition-all duration-300 glow-gold shadow-lg cursor-pointer text-xs">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span>تسجيل الدخول</span>
            </button>
        </form>

        <!-- رسالة الخطأ أو النجاح الفورية -->
        <div id="loginAlert" class="mt-4 p-3 rounded-xl text-xs text-center hidden"></div>

        <!-- تذييل البطاقة -->
        <div class="text-center mt-6 pt-4 border-t border-white/10">
            <p class="text-xs text-gray-400">ليس لديك حساب بعد؟ <a href="#" class="text-amber-400 font-bold hover:underline">تواصل معنا للإنضمام</a></p>
        </div>

    </div>

    <!-- السكربتات والربط الفعلي -->
    <script>
        lucide.createIcons();

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('loginAlert');
            
            btn.disabled = true;
            btn.innerHTML = "جاري التحقق من قاعدة البيانات...";
            alertBox.classList.add('hidden');

            try {
                const response = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                alertBox.classList.remove('hidden');
                if (response.ok) {
                    alertBox.className = "mt-4 p-3 rounded-xl text-xs text-center bg-emerald-500/10 border border-emerald-500/20 text-emerald-400";
                    alertBox.innerText = result.message || "تم تسجيل الدخول بنجاح!";
                    // يمكنك توجيهه للوحة التحكم لاحقاً عبر: window.location.href = "dashboard.html";
                } else {
                    alertBox.className = "mt-4 p-3 rounded-xl text-xs text-center bg-rose-500/10 border border-rose-500/20 text-rose-400";
                    alertBox.innerText = result.detail || "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
                }
            } catch (error) {
                alertBox.classList.remove('hidden');
                alertBox.className = "mt-4 p-3 rounded-xl text-xs text-center bg-rose-500/10 border border-rose-500/20 text-rose-400";
                alertBox.innerText = "تعذر الاتصال بالخادم المحلي. تأكد من تشغيل خادم FastAPI.";
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i><span>تسجيل الدخول</span>';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
