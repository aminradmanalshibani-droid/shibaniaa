        // تسجيل الـ Service Worker لضمان العمل والفتح الفوري بدون إنترنت

               </div>            `;            lucide.createIcons();        }
        function getPageConfig(title) {            switch(title) {                case 'إدارة المبيعات':                    return { h1: 'معرف الفاتورة / العميل', h2: 'اسم العميل / جهة البيع', h3: 'مندوب المبيعات', h4: 'حالة الفاتورة', h5: 'إجمالي المبيعات', h6: 'تفاصيل الأصناف المباعة' };                case 'إدارة المشتريات':                    return { h1: 'معرف أمر الشراء', h2: 'اسم المورد / الشركة', h3: 'مسؤول المشتريات', h4: 'حالة الاستلام', h5: 'قيمة المشتريات', h6: 'تفاصيل الأصناف المشتراة' };                case 'إدارة المخزون':                case 'نقطة البيع POS':                    return { h1: 'معرف السجل (الرمز)', h2: 'البيان الرئيسي', h3: 'الفرع / التصنيف', h4: 'الحالة والاعتماد', h5: 'الرصيد الافتتاحي', h6: 'ملاحظات وتفاصيل إضافية' };                case 'دليل الحسابات':                    return { h1: 'رقم الحساب', h2: 'اسم الحساب الرئيسي', h3: 'نوع الحساب (مدين/دائن)', h4: 'حالة الحساب', h5: 'الرصيد الافتتاحي', h6: 'ملاحظات وحساب فرعي' };                case 'القيود اليومية':                    return { h1: 'رقم القيد', h2: 'بيان القيد اليومي', h3: 'مركز Cost Center', h4: 'حالة الاعتماد', h5: 'مبلغ القيد', h6: 'شرح تفصيلي للقيد' };                case 'السندات المالية':                    return { h1: 'رقم السند', h2: 'اسم المستفيد / الدافع', h3: 'نوع السند (قبض/صرف)', h4: 'طريقة الدفع', h5: 'مبلغ السند', h6: 'بيان تفصيلي للسند' };                case 'دفتر الأستاذ':                    return { h1: 'رقم الحركة', h2: 'اسم الحساب للأستاذ', h3: 'التصنيف المحاسبي', h4: 'مراجعة المدقق', h5: 'رصيد الحركة', h6: 'ملاحظات الأستاذ العام' };                case 'كشوف الحسابات':                    return { h1: 'معرف الكشف', h2: 'اسم العميل / المورد', h3: 'فترة الكشف', h4: 'حالة التدقيق', h5: 'الرصيد الختامي', h6: 'ملخص كشف الحساب' };                case 'ميزان المراجعة':                    return { h1: 'رقم الدليل', h2: 'اسم الحساب المالي', h3: 'المجاميع والحركة', h4: 'حالة التوازن', h5: 'رصيد المراجعة', h6: 'ملاحظات الميزان' };                case 'التسويات ا         function getPageData(title) {            const key = `sheibani_db_${selectedActiveYear}_${title}`;            const saved = localStorage.getItem(key);            if (saved) return JSON.parse(saved);            return [                { id: 1, f1: 'REF-001', f2: 'سجل افتراضي رئيسي', f3: 'معتمد ونشط', f4: 'تلقائي', openingBalance: '500,000', currency: currentSystemCurrency, f6: 'افتتاحي مدخل تلقائياً' }            ];        }
        function savePageData(title, data) {            const key = `sheibani_db_${selectedActiveYear}_${title}`;            localStorage.setItem(key, JSON.stringify(data));        }
        function exportDatabase() {            const backup = {};            for (let i = 0; i < localStorage.length; i++) {                const key = localStorage.key(i);                if (key.includes('sheibani_db_' + selectedActiveYear)) {                    backup[key] = localStorage.getItem(key);                }            }            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));            const downloadAnchor = document.createElement('a');            downloadAnchor.setAttribute("href", dataStr);            downloadAnchor.setAttribute("download", `Sheibani_Accounting_DB_${selectedActiveYear}.json`);            document.body.appendChild(downloadAnchor);            downloadAnchor.click();            downloadAnchor.remove();            showToast("تم تصدير قاعدة بيانات السنة بنجاح!", "success");        }
        function loadPageView(title, icon) {            currentActivePage = title;            currentActiveIcon = icon;            const area = document.getElementById('mainContentArea');            let data = getPageData(title);            let cfg = getPageConfig(title);            area.innerHTML = `                <div class="flex flex-col items-center justify-center w-full h-full p-4 overflow-hidden">                    <div id="printableArea" class="bg-white border border-slate-200 rounded-2xl p-4 max-w-5xl w-full shadow-md flex flex-col h-full max-h-[92vh] overflow-hidden">                        <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-100 shrink-0 gap-2 flex-wrap">                            <div class="flex items-center gap-2">                                <button onclick="loadHomeView()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1 shadow-sm" title="الرجوع للرئيسية">                                    <i data-lucide="arrow-right" class="w-4 h-4"></i> <span>رجوع</span>                                </button>                                <div class="w-8 h-8 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-sm shadow-inner">${icon}</div>                                <div>                                    <h2 class="font-bold text-xs text-slate-800">${title} (السنة المالية: ${selectedActiveYear})</h2>                                    <p class="text-[10px] text-slate-500">صفحة مستقلة تتضمن حقول الرصيد الافتتاحي والعملات (YER / SAR)</p>                                </div>                            </div>                            <div class="flex items-center gap-1.5 flex-wrap">                                <button onclick="openUniversalModal(-1)" class="bg-accentBlue hover:bg-accentHover text-white px-3 py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer flex <th class="p-2 text-blue-700">العملة</th>                                            <th class="p-2">${cfg.h6}</th>                                            <th class="p-2 text-center">الخيارات</th>                                        </tr>                                    </thead>                                    <tbody class="divide-y divide-slate-100 bg-white">                                        ${data.length === 0 ? `<tr><td colspan="8" class="p-6 text-center text-slate-400 text-xs">لا توجد سجلات مسجلة لهذه السنة.</td></tr>` :                                          data.map((item, index) => `                                            <tr class="hover:bg-slate-50 transition-all">                                                <td class="p-2 font-mono text-slate-400">${index + 1}</td>                                                <td class="p-2 font-mono font-bold text-blue-600">${item.f1}</td>                                                <td class="p-2 font-bold text-slate-800">${item.f2}</td>                                                <td class="p-2 text-slate-600">${item.f3}</td>                                                <td class="p-2 font-mono font-bold text-emerald-600">${item.openingBalance}</td>                                                <td class="p-2"><span class="px-2 py-0.5 rounded bg-blue-50 text-accentBlue font-bold font-mono text-[10px]">${item.currency}</span></td>                                                <td class="p-2 text-slate-600 text-[11px]">${item.f6}</td>                                                <td class="p-2 text-center space-x-1 space-x-reverse whitespace-nowrap">                                                    <button onclick="openUniversalModal(${index})" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[10px] font-bold cursor-pointer transition-all">تعديل</button>                                                    <button onclick="deleteUniversalRecord(${index})" class="bg-red-50 hover:bg-red-100 text-red-600 px-2 py-0.5 rounded text-[10px] font-bold cursor-pointer transition-all">حذف</button>                                                </td>                                            </tr>                                        `).join('')}                                    </tbody>                                </table>                            </div>                        </div>                    </div>                </div>            `;            lucide.createIcons();        }
        function openUniversalModal(index) {            document.getElementById('uniEditIndex').value = index;            document.getElementById('uniPageTitle').value = currentActivePage;            document.getElementById('modalIconTitle').innerText = currentActiveIcon;            let cfg = getPageConfig(currentActivePage);            document.getElementById('labelField1').innerText = cfg.h1;            document.getElementById('labelField2').innerText = cfg.h2;            document.getElementById('labelField3').innerText = cfg.h3;            document.getElementById('labelField4').innerText = cfg.h4;            document.getElementById('labelField5').innerText = cfg.h5;            document.getElementById('labelField6').innerText = cfg.h6;            if (index === -1) {                document.getElementById('universalModalTitle').innerText = `إضافة سجل جديد في: ${currentActivePage} (${selectedActiveYear})`;                document.getElementById('uniField1').value = 'REF-' + Math.floor(100 + Math.random() * 900);                document.getElementById('uniField2').value = '';                document.getElementById('uniField3').value = '';                document.getElementById('uniField4').value = 'نشط';                document.getElementById('uniOpeningBalance').value = '0.00';                document.getElementById('uniCurrency').value = currentSystemCurrency;                document.getElementById('uniField6').value = '';            } else {                document.getElementById('universalModalTitle').innerText = `تعديل السجل في: ${currentActivePage}`;                let data = getPageData(currentActivePage);                let record = data[index];                document.getElementById('uniField1').value = record.f1;                document.getElementById('uniField2').value = record.f2;                document.getElementById('uniField3').value = record.f3;                document.getElementById('uniField4').value = record.f4;                document.getElementById('uniOpeningBalance').value = record.openingBalance || '0.00';                document.getElementById('uniCurrency').value = record.currency || currentSystemCurrency;                document.getElementById('uniField6').value = record.f6;            }            toggleModal('universalModal');        }
        function handleUniversalFormSubmit(event) {            event.preventDefault();            const editIndex = parseInt(document.getElementById('uniEditIndex').value);            const pageTitle = document.getElementById('uniPageTitle').value;            const f1 = document.getElementById('uniField1').value.trim();            const f2 = document.getElementById('uniField2').value.trim();            const f3 = document.getElementById('uniField3').value.trim();            const f4 = document.getElementById('uniField4').value.trim();            const openingBalance = document.getElementById('uniOpeningBalance').value.trim();            const currency = document.getElementById('uniCurrency').value;            const f6 = document.getElementById('uniField6').value.trim();            if (!f1 || !f2 || !openingBalance) {                showToast("تنبيه: الحقول الأساسية ورصيد الافتتاح إجبارية!", "error");                return;            }            let data = getPageData(pageTitle);            if (editIndex === -1) {                data.push({ id: Date.now(), f1, f2, f3, f4, openingBalance, currency, f6 });                showToast("تم حفظ السجل برصيده الافتتاحي بنجاح!", "success");            } else {                data[editIndex] = { id: data[editIndex].id, f1, f2, f3, f4, openingBalance, currency, f6 };                showToast("تم تحديث السجل بنجاح!", "success");            }            savePageData(pageTitle, data);            toggleModal('universalModal');            loadPageView(pageTitle, currentActiveIcon);        }
        function deleteUniversalRecord(index) {            if (confirm("هل أنت متأكد من حذف هذا السجل نهائياً؟")) {                let data = getPageData(currentActivePage);                data.splice(index, 1);                savePageData(currentActivePage, data);                showToast("تم حذف السجل بنجاح.", "success");                loadPageView(currentActivePage, currentActiveIcon);            }        }    </script></body></html>
