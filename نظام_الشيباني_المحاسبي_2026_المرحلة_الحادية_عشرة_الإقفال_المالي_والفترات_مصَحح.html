async function p11SavePeriod(e){e.preventDefault();await p11EnsureStores();const name=document.getElementById('p11Name').value.trim(),f=document.getElementById('p11From').value,t=document.getElementById('p11To').value;if(!f||!t||t<f)return toast('تحقق من تواريخ الفترة','error');const rows=await all('financialPeriods');if(rows.some(x=>!(t<x.startDate||f>x.endDate)))return toast('توجد فترة متداخلة','error');await add('financialPeriods',{name,startDate:f,endDate:t,status:'مفتوحة',createdAt:new Date().toISOString()});await logAudit('إنشاء فترة مالية',name);toast('تم إنشاء الفترة');renderFinancialPeriods11()}
async function p11TogglePeriod(id){await p11EnsureStores();const x=await get('financialPeriods',id);if(!x)return;x.status=x.status==='مغلقة'?'مفتوحة':'مغلقة';x.updatedAt=new Date().toISOString();await put('financialPeriods',x);await logAudit(x.status==='مغلقة'?'إغلاق فترة مالية':'فتح فترة مالية',x.name);toast('تم تحديث حالة الفترة');renderFinancialPeriods11()}
async function p11PeriodForDate(date){await p11EnsureStores();return (await all('financialPeriods')).find(x=>p11Range(date,x.startDate,x.endDate))||null}
async function p11IsClosed(date){const p=await p11PeriodForDate(date);return !!p&&p.status==='مغلقة'}
async function p11OpeningBalances(){await p11EnsureStores();const [accounts,rows]=await Promise.all([all('accounts'),all('openingBalances')]);const map=new Map(rows.map(x=>[Number(x.accountId),x]));document.getElementById('content').innerHTML=shell('📌 الأرصدة الافتتاحية',`<div class="card"><div class="form-grid"><div class="field"><label>تاريخ الرصيد الافتتاحي</label><input id="p11OpenDate" type="date" value="${today()}"></div></div></div><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>الكود</th><th>الحساب</th><th>مدين افتتاحي</th><th>دائن افتتاحي</th></tr></thead><tbody>${accounts.map(a=>{const r=map.get(Number(a.id))||{};return `<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td><input id="p11d_${a.id}" type="number" step=".01" value="${num(r.debit)}"></td><td><input id="p11c_${a.id}" type="number" step=".01" value="${num(r.credit)}"></td></tr>`}).join('')}</tbody></table></div><div class="actions" style="margin-top:8px"><button class="btn primary" onclick="p11SaveOpeningBalances()">حفظ الأرصدة الافتتاحية</button></div>`)}
async function p11SaveOpeningBalances(){await p11EnsureStores();const accounts=await all('accounts'),date=document.getElementById('p11OpenDate').value;for(const a of accounts){const debit=num(document.getElementById('p11d_'+a.id).value),credit=num(document.getElementById('p11c_'+a.id).value);const old=(await all('openingBalances')).find(x=>Number(x.accountId)===Number(a.id));const rec={...(old||{}),accountId:a.id,date,debit,credit,updatedAt:new Date().toISOString()};old?await put('openingBalances',rec):await add('openingBalances',rec)}await logAudit('حفظ الأرصدة الافتتاحية',date);toast('تم حفظ الأرصدة الافتتاحية')}
async function p11ClosePreview(){await p11EnsureStores();const periods=(await all('financialPeriods')).filter(x=>x.status==='مفتوحة');document.getElementById('content').innerHTML=shell('🔒 الإقفال المالي',`<div class="card"><div class="field"><label>الفترة المفتوحة</label><select id="p11ClosePeriod">${periods.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.startDate} - ${x.endDate})</option>`).join('')}</select></div><div class="actions" style="margin-top:8px"><button class="btn primary" onclick="p11FinalizeClose()">معاينة وإقفال الفترة</button></div></div><div id="p11CloseResult" class="card" style="margin-top:8px">اختر فترة للإقفال.</div>`)}
async function p11FinalizeClose(){await p11EnsureStores();const p=await get('financialPeriods',document.getElementById('p11ClosePeriod').value);if(!p)return;const [j,a]=await Promise.all([all('journal'),all('accounts')]);const sums={};j.filter(x=>x.status!=='مسودة'&&p11Range(x.date,p.startDate,p.endDate)).forEach(x=>(x.lines||[]).forEach(l=>{const s=sums[l.accountId]||(sums[l.accountId]={d:0,c:0});s.d+=num(l.debit);s.c+=num(l.credit)}));let rev=0,exp=0;a.forEach(ac=>{const s=sums[ac.id]||{d:0,c:0};const b=s.d-s.c;if(ac.type==='إيراد')rev+=-b;if(ac.type==='مصروف')exp+=b});const net=rev-exp;p.status='مغلقة';p.closedAt=new Date().toISOString();await put('financialPeriods',p);await add('periodClosings',{periodId:p.id,date:today(),revenue:rev,expenses:exp,netResult:net,status:'مغلق'});await logAudit('إقفال مالي',`${p.name} | صافي النتيجة ${net}`);document.getElementById('p11CloseResult').innerHTML=`<b>تم إقفال الفترة بنجاح</b><div class="grid g3" style="margin-top:8px"><div class="kpi"><span>الإيرادات</span><b>${money(rev)}</b></div><div class="kpi"><span>المصروفات</span><b>${money(exp)}</b></div><div class="kpi"><span>صافي النتيجة</span><b>${money(net)}</b></div></div>`;toast('تم الإقفال المالي')}
const __p11LoadPage=window.loadPage;window.loadPage=async function(page){if(page==='financialPeriods11')return renderFinancialPeriods11();if(page==='openingBalances11')return p11OpeningBalances();if(page==='financialClosing11')return p11ClosePreview();return __p11LoadPage(page)};
function p11InjectNavigation(){const sb=document.getElementById('sidebar');if(!sb||document.getElementById('p11NavMarker'))return;const m=document.createElement('div');m.id='p11NavMarker';m.innerHTML=`<div class="nav-title">المرحلة الحادية عشرة — الإقفال المالي</div><button class="nav-btn" onclick="loadPage('financialPeriods11')">📅 الفترات المالية</button><button class="nav-btn" onclick="loadPage('openingBalances11')">📌 الأرصدة الافتتاحية</button><button class="nav-btn" onclick="loadPage('financialClosing11')">🔒 الإقفال المالي</button>`;sb.appendChild(m)}
setTimeout(p11InjectNavigation,250);
window.__SHEIBANI_PHASE11_CLOSING__=true;
</script>
