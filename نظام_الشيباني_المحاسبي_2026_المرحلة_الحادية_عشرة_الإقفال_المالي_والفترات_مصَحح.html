<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}
.login{height:100%;display:grid;place-items:center;padding:20px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 15px 40px #0f172a18;padding:22px}
.logo{width:58px;height:58px;border-radius:18px;background:#eff6ff;color:#2563eb;display:grid;place-items:center;font-size:28px;margin:auto}
h1,h2,h3,p{margin:0}
.title{font-size:18px;font-weight:900;margin-top:10px;text-align:center}
.muted{color:#64748b;font-size:11px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:800;color:#334155}
.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px;background:#fff;outline:none;font-size:12px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
.btn{border:0;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:800}
.primary{background:#2563eb;color:#fff}.success{background:#059669;color:#fff}.danger{background:#dc2626;color:#fff}
.secondary{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}.warning{background:#d97706;color:#fff}
.header{height:58px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;flex-shrink:0}
.brand{font-weight:900;font-size:13px}.header small{font-size:9px;color:#cbd5e1}
.header-actions{display:flex;gap:6px;align-items:center}
.main{flex:1;min-height:0;display:flex;overflow:hidden}
.sidebar{width:225px;background:#fff;border-left:1px solid #e2e8f0;padding:8px;overflow-y:auto;flex-shrink:0}
.nav-title{font-size:10px;font-weight:900;color:#64748b;padding:9px 7px 5px}
.nav-btn{width:100%;border:0;background:#fff;text-align:right;padding:9px;border-radius:10px;font-size:11px;font-weight:800;color:#334155}
.nav-btn:hover{background:#eff6ff;color:#1d4ed8}
.content{flex:1;min-width:0;min-height:0;padding:10px;overflow:hidden}
.page{height:100%;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 3px 12px #0f172a0a;display:flex;flex-direction:column;overflow:hidden}
.page-head{padding:10px 12px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.page-title{font-size:13px;font-weight:900}.page-body{padding:10px;min-height:0;flex:1;overflow:auto}
.grid{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px}
.kpi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px}.kpi b{font-size:18px}.kpi span{display:block;color:#64748b;font-size:10px;margin-bottom:5px}
.module{border:1px solid #e2e8f0;background:#fff;border-radius:15px;padding:13px;text-align:right;display:flex;gap:10px;align-items:center}
.module .ico{font-size:23px}.module b{font-size:11px;display:block}.module small{font-size:9px;color:#64748b}
.module:hover{border-color:#93c5fd;background:#eff6ff}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.table-wrap{border:1px solid #e2e8f0;border-radius:12px;overflow:auto;max-height:100%;min-height:0}
table{width:100%;border-collapse:collapse;min-width:720px;font-size:10px}
th{background:#f1f5f9;position:sticky;top:0;z-index:1;font-weight:900}
th,td{padding:8px;border-bottom:1px solid #f1f5f9;text-align:right;white-space:nowrap}
td .btn{padding:5px 7px;font-size:9px}

.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:#0f172a80;display:grid;place-items:center;padding:15px;z-index:50}
.modal-card{width:min(850px,100%);max-height:92vh;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}

.pos-cart-list{overflow:auto;flex:1}.pos-total{border-top:1px solid #e2e8f0;padding-top:8px;margin-top:8px}

@media(max-width:900px){
 .sidebar{width:175px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .pos{grid-template-columns:1fr}.pos-products{min-height:48%}.pos-cart{min-height:48%}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}

 .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.header{height:52px}.page-head{padding:8px}.page-body{padding:8px}
}

/* المرحلة الثانية: حماية العرض ومنع التداخل والقطع */
.page-body{overflow:hidden}
.screen-layout{height:100%;min-height:0;display:flex;flex-direction:column;gap:9px}
.screen-scroll{min-height:0;flex:1;overflow:auto}
.form-card{flex-shrink:0}
.table-wrap{flex:1;min-height:0;overflow:auto}
@media(max-width:620px){.page-title{font-size:12px}.page-head .btn{padding:7px 8px}.toolbar{flex-wrap:wrap}.actions{flex-wrap:wrap}}

/* POS Phase 6.2 - expanded cart and bottom action bar */
.pos-v6-expanded{width:100%;}
.pos-bottom-panel{background:#fff;padding:8px 0 0;}
.pos-main-actions .btn{min-height:42px;}
@media(max-width:620px){.pos-main-actions{grid-template-columns:1fr 1fr 1fr!important}.pos-main-actions .btn{padding:10px 5px!important;font-size:10px}.pos-bottom-panel .stat{font-size:10px}.pos-bottom-panel .big-total{font-size:16px}.pos-cart-list table{font-size:9px}.pos-cart-list th,.pos-cart-list td{padding:6px 4px}.pos-cart .toolbar{flex-wrap:wrap}.pos-cart .toolbar select,.pos-cart .toolbar input{min-width:0!important;flex:1 1 45%}}

/* POS Phase 6 UI integrity: no clipped headings/buttons on narrow screens */
.page-head{min-width:0;flex-wrap:wrap}
.page-head>div{min-width:0}
.page-title{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}
.grid>.card,.grid>.form-card{min-width:0;min-height:0}
.table-wrap{width:100%;min-width:0;overflow:auto}
.card h3{display:block;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.5;min-height:24px;margin:0 0 8px}
.shift-history-title{font-size:15px;font-weight:900;text-align:right}
@media(max-width:620px){
  .page-head{align-items:flex-start}
  .page-head>div:first-child{width:100%;flex-wrap:wrap}
  .page-head .actions{width:100%}
  .page-title{font-size:13px}
  .grid.g2{grid-template-columns:1fr}
}
</style>

<script>
'use strict';
const DB_NAME='SheibaniAccounting2026', DB_VERSION=9, BASE_CURRENCY='SAR';
const STORES=['company','users','items','warehouses','customers','suppliers','salesInvoices','salesOrders','salesReturns','salesPayments','quotations','discounts','purchaseInvoices','purchaseReturns','purchasePayments','journal','receipts','payments','accounts','notes','stockMoves','inventoryBalances','stockTransfers','purchaseOrders','auditLog','posShifts','suspendedSales','cashBoxes','bankAccounts','cashTransfers','bankTransactions','treasuryTransactions'];
let db=null, currentPage='dashboard', posCart=[];
let fallbackMode=false, fallbackData={};
function initFallbackDB(){
 fallbackMode=true;
 STORES.forEach(s=>{
  try{fallbackData[s]=JSON.parse(localStorage.getItem('SheibaniFallback_'+s)||'null')||[];}catch(e){fallbackData[s]=[];}
 });
}
function saveFallbackStore(store){try{localStorage.setItem('SheibaniFallback_'+store,JSON.stringify(fallbackData[store]||[]));}catch(e){console.warn('Fallback storage save skipped',e)}}


const seed={
 company:[{id:1,name:'منشأة الشيباني التجارية',taxNo:'',address:'',phone:'',currency:'SAR'}],
 users:[{id:1,username:'admin',fullname:'مدير النظام',role:'مدير',status:'نشط',password:'1234'}],
 items:[
  {id:1,code:'ITM-001',barcode:'100001',name:'قميص رجالي',unit:'قطعة',qty:100,cost:25,price:40,category:'ملابس',warehouseId:1,status:'نشط'},
  {id:2,code:'ITM-002',barcode:'100002',name:'بنطلون رجالي',unit:'قطعة',qty:70,cost:35,price:55,category:'ملابس',warehouseId:1,status:'نشط'},
  {id:3,code:'ITM-003',barcode:'100003',name:'دواء تجريبي',unit:'علبة',qty:50,cost:12,price:20,category:'صيدلية',warehouseId:1,status:'نشط'}
 ],
 warehouses:[{id:1,code:'WH-001',name:'المخزن الرئيسي',location:'المقر الرئيسي',manager:'مدير المخزن',status:'نشط'}],
 customers:[{id:1,code:'CUS-001',name:'عميل نقدي',phone:'',address:'',balance:0,status:'نشط'}],
 suppliers:[{id:1,code:'SUP-001',name:'مورد عام',phone:'',address:'',balance:0,status:'نشط'}],
 salesInvoices:[],salesOrders:[],salesReturns:[],salesPayments:[],quotations:[],discounts:[],
 purchaseInvoices:[],purchaseReturns:[],purchasePayments:[],journal:[],receipts:[],payments:[],
 accounts:[
  {id:1,code:'1100',name:'الصندوق',type:'أصل',parentId:null},
  {id:2,code:'1200',name:'البنك',type:'أصل',parentId:null},
  {id:3,code:'1300',name:'العملاء',type:'أصل',parentId:null},
  {id:4,code:'1400',name:'المخزون',type:'أصل',parentId:null},
  {id:5,code:'2100',name:'الموردون',type:'التزام',parentId:null},
  {id:6,code:'4100',name:'المبيعات',type:'إيراد',parentId:null},
  {id:7,code:'5100',name:'تكلفة المبيعات',type:'مصروف',parentId:null}
 ],
 notes:[],stockMoves:[],inventoryBalances:[],stockTransfers:[],purchaseOrders:[],auditLog:[],posShifts:[],suspendedSales:[]
};

function openDB(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB) return reject(new Error('المتصفح لا يدعم IndexedDB'));
  let settled=false, timer;
  const finish=(ok,v)=>{if(settled)return;settled=true;clearTimeout(timer);ok?resolve(v):reject(v)};
  const ensureStores=(version)=>{
   const r=indexedDB.open(DB_NAME,version);
   r.onupgradeneeded=e=>{
    const d=e.target.result;
    STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})});
   };
   r.onblocked=()=>console.warn('IndexedDB upgrade/open is blocked');
   r.onerror=()=>finish(false,r.error||new Error('تعذر فتح قاعدة البيانات المحلية'));
   r.onsuccess=e=>{
    const d=e.target.result;
    const missing=STORES.filter(s=>!d.objectStoreNames.contains(s));
    if(missing.length){
     const next=(Number(d.version)||1)+1;
     d.close();
     return ensureStores(next);
    }
    db=d;
    db.onversionchange=()=>{try{db.close()}catch{}};
    finish(true,db);
   };
  };
  const probe=indexedDB.open(DB_NAME);
  probe.onupgradeneeded=e=>{
   const d=e.target.result;
   STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})});
  };
  probe.onblocked=()=>console.warn('IndexedDB initial open is blocked');
  probe.onerror=()=>finish(false,probe.error||new Error('تعذر فتح قاعدة البيانات المحلية'));
  probe.onsuccess=e=>{
   const d=e.target.result;
   const missing=STORES.filter(s=>!d.objectStoreNames.contains(s));
   if(missing.length){
    const next=(Number(d.version)||1)+1;
    d.close();
    return ensureStores(next);
   }
   db=d;
   db.onversionchange=()=>{try{db.close()}catch{}};
   finish(true,db);
  };
  timer=setTimeout(()=>finish(false,new Error('انتهت مهلة تهيئة قاعدة البيانات المحلية')),5000);
 });
}
function tx(store,mode='readonly'){if(fallbackMode) return null;if(!db)throw new Error('قاعدة البيانات المحلية غير جاهزة');return db.transaction(store,mode).objectStore(store)}
function all(store){if(fallbackMode)return Promise.resolve([...(fallbackData[store]||[])]);return new Promise((res,rej)=>{try{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function get(store,id){if(fallbackMode)return Promise.resolve((fallbackData[store]||[]).find(x=>Number(x.id)===Number(id)));return new Promise((res,rej)=>{try{const r=tx(store).get(Number(id));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function put(store,obj){if(fallbackMode){const a=fallbackData[store]||(fallbackData[store]=[]);const i=a.findIndex(x=>Number(x.id)===Number(obj.id));if(i>=0)a[i]={...a[i],...obj};else a.push({...obj});saveFallbackStore(store);return Promise.resolve(obj.id)}return new Promise((res,rej)=>{try{const r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function add(store,obj){if(fallbackMode){const a=fallbackData[store]||(fallbackData[store]=[]);const copy={...obj};if(copy.id==null)copy.id=a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1;a.push(copy);saveFallbackStore(store);return Promise.resolve(copy.id)}return new Promise((res,rej)=>{try{const r=tx(store,'readwrite').add(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function remove(store,id){if(fallbackMode){fallbackData[store]=(fallbackData[store]||[]).filter(x=>Number(x.id)!==Number(id));saveFallbackStore(store);return Promise.resolve()}return new Promise((res,rej)=>{try{const r=tx(store,'readwrite').delete(Number(id));r.onsuccess=()=>res();r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function count(store){return (await all(store)).length}
async function seedDB(){
 // تهيئة البيانات الافتراضية في دفعات متوازية، دون انتظار عشرات معاملات IndexedDB واحداً تلو الآخر.
 await Promise.all(STORES.filter(s=>seed[s]).map(async s=>{
  if((await count(s))===0){
   for(const row of seed[s]) await add(s,row);
  }
 }));
 const users=await all('users');
 if(!users.some(u=>u.username==='admin')) await add('users',{username:'admin',fullname:'مدير النظام',role:'مدير',status:'نشط',password:'1234'});
}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)+' SAR';
const num=v=>Number(v)||0;
const today=()=>new Date().toISOString().slice(0,10);

 let ok=defaultAdmin;
 // لا نؤخر دخول المدير بسبب انتظار IndexedDB. يتم التحقق من المستخدمين المحليين إذا كانت القاعدة جاهزة.

 try{

  await loadPage('dashboard');
 }catch(err){

async function saveInvoice(e,kind){

 const partyId=num(fParty.value), date=fDate.value, payment=fPay.value, warehouseId=num(fWh.value);
 const sub=window.invoiceLines.reduce((a,x)=>a+num(x.qty)*num(x.price),0), discount=num(fDiscount.value),tax=num(fTax.value),total=Math.max(0,sub-discount+tax),paid=num(fPaid.value),remaining=Math.max(0,total-paid);
 const items=await all('items');
 for(const l of window.invoiceLines){const it=items.find(x=>x.id===l.itemId);if(!it)return toast('صنف غير موجود','error');if(isSale&&num(it.qty)<num(l.qty))return toast(`المخزون غير كافٍ للصنف: ${it.name}`,'error')}
 const inv={code:(isSale?'SINV-':'PINV-')+Date.now(),date,partyId,warehouseId,payment,lines:window.invoiceLines.map(x=>({...x})),subtotal:sub,discount,tax,total,paid,remaining,currency:'SAR',status:'مرحل'};
 await add(store,inv);
 for(const l of window.invoiceLines){const it=items.find(x=>x.id===l.itemId);it.qty+=isSale?-num(l.qty):num(l.qty);await put('items',it);await add('stockMoves',{date,type:isSale?'بيع':'شراء',itemId:it.id,qty:isSale?-num(l.qty):num(l.qty),ref:inv.code})}
 const party=await get(partyStore,partyId);if(party){party.balance+=isSale?remaining:-remaining;await put(partyStore,party)}
 await postJournalForInvoice(inv,isSale);
 closeModal();toast('تم حفظ وترحيل الفاتورة بنجاح');loadPage(isSale?'salesInvoices':'purchases');
}
function invoiceFx(inv){
 const currency=inv?.currency||'SAR';
 const rate=Math.max(0.000001,num(inv?.exchangeRate)||1);
 const factor=currency==='YER'?rate:1;
 return {currency,rate,factor};
}
function foreignValue(inv,baseAmount){return num(baseAmount)*invoiceFx(inv).factor;}
async function postJournalForInvoice(inv,isSale){
 const cashAccount=isSale?(inv.payment==='بنك'?2:1):(inv.payment==='بنك'?2:1);
 const partyAccount=isSale?3:5, salesAccount=isSale?6:4;
 const fx=invoiceFx(inv);
 let lines=[];
 if(isSale){
  lines=[
   {accountId:cashAccount,debit:inv.paid,credit:0,foreignDebit:foreignValue(inv,inv.paid),foreignCredit:0},
   {accountId:partyAccount,debit:inv.remaining,credit:0,foreignDebit:foreignValue(inv,inv.remaining),foreignCredit:0},
   {accountId:salesAccount,debit:0,credit:inv.total,foreignDebit:0,foreignCredit:foreignValue(inv,inv.total)}
  ];
 }else{
  lines=[
   {accountId:4,debit:inv.total,credit:0,foreignDebit:foreignValue(inv,inv.total),foreignCredit:0},
   {accountId:cashAccount,debit:inv.paid,credit:0,foreignDebit:foreignValue(inv,inv.paid),foreignCredit:0},
   {accountId:partyAccount,debit:0,credit:inv.remaining,foreignDebit:0,foreignCredit:foreignValue(inv,inv.remaining)}
  ];
 }
 await add('journal',{
  code:'JV-'+Date.now(),date:inv.date,source:inv.code,
  description:isSale?'ترحيل فاتورة مبيعات':'ترحيل فاتورة مشتريات',
  currency:fx.currency,exchangeRate:fx.rate,baseCurrency:'SAR',
  currencyTotal:num(inv.currencyTotal)||foreignValue(inv,inv.total),
  lines,totalDebit:lines.reduce((a,x)=>a+x.debit,0),totalCredit:lines.reduce((a,x)=>a+x.credit,0)
 });
}

async function renderTrial(){const j=await all('journal'),a=await all('accounts');const sums={};j.forEach(v=>(v.lines||[]).forEach(l=>{sums[l.accountId]??={d:0,c:0};sums[l.accountId].d+=num(l.debit);sums[l.accountId].c+=num(l.credit)}));const rows=a.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${money(sums[x.id]?.d)}</td><td>${money(sums[x.id]?.c)}</td></tr>`).join('');const d=Object.values(sums).reduce((s,x)=>s+x.d,0),c=Object.values(sums).reduce((s,x)=>s+x.c,0);document.getElementById('content').innerHTML=shell('ميزان المراجعة',`<div class="card" style="margin-bottom:9px"><div class="stat"><span>إجمالي المدين</span><b>${money(d)}</b></div><div class="stat"><span>إجمالي الدائن</span><b>${money(c)}</b></div><div class="stat"><span>حالة التوازن</span><b>${Math.abs(d-c)<.01?'متوازن':'غير متوازن'}</b></div></div><div class="table-wrap"><table><thead><tr><th>الرمز</th><th>الحساب</th><th>مدين</th><th>دائن</th></tr></thead><tbody>${rows}</tbody></table></div>`)}

async function renderBackup(){document.getElementById('content').innerHTML=shell('النسخ الاحتياطي والاستعادة',`<div class="grid g2"><div class="card"><b>تصدير نسخة احتياطية</b><p class="muted" style="margin:7px 0 10px">يشمل جميع جداول قاعدة البيانات المحلية.</p><button class="btn primary" onclick="backup()">⬇ تصدير JSON</button></div><div class="card"><b>استعادة نسخة</b><p class="muted" style="margin:7px 0 10px">تحقق من الملف قبل استبدال البيانات الحالية.</p><input id="restoreFile" type="file" accept=".json,application/json" onchange="restore(event)"></div></div>`)}
async function backup(){const data={version:DB_VERSION,date:new Date().toISOString(),stores:{}};for(const s of STORES)data.stores[s]=await all(s);const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Sheibani_DB_2026.json';a.click();URL.revokeObjectURL(a.href);toast('تم تصدير النسخة الاحتياطية')}
async function restore(e){const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj?.stores||typeof obj.stores!=='object')throw Error('صيغة النسخة غير صحيحة');for(const s of STORES){const rows=Array.isArray(obj.stores[s])?obj.stores[s]:[];const old=await all(s);for(const x of old)await remove(s,x.id);for(const x of rows)await put(s,x)}toast('تمت الاستعادة بنجاح');loadPage('dashboard')}catch(err){toast('فشل الاستعادة: '+err.message,'error')}}

function pageLayout(form,table){return `<div class="screen-layout">${form?`<div class="form-card">${form}</div>`:''}<div class="screen-scroll">${table||''}</div></div>`}
async function existsIn(store,id){return !!(await get(store,id))}
async function safeDeleteParty(store,id){
 const sales=store==='customers'?await all('salesInvoices'):await all('purchaseInvoices');
 if(sales.some(x=>Number(x.partyId)===Number(id)))return toast('لا يمكن حذف السجل لأنه مرتبط بفواتير مرحّلة','error');
 if(!confirm('هل تريد حذف هذا السجل؟'))return;
 await remove(store,id); toast('تم الحذف بنجاح'); store==='customers'?renderCustomers():renderSuppliers();
}

async function renderReturns(title,store,direction){
 const items=await all('items'); const rows=(await all(store)).slice().reverse().map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.date)}</td><td>${esc((items.find(i=>i.id===x.itemId)||{}).name||'')}</td><td>${x.qty}</td><td>${money(x.total)}</td><td>${esc(x.status)}</td></tr>`).join('');
 const form=`<form onsubmit="saveReturn(event,'${store}',${direction})" class="card"><div class="form-grid"><div class="field"><label>التاريخ</label><input id="rDate" type="date" value="${today()}"></div><div class="field"><label>الصنف</label><select id="rItem">${items.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>الكمية</label><input id="rQty" type="number" min=".001" step=".001" value="1"></div><div class="field"><label>المبلغ SAR</label><input id="rTotal" type="number" min="0" step=".01" value="0"></div></div><div class="actions" style="margin-top:8px"><button class="btn primary">ترحيل المرتجع</button></div></form>`;
 const table=`<div class="table-wrap"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">لا توجد مرتجعات</td></tr>'}</tbody></table></div>`;
 document.getElementById('content').innerHTML=shell(title,pageLayout(form,table));
}
async function saveReturn(e,store,direction){
 e.preventDefault();const id=num(rItem.value),q=num(rQty.value),amount=num(rTotal.value),it=await get('items',id);if(!it||q<=0)return toast('تحقق من الصنف والكمية','error');
 if(direction===-1&&num(it.qty)<q)return toast('كمية المرتجع أكبر من المخزون المتاح','error');
 const code='RET-'+Date.now();it.qty=num(it.qty)+direction*q;await put('items',it);
 await add(store,{code,date:rDate.value,itemId:id,qty:q,total:amount,status:'مرحل'});
 await add('stockMoves',{date:rDate.value,type:store==='salesReturns'?'مرتجع مبيعات':'مرتجع مشتريات',itemId:id,qty:direction*q,ref:code});
 const lines=store==='salesReturns'?[{accountId:6,debit:amount,credit:0},{accountId:1,debit:0,credit:amount}]:[{accountId:4,debit:amount,credit:0},{accountId:5,debit:0,credit:amount}];
 await add('journal',{code:'JV-'+Date.now(),date:rDate.value,source:store==='salesReturns'?'مرتجع مبيعات':'مرتجع مشتريات',description:code,lines,totalDebit:amount,totalCredit:amount});
 toast('تم ترحيل المرتجع وتحديث المخزون والقيد');loadPage(store);
}
async function renderPayments(title,store,type){
 const partyStore=type==='customer'?'customers':'suppliers',parties=await all(partyStore),rows=(await all(store)).slice().reverse().map(x=>{const p=parties.find(z=>z.id===x.partyId);return `<tr><td>${esc(x.code||'')}</td><td>${esc(x.date)}</td><td>${esc(p?.name||'')}</td><td>${money(x.amount)}</td><td>${esc(x.payment)}</td></tr>`}).join('');
 const form=`<form onsubmit="savePartyPayment(event,'${store}','${type}')" class="card"><div class="form-grid"><div class="field"><label>التاريخ</label><input id="ppDate" type="date" value="${today()}"></div><div class="field"><label>${type==='customer'?'العميل':'المورد'}</label><select id="ppParty">${parties.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.balance)}</option>`).join('')}</select></div><div class="field"><label>المبلغ SAR</label><input id="ppAmount" type="number" min=".01" step=".01" required></div><div class="field"><label>طريقة الدفع</label><select id="ppPay"><option>نقدي</option><option>بنك</option></select></div></div><div class="actions" style="margin-top:8px"><button class="btn primary">حفظ وترحيل</button></div></form>`;
 const table=`<div class="table-wrap"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>الطرف</th><th>المبلغ</th><th>الدفع</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">لا توجد عمليات مسجلة</td></tr>'}</tbody></table></div>`;
 document.getElementById('content').innerHTML=shell(title,pageLayout(form,table));
}
async function savePartyPayment(e,store,type){
 e.preventDefault();const partyStore=type==='customer'?'customers':'suppliers',p=await get(partyStore,ppParty.value),amount=num(ppAmount.value);if(!p||amount<=0)return toast('أدخل مبلغًا صحيحًا','error');if(amount>num(p.balance))return toast('المبلغ أكبر من الرصيد المستحق','error');
 p.balance=Math.max(0,num(p.balance)-amount);await put(partyStore,p);const code=(type==='customer'?'RCV-':'PAY-')+Date.now();await add(store,{date:ppDate.value,partyId:p.id,amount,payment:ppPay.value,code});
 const cashAccount=ppPay.value==='بنك'?2:1,partyAccount=type==='customer'?3:5;
 const lines=type==='customer'?[{accountId:cashAccount,debit:amount,credit:0},{accountId:partyAccount,debit:0,credit:amount}]:[{accountId:partyAccount,debit:amount,credit:0},{accountId:cashAccount,debit:0,credit:amount}];
 await add('journal',{code:'JV-'+Date.now(),date:ppDate.value,source:type==='customer'?'تحصيل عميل':'سداد مورد',description:code,lines,totalDebit:amount,totalCredit:amount});

async function savePurchaseOrder(e){
  e.preventDefault();
  const obj={

async function changePurchaseOrderStatus(id){
  const o=await get('purchaseOrders',id); if(!o) return;
  const next={'مفتوح':'معتمد','معتمد':'مكتمل','مكتمل':'مغلق','مغلق':'مفتوح'}[o.status]||'مفتوح';
  if(!confirm(`تغيير حالة الأمر من "${o.status}" إلى "${next}"؟`)) return;
  o.status=next; await put('purchaseOrders',o); await audit('تحديث أمر شراء',`${o.code} → ${next}`);
  toast('تم تحديث الحالة'); renderPurchaseOrders();
}
async function deletePurchaseOrder(id){
  const o=await get('purchaseOrders',id); if(!o) return;
  if(!confirm('هل تريد حذف أمر الشراء؟')) return;
  await remove('purchaseOrders',id); await audit('حذف أمر شراء',o.code);
  toast('تم حذف أمر الشراء'); renderPurchaseOrders();
}

function accountSums(journal){
  const sums={};
  journal.forEach(v=>(v.lines||[]).forEach(l=>{
    sums[l.accountId]??={debit:0,credit:0};
    sums[l.accountId].debit+=num(l.debit); sums[l.accountId].credit+=num(l.credit);
  }));
  return sums;
}

async function drawAccountStatement(){
  const id=num(document.getElementById('statementAccount').value);
  if(!id){ document.getElementById('statementResult').innerHTML='<div class="empty">اختر حسابًا</div>'; return; }
  const from=document.getElementById('statementFrom').value, to=document.getElementById('statementTo').value;
  const journal=await all('journal'), invoices=await all('salesInvoices');
  let balSAR=0, balYER=0, rows=[];
  const findInvoiceForJournal=(j)=>{
    const src=String(j.source||'');
    return invoices.find(x=>String(x.code)===src) || invoices.find(x=>src.startsWith(String(x.code)+'-')) || null;
  };
  journal.filter(j=>(!from||j.date>=from)&&(!to||j.date<=to))
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)))
    .forEach(j=>{
      const inv=findInvoiceForJournal(j);
      const rate=Math.max(0.000001,num(j.exchangeRate)||num(inv?.exchangeRate)||num(window.POS_DEFAULT_EXCHANGE_RATE)||413);
      (j.lines||[]).filter(l=>num(l.accountId)===id).forEach(l=>{
        const debitSAR=num(l.debit), creditSAR=num(l.credit);
        // المحرك المحاسبي يحتفظ بـ SAR كأساس. المقابل YER يُحسب لكل حركة بسعر الصرف المثبت في الفاتورة.
        const debitYER=debitSAR*rate, creditYER=creditSAR*rate;
        balSAR += debitSAR-creditSAR;
        balYER += debitYER-creditYER;
        rows.push(`<tr>
          <td>${esc(j.date)}</td>
          <td>${esc(j.code)}</td>
          <td>${esc(j.description||j.source||'')}</td>
          <td>${money(debitSAR)} SAR</td>
          <td>${posFmt_v6(debitYER)} YER</td>
          <td>${money(creditSAR)} SAR</td>
          <td>${posFmt_v6(creditYER)} YER</td>
          <td>${money(balSAR)} SAR</td>
          <td>${posFmt_v6(balYER)} YER</td>
        </tr>`);
      });
    });
  document.getElementById('statementResult').innerHTML=`
    <div class="muted" style="margin-bottom:6px;font-size:10px">نظام تعدد العملات: يعرض كل قيد بالقيمة المحاسبية الأساسية SAR وبالقيمة المقابلة YER وفق سعر الصرف المثبت مع الفاتورة. العمليات القديمة التي لا تحتوي سعر صرف تستخدم السعر الافتراضي الحالي.</div>
    <table><thead><tr>
      <th>التاريخ</th><th>المرجع</th><th>البيان</th>
      <th>مدين SAR</th><th>مدين YER</th>
      <th>دائن SAR</th><th>دائن YER</th>
      <th>الرصيد SAR</th><th>الرصيد YER</th>
    </tr></thead><tbody>${rows.join('')||'<tr><td colspan="9" class="empty">لا توجد حركة للحساب</td></tr>'}</tbody></table>`;
}

async function renderProfitLoss(){
  const journal=await all('journal'), accounts=await all('accounts');
  const sums=accountSums(journal);
  const byType=t=>accounts.filter(a=>a.type===t).map(a=>{
    const s=sums[a.id]||{debit:0,credit:0};

  const revenues=byType('إيراد'), expenses=byType('مصروف');

    </div>

function normalizeJournalLines(lines){
  return (lines||[]).map(l=>({
    accountId:num(l.accountId),
    debit:Math.max(0,num(l.debit)),
    credit:Math.max(0,num(l.credit)),
    note:String(l.note||'')
  })).filter(l=>l.accountId && (l.debit>0 || l.credit>0));
}

function validateJournalLines(lines){
  const clean=normalizeJournalLines(lines);
  if(clean.length<2) throw new Error('القيد يجب أن يحتوي على طرفين محاسبيين على الأقل');
  if(clean.some(l=>l.debit>0 && l.credit>0)) throw new Error('لا يمكن أن يكون السطر مدينًا ودائنًا في الوقت نفسه');
  const debit=clean.reduce((s,l)=>s+l.debit,0);
  const credit=clean.reduce((s,l)=>s+l.credit,0);
  if(debit<=0 || credit<=0) throw new Error('يجب أن يحتوي القيد على مبالغ مدينة ودائنة');
  if(Math.abs(debit-credit)>0.009) throw new Error(`القيد غير متوازن: المدين ${debit.toFixed(2)} والدائن ${credit.toFixed(2)}`);
  return {lines:clean,totalDebit:+debit.toFixed(2),totalCredit:+credit.toFixed(2)};
}

async function postAccountingEntry({date=today(),source='',description='',lines=[],module='',allowDuplicate=false,currency='SAR',exchangeRate=1}={}){
  await ensureAccountingAccounts();
  const check=validateJournalLines(lines);
  const journal=await all('journal');
  if(source && !allowDuplicate && journal.some(j=>j.source===source && j.engine==='unified')){
    return journal.find(j=>j.source===source && j.engine==='unified');
  }
  const entry={
    code:'JV-'+Date.now()+'-'+Math.floor(Math.random()*1000),
    date,source,description,
    lines:check.lines,totalDebit:check.totalDebit,totalCredit:check.totalCredit,
    module,currency,exchangeRate:Math.max(0.000001,num(exchangeRate)||1),status:'مرحل',engine:'unified',engineVersion:ACCOUNTING_ENGINE_VERSION,
    createdAt:new Date().toISOString()
  };
  await add('journal',entry);
  if(typeof logAudit==='function') await logAudit('ترحيل قيد محاسبي موحد',`${source||entry.code} | ${description} | مدين=${entry.totalDebit} دائن=${entry.totalCredit}`);
  return entry;
}

async function calculateInvoiceCost(lines){
  const items=await all('items');
  return (lines||[]).reduce((sum,l)=>{
    const it=items.find(x=>x.id===num(l.itemId));
    return sum + num(l.qty)*num(it?.cost);
  },0);
}

async function postJournalForInvoice(inv,isSale){
  await ensureAccountingAccounts();
  const cash=isSale ? (inv.payment==='بنك'?ACCOUNT_CODES.BANK:ACCOUNT_CODES.CASH) : (inv.payment==='بنك'?ACCOUNT_CODES.BANK:ACCOUNT_CODES.CASH);
  const cashId=await accountIdByCode(cash);
  const arId=await accountIdByCode(ACCOUNT_CODES.AR);
  const apId=await accountIdByCode(ACCOUNT_CODES.AP);
  const salesId=await accountIdByCode(ACCOUNT_CODES.SALES);
  const inventoryId=await accountIdByCode(ACCOUNT_CODES.INVENTORY);
  const cogsId=await accountIdByCode(ACCOUNT_CODES.COGS);
  const taxPayableId=await accountIdByCode(ACCOUNT_CODES.TAX_PAYABLE);
  const taxReceivableId=await accountIdByCode(ACCOUNT_CODES.TAX_RECEIVABLE);
  const discountId=await accountIdByCode(ACCOUNT_CODES.DISCOUNTS);

  if(isSale){
    const revenue=num(inv.subtotal)-num(inv.discount);
    const lines=[
      {accountId:cashId,debit:num(inv.paid),credit:0},
      {accountId:arId,debit:num(inv.remaining),credit:0},
      {accountId:salesId,debit:0,credit:revenue},
    ];
    if(num(inv.tax)>0) lines.push({accountId:taxPayableId,debit:0,credit:num(inv.tax)});
    if(num(inv.discount)>0) lines.push({accountId:discountId,debit:num(inv.discount),credit:0});
    await postAccountingEntry({
      date:inv.date,source:inv.code,description:'ترحيل فاتورة مبيعات',
      lines,module:'SALES',currency:inv.currency||'SAR',exchangeRate:num(inv.exchangeRate)||1
    });

    const cost=await calculateInvoiceCost(inv.lines);
    if(cost>0){
      await postAccountingEntry({
        date:inv.date,source:inv.code+'-COGS',description:'إثبات تكلفة البضاعة المباعة',currency:inv.currency||'SAR',exchangeRate:num(inv.exchangeRate)||1,
        lines:[
          {accountId:cogsId,debit:cost,credit:0},
          {accountId:inventoryId,debit:0,credit:cost}
        ],module:'INVENTORY'
      });
    }
  }else{
    const net=num(inv.subtotal)-num(inv.discount);
    const lines=[
      {accountId:inventoryId,debit:net,credit:0},
      {accountId:cashId,debit:0,credit:num(inv.paid)},
      {accountId:apId,debit:0,credit:num(inv.remaining)}
    ];
    if(num(inv.tax)>0) lines.push({accountId:taxReceivableId,debit:num(inv.tax),credit:0});
    if(num(inv.discount)>0){
      // الخصم يخفض تكلفة الشراء بالفعل عبر صافي المخزون
    }
    await postAccountingEntry({
      date:inv.date,source:inv.code,description:'ترحيل فاتورة مشتريات',
      lines,module:'PURCHASES',currency:inv.currency||'SAR',exchangeRate:num(inv.exchangeRate)||1
    });
  }
}

async function postPartyPaymentJournal({date,source,type,amount,payment='نقدي',description=''}) {
  await ensureAccountingAccounts();
  const cashId=await accountIdByCode(payment==='بنك'?ACCOUNT_CODES.BANK:ACCOUNT_CODES.CASH);
  const partyId=await accountIdByCode(type==='customer'?ACCOUNT_CODES.AR:ACCOUNT_CODES.AP);
  const lines=type==='customer'
    ? [{accountId:cashId,debit:amount,credit:0},{accountId:partyId,debit:0,credit:amount}]
    : [{accountId:partyId,debit:amount,credit:0},{accountId:cashId,debit:0,credit:amount}];
  return postAccountingEntry({date,source,description:description||(type==='customer'?'تحصيل من عميل':'سداد لمورد'),lines,module:'TREASURY'});
}

async function postInventoryAdjustmentJournal({date,source,itemId,diff,unitCost,description='تسوية مخزون'}){
  if(!diff) return;
  await ensureAccountingAccounts();
  const inventoryId=await accountIdByCode(ACCOUNT_CODES.INVENTORY);
  const adjustmentId=await accountIdByCode(ACCOUNT_CODES.INVENTORY_ADJUSTMENT);
  const value=Math.abs(num(diff)*num(unitCost));
  if(value<=0) return;
  const increase=diff>0;
  return postAccountingEntry({
    date,source,description,
    lines:increase
      ? [{accountId:inventoryId,debit:value,credit:0},{accountId:adjustmentId,debit:0,credit:value}]
      : [{accountId:adjustmentId,debit:value,credit:0},{accountId:inventoryId,debit:0,credit:value}],
    module:'INVENTORY'
  });
}

/* تصحيح التحصيلات ومدفوعات الموردين */
async function savePartyPayment(e,store,type){
  e.preventDefault();
  try{
    const partyStore=type==='customer'?'customers':'suppliers';
    const p=await get(partyStore,ppParty.value),amount=num(ppAmount.value);
    if(!p||amount<=0) throw new Error('تحقق من الطرف والمبلغ');
    if(type==='customer'){
      if(amount>num(p.balance)+0.009) throw new Error('مبلغ التحصيل أكبر من رصيد العميل');
      p.balance-=amount;
    }else{
      if(amount>num(p.balance)+0.009) throw new Error('مبلغ السداد أكبر من رصيد المورد');
      p.balance-=amount;
    }
    await put(partyStore,p);
    const code=(type==='customer'?'RCV-':'PAY-')+Date.now();
    await add(store,{date:ppDate.value,partyId:p.id,amount,payment:ppPay.value,code,status:'مرحل'});
    await postPartyPaymentJournal({date:ppDate.value,source:code,type,amount,payment:ppPay.value});
    toast('تم تسجيل وترحيل العملية محاسبيًا');
    loadPage(type==='customer'?'salesPayments':'purchasePayments');
  }catch(err){toast(err.message,'error')}
}

function invKey(itemId,warehouseId){return Number(itemId)+'-'+Number(warehouseId)}
async function ensureInventoryBalances(){
  const items=await all('items'), balances=await all('inventoryBalances');
  for(const it of items){
    const exists=balances.some(b=>Number(b.itemId)===Number(it.id)&&Number(b.warehouseId)===Number(it.warehouseId));
    if(!exists) await add('inventoryBalances',{itemId:it.id,warehouseId:Number(it.warehouseId)||1,qty:num(it.qty),reservedQty:0,minQty:num(it.minQty||5),updatedAt:new Date().toISOString()});
  }
}
async function getBalance(itemId,warehouseId){
  const bs=await all('inventoryBalances');
  return bs.find(b=>Number(b.itemId)===Number(itemId)&&Number(b.warehouseId)===Number(warehouseId))||null;
}
async function setBalance(itemId,warehouseId,qty){
  let b=await getBalance(itemId,warehouseId);
  if(!b) b={itemId:Number(itemId),warehouseId:Number(warehouseId),qty:0,reservedQty:0,minQty:5,updatedAt:''};
  b.qty=num(qty); b.updatedAt=new Date().toISOString();
  if(b.id) await put('inventoryBalances',b); else await add('inventoryBalances',b);
  return b;
}
async function moveInventory(itemId,warehouseId,delta,meta={}){
  const b=await getBalance(itemId,warehouseId), current=num(b?.qty);
  const next=current+num(delta);
  if(next<-0.0001) throw new Error('رصيد الصنف غير كافٍ في المخزن المحدد');
  await setBalance(itemId,warehouseId,Math.max(0,next));
  const it=await get('items',itemId);
  if(it && Number(it.warehouseId)===Number(warehouseId)){it.qty=Math.max(0,next);await put('items',it)}
  await add('stockMoves',{date:meta.date||today(),type:meta.type||'حركة مخزون',itemId:Number(itemId),warehouseId:Number(warehouseId),qty:num(delta),ref:meta.ref||('INV-'+Date.now()),fromWarehouseId:meta.fromWarehouseId||null,toWarehouseId:meta.toWarehouseId||null,note:meta.note||''});
}

saveInvoice=async function(e,kind){
  e.preventDefault();
  try{
    if(!window.invoiceLines.length)throw new Error('أضف صنفًا واحدًا على الأقل');
    const isSale=kind==='sale',store=isSale?'salesInvoices':'purchaseInvoices',partyStore=isSale?'customers':'suppliers';
    const partyId=num(fParty.value),date=fDate.value,payment=fPay.value,warehouseId=num(fWh.value);
    const sub=window.invoiceLines.reduce((a,x)=>a+num(x.qty)*num(x.price),0),discount=num(fDiscount.value),tax=num(fTax.value),total=Math.max(0,sub-discount+tax),paid=num(fPaid.value),remaining=Math.max(0,total-paid);
    for(const l of window.invoiceLines){if(isSale && await inventoryQty(l.itemId,warehouseId)<num(l.qty))throw new Error('المخزون غير كافٍ في المخزن المحدد')}
    const inv={code:(isSale?'SINV-':'PINV-')+Date.now(),date,partyId,warehouseId,payment,lines:window.invoiceLines.map(x=>({...x})),subtotal:sub,discount,tax,total,paid,remaining,currency:'SAR',status:'مرحل'};await add(store,inv);
    for(const l of inv.lines){await moveInventory(l.itemId,warehouseId,isSale?-num(l.qty):num(l.qty),{date,type:isSale?'بيع':'شراء',ref:inv.code});}
    const party=await get(partyStore,partyId);if(party){party.balance+=isSale?remaining:remaining;await put(partyStore,party)}
    await postJournalForInvoice(inv,isSale);closeModal();toast('تم حفظ وترحيل الفاتورة وربطها بالمخزن المحدد');loadPage(isSale?'salesInvoices':'purchases');
  }catch(err){toast(err.message,'error')}
};

async function closePOSShift(){
 try{const sh=await getActivePOSShift();if(!sh)return toast('لا توجد وردية مفتوحة','error');
 const sales=(await all('salesInvoices')).filter(x=>Number(x.posShiftId)===Number(sh.id)&&x.status==='مرحل');

<script>
/* =========================

const PHASE7_ACCOUNTING_VERSION='7.0';
function p7n(v){return Number(v)||0}
function p7fx(j){return Math.max(0.000001,p7n(j?.exchangeRate)||413)}
function p7MoneyPair(sar,rate){return `${money(sar)} SAR<br><small class="muted">${money(p7n(sar)*rate)} YER</small>`}
async function p7Audit(action,details=''){try{await add('auditLog',{date:new Date().toISOString(),action,details,user:(window.currentUser&&window.currentUser.username)||'admin',phase:7})}catch(e){console.warn(e)}}

async function renderAccounts_v7(){
 const accounts=await all('accounts');
 const rows=accounts.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code))).map(a=>{
  const hasChildren=accounts.some(x=>x.parentId===a.id); const used=(window.__p7JournalUsed||[]).includes(a.id);
  return `<tr><td>${esc(a.code||'')}</td><td>${esc(a.name||'')}</td><td>${esc(a.type||'')}</td><td>${a.parentId||'—'}</td><td>${hasChildren?'تجميعي':'حركة'}</td><td><button class="btn secondary" onclick="p7EditAccount(${a.id})">✏️ تعديل</button> <button class="btn danger" onclick="p7DeleteAccount(${a.id})">حذف</button></td></tr>`;
 }).join('');
 const journal=await all('journal');window.__p7JournalUsed=[...new Set(journal.flatMap(j=>(j.lines||[]).map(l=>l.accountId)))];
 document.getElementById('content').innerHTML=shell('دليل الحسابات — المرحلة السابعة',pageLayout(
 `<div class="card"><form onsubmit="p7SaveAccount(event)"><input type="hidden" id="p7AccId"><div class="form-grid"><div class="field"><label>رمز الحساب</label><input id="p7AccCode" required></div><div class="field wide"><label>اسم الحساب</label><input id="p7AccName" required></div><div class="field"><label>النوع</label><select id="p7AccType"><option>أصل</option><option>التزام</option><option>حقوق ملكية</option><option>إيراد</option><option>مصروف</option></select></div><div class="field"><label>الحساب الأب</label><select id="p7AccParent"><option value="">بدون أب</option>${accounts.map(a=>`<option value="${a.id}">${esc(a.code+' - '+a.name)}</option>`).join('')}</select></div></div><div class="actions" style="margin-top:8px"><button class="btn primary">💾 حفظ الحساب</button><button type="button" class="btn secondary" onclick="p7ResetAccount()">جديد</button></div></form></div>`,
 `<div class="table-wrap"><table><thead><tr><th>الرمز</th><th>الحساب</th><th>النوع</th><th>الأب</th><th>التصنيف</th><th>إجراءات</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">لا توجد حسابات</td></tr>'}</tbody></table></div>`));
}
function p7ResetAccount(){p7AccId.value='';p7AccCode.value='';p7AccName.value='';p7AccParent.value=''}
async function p7SaveAccount(e){e.preventDefault();const id=p7n(p7AccId.value);const rec={code:p7AccCode.value.trim(),name:p7AccName.value.trim(),type:p7AccType.value,parentId:p7AccParent.value?p7n(p7AccParent.value):null};if(!rec.code||!rec.name)return;const dup=(await all('accounts')).find(a=>a.code===rec.code&&a.id!==id);if(dup)return toast('رمز الحساب مستخدم بالفعل','error');if(id){rec.id=id;await put('accounts',rec);await p7Audit('تعديل حساب',rec.code+' - '+rec.name)}else{await add('accounts',rec);await p7Audit('إضافة حساب',rec.code+' - '+rec.name)}toast('تم حفظ الحساب');renderAccounts_v7()}
async function p7EditAccount(id){const a=await get('accounts',id);if(!a)return;p7AccId.value=a.id;p7AccCode.value=a.code||'';p7AccName.value=a.name||'';p7AccType.value=a.type||'أصل';p7AccParent.value=a.parentId||'';window.scrollTo?.(0,0)}
async function p7DeleteAccount(id){const accounts=await all('accounts'), journal=await all('journal');if(accounts.some(a=>a.parentId===id))return toast('لا يمكن حذف حساب لديه حسابات فرعية','error');if(journal.some(j=>(j.lines||[]).some(l=>l.accountId===id)))return toast('لا يمكن حذف حساب مرتبط بقيود','error');if(confirm('حذف الحساب؟')){await remove('accounts',id);await p7Audit('حذف حساب',String(id));renderAccounts_v7()}}

let p7Lines=[];
async function renderJournal_v7(){const accounts=await all('accounts');const journals=(await all('journal')).slice().reverse();if(!p7Lines.length&&accounts.length>=2)p7Lines=[{accountId:accounts[0].id,debit:'',credit:''},{accountId:accounts[1].id,debit:'',credit:''}];
 const rows=journals.map(j=>`<tr><td>${esc(j.code||'')}</td><td>${esc(j.date||'')}</td><td>${esc(j.status||'مرحل')}</td><td>${esc(j.source||'يدوي')}</td><td>${esc(j.description||'')}</td><td>${p7MoneyPair(j.totalDebit||0,p7fx(j))}</td><td>${p7MoneyPair(j.totalCredit||0,p7fx(j))}</td><td><button class="btn secondary" onclick="p7ViewJournal(${j.id})">عرض</button></td></tr>`).join('');
 document.getElementById('content').innerHTML=shell('القيود اليومية — المرحلة السابعة',pageLayout(
 `<div class="card"><form onsubmit="p7PostJournal(event)"><div class="form-grid"><div class="field"><label>التاريخ</label><input id="p7JDate" type="date" value="${today()}" required></div><div class="field wide"><label>البيان</label><input id="p7JDesc" required placeholder="وصف العملية"></div><div class="field"><label>سعر صرف YER لكل SAR</label><input id="p7JRate" type="number" min=".000001" step=".000001" value="413"></div></div><div id="p7JournalLines" style="margin-top:8px"></div><div class="acc-toolbar"><button type="button" class="btn secondary" onclick="p7AddLine()">➕ إضافة سطر</button><button class="btn primary">📌 ترحيل القيد</button></div><div id="p7JournalTotals" class="acc-kpis"></div></form></div>`,
 `<div class="table-wrap"><table><thead><tr><th>رقم</th><th>التاريخ</th><th>الحالة</th><th>المصدر</th><th>البيان</th><th>مدين SAR/YER</th><th>دائن SAR/YER</th><th>تفاصيل</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">لا توجد قيود</td></tr>'}</tbody></table></div>`));p7RenderLines(accounts)}
function p7RenderLines(accounts){const el=document.getElementById('p7JournalLines');if(!el)return;el.innerHTML=p7Lines.map((l,i)=>`<div class="jline"><div class="field"><label>الحساب</label><select onchange="p7Lines[${i}].accountId=Number(this.value)">${accounts.map(a=>`<option value="${a.id}" ${a.id===l.accountId?'selected':''}>${esc(a.code+' - '+a.name)}</option>`).join('')}</select></div><div class="field"><label>مدين SAR</label><input type="number" step=".01" min="0" value="${l.debit||''}" oninput="p7Lines[${i}].debit=this.value;p7UpdateTotals()"></div><div class="field"><label>دائن SAR</label><input type="number" step=".01" min="0" value="${l.credit||''}" oninput="p7Lines[${i}].credit=this.value;p7UpdateTotals()"></div><button type="button" class="btn danger" onclick="p7Lines.splice(${i},1);renderJournal_v7()">×</button></div>`).join('');p7UpdateTotals()}
async function p7AddLine(){const a=await all('accounts');p7Lines.push({accountId:a[0]?.id,debit:'',credit:''});p7RenderLines(a)}
function p7UpdateTotals(){const d=p7Lines.reduce((s,l)=>s+p7n(l.debit),0),c=p7Lines.reduce((s,l)=>s+p7n(l.credit),0),rate=p7n(document.getElementById('p7JRate')?.value)||413;const el=document.getElementById('p7JournalTotals');if(el)el.innerHTML=`<div class="acc-kpi"><small>إجمالي المدين</small><b>${money(d)} SAR<br><small>${money(d*rate)} YER</small></b></div><div class="acc-kpi"><small>إجمالي الدائن</small><b>${money(c)} SAR<br><small>${money(c*rate)} YER</small></b></div><div class="acc-kpi"><small>حالة التوازن</small><b>${Math.abs(d-c)<0.005?'✅ متوازن':'❌ غير متوازن'}</b></div>`}
async function p7PostJournal(e){e.preventDefault();const lines=p7Lines.map(l=>({accountId:p7n(l.accountId),debit:p7n(l.debit),credit:p7n(l.credit)})).filter(l=>l.accountId&&(l.debit||l.credit));const d=lines.reduce((s,l)=>s+l.debit,0),c=lines.reduce((s,l)=>s+l.credit,0);if(lines.length<2)return toast('أدخل سطرين على الأقل','error');if(lines.some(l=>l.debit>0&&l.credit>0))return toast('لا يمكن أن يكون السطر مدينًا ودائنًا معًا','error');if(Math.abs(d-c)>=0.005)return toast('القيد غير متوازن ولا يمكن ترحيله','error');const rate=p7n(p7JRate.value)||413;const rec={code:'JV-'+Date.now(),date:p7JDate.value,source:'يدوي',description:p7JDesc.value,lines:lines.map(l=>({...l,foreignDebit:l.debit*rate,foreignCredit:l.credit*rate})),totalDebit:d,totalCredit:c,currency:'SAR',baseCurrency:'SAR',exchangeRate:rate,status:'مرحل',postedAt:new Date().toISOString()};await add('journal',rec);await p7Audit('ترحيل قيد يومية',rec.code+' | '+rec.description);p7Lines=[];toast('تم ترحيل القيد المتوازن');renderJournal_v7()}
async function p7ViewJournal(id){const j=await get('journal',id),a=await all('accounts');if(!j)return;const rate=p7fx(j);const lines=(j.lines||[]).map(l=>{const ac=a.find(x=>x.id===l.accountId);return `<tr><td>${esc(ac?.code||'')}</td><td>${esc(ac?.name||'')}</td><td>${p7MoneyPair(l.debit,rate)}</td><td>${p7MoneyPair(l.credit,rate)}</td></tr>`}).join('');document.getElementById('content').innerHTML=shell('تفاصيل القيد '+esc(j.code),`<div class="card"><div class="stat"><span>التاريخ</span><b>${esc(j.date)}</b></div><div class="stat"><span>البيان</span><b>${esc(j.description||'')}</b></div><div class="stat"><span>سعر الصرف</span><b>1 SAR = ${rate} YER</b></div></div><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>الرمز</th><th>الحساب</th><th>مدين SAR / YER</th><th>دائن SAR / YER</th></tr></thead><tbody>${lines}</tbody></table></div><div class="actions" style="margin-top:8px"><button class="btn secondary" onclick="loadPage('journal')">رجوع</button></div>`)}

async function renderLedger_v7(){const accounts=await all('accounts'),journal=await all('journal');const used=accounts.filter(a=>journal.some(j=>(j.lines||[]).some(l=>l.accountId===a.id)));document.getElementById('content').innerHTML=shell('دفتر الأستاذ العام — متعدد العملات',`<div class="card"><div class="field"><label>اختر الحساب</label><select id="p7LedgerAcc" onchange="p7ShowLedger()"><option value="">اختر حسابًا</option>${used.map(a=>`<option value="${a.id}">${esc(a.code+' - '+a.name)}</option>`).join('')}</select></div></div><div id="p7LedgerResult" style="margin-top:8px"><div class="empty">اختر حسابًا لعرض حركاته</div></div>`)}
async function p7ShowLedger(){const id=p7n(p7LedgerAcc.value),res=document.getElementById('p7LedgerResult');if(!id)return;const a=await get('accounts',id),j=(await all('journal')).filter(x=>x.status!=='مسودة').sort((x,y)=>String(x.date).localeCompare(String(y.date)));let bal=0;const rows=j.flatMap(x=>(x.lines||[]).filter(l=>l.accountId===id).map(l=>{const d=p7n(l.debit),c=p7n(l.credit),rate=p7fx(x);bal+=d-c;return `<tr><td>${esc(x.date)}</td><td>${esc(x.code)}</td><td>${esc(x.description||'')}</td><td>${p7MoneyPair(d,rate)}</td><td>${p7MoneyPair(c,rate)}</td><td>${p7MoneyPair(bal,rate)}</td></tr>`}));res.innerHTML=`<div class="card"><b>${esc(a.code+' - '+a.name)}</b></div><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>التاريخ</th><th>القيد</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="6" class="empty">لا توجد حركات</td></tr>'}</tbody></table></div>`}

async function renderTrial_v7(){const accounts=await all('accounts'),journal=(await all('journal')).filter(j=>j.status!=='مسودة');const sums={};journal.forEach(j=>(j.lines||[]).forEach(l=>{const s=sums[l.accountId]||(sums[l.accountId]={d:0,c:0});s.d+=p7n(l.debit);s.c+=p7n(l.credit)}));let td=0,tc=0;const rows=accounts.map(a=>{const s=sums[a.id]||{d:0,c:0};td+=s.d;tc+=s.c;return `<tr><td>${esc(a.code||'')}</td><td>${esc(a.name||'')}</td><td>${money(s.d)} SAR<br><small>${money(s.d*413)} YER*</small></td><td>${money(s.c)} SAR<br><small>${money(s.c*413)} YER*</small></td><td>${money(Math.max(0,s.d-s.c))}</td><td>${money(Math.max(0,s.c-s.d))}</td></tr>`}).join('');document.getElementById('content').innerHTML=shell('ميزان المراجعة — المرحلة السابعة',`<div class="acc-kpis"><div class="acc-kpi"><small>إجمالي المدين</small><b>${money(td)} SAR</b></div><div class="acc-kpi"><small>إجمالي الدائن</small><b>${money(tc)} SAR</b></div><div class="acc-kpi"><small>الحالة</small><b>${Math.abs(td-tc)<0.005?'✅ متوازن':'❌ غير متوازن'}</b></div></div><div class="table-wrap"><table><thead><tr><th>الرمز</th><th>الحساب</th><th>مدين</th><th>دائن</th><th>رصيد مدين</th><th>رصيد دائن</th></tr></thead><tbody>${rows}</tbody></table></div><small class="muted">* عرض YER المقابل في الميزان يتم بسعر العرض الحالي 413؛ أما تفاصيل كل حركة فتستخدم سعر الصرف المثبت معها.</small>`)}

/* توحيد مسارات المرحلة السابعة في آخر تعريف فعلي للمسارات */
const __phase7LoadPage=window.loadPage;
window.loadPage=async function(page){
 if(page==='accounts')return renderAccounts_v7();
 if(page==='journal')return renderJournal_v7();
 if(page==='ledger')return renderLedger_v7();

window.renderAccounts=renderAccounts_v7;window.renderJournal=renderJournal_v7;window.renderLedger=renderLedger_v7;window.renderTrial=renderTrial_v7;
window.__SHEIBANI_PHASE7_ACCOUNTING__=true;

<script>
/* =========================
   المرحلة الثامنة — المخزون والمشتريات التنفيذي
   IndexedDB فقط — لا Backend ولا SQL Server
========================= */
const PHASE8_INVENTORY_VERSION='8.0';
function p8n(v){return Number(v)||0}
async function p8Audit(action,details=''){try{await add('auditLog',{date:new Date().toISOString(),action,details,user:(window.currentUser&&window.currentUser.username)||'admin',phase:8})}catch(e){console.warn(e)}}
async function p8Balance(itemId,warehouseId){const rows=await all('inventoryBalances');const r=rows.find(x=>p8n(x.itemId)===p8n(itemId)&&p8n(x.warehouseId)===p8n(warehouseId));if(r)return p8n(r.qty);const it=await get('items',itemId);return p8n(it?.warehouseId)===p8n(warehouseId)?p8n(it?.qty):0}
async function p8SetBalance(itemId,warehouseId,qty){const rows=await all('inventoryBalances');const r=rows.find(x=>p8n(x.itemId)===p8n(itemId)&&p8n(x.warehouseId)===p8n(warehouseId));if(r){r.qty=p8n(qty);r.updatedAt=new Date().toISOString();await put('inventoryBalances',r)}else await add('inventoryBalances',{itemId:p8n(itemId),warehouseId:p8n(warehouseId),qty:p8n(qty),updatedAt:new Date().toISOString()})}
async function p8Move(itemId,warehouseId,qty,type,ref='',note=''){const before=await p8Balance(itemId,warehouseId),after=before+p8n(qty);if(after<0)throw new Error('لا يمكن أن يصبح رصيد المخزون سالبًا');await p8SetBalance(itemId,warehouseId,after);await add('stockMoves',{date:new Date().toISOString(),itemId:p8n(itemId),warehouseId:p8n(warehouseId),type,qty:p8n(qty),beforeQty:before,afterQty:after,reference:ref,note});return {before,after}}
async function renderInventory_v8(){const [items,warehouses,moves]=await Promise.all([all('items'),all('warehouses'),all('stockMoves')]);const low=[];for(const it of items){let total=0;for(const w of warehouses)total+=await p8Balance(it.id,w.id);if(total<=p8n(it.minQty||0))low.push({it,total})}
const rows=[];for(const it of items){let total=0;for(const w of warehouses)total+=await p8Balance(it.id,w.id);rows.push(`<tr><td>${esc(it.code||'')}</td><td>${esc(it.name||'')}</td><td>${esc(it.barcode||'—')}</td><td>${money(total)}</td><td>${money(p8n(it.cost))} SAR</td><td><button class="btn secondary" onclick="p8ItemCard(${it.id})">بطاقة</button></td></tr>`)}
document.getElementById('content').innerHTML=shell('📦 المخزون متعدد المخازن — المرحلة الثامنة',`<div class="p8-grid"><div class="p8-card"><small>عدد الأصناف</small><b>${items.length}</b></div><div class="p8-card"><small>المخازن</small><b>${warehouses.length}</b></div><div class="p8-card"><small>حركات المخزون</small><b>${moves.length}</b></div><div class="p8-card"><small>منخفضة المخزون</small><b>${low.length}</b></div></div><div class="p8-toolbar" style="margin-top:8px"><button class="btn primary" onclick="renderPurchase_v8()">🛒 المشتريات</button><button class="btn secondary" onclick="renderTransfers_v8()">🔄 تحويل مخزني</button><button class="btn secondary" onclick="renderStockCount_v8()">📋 الجرد والتسوية</button><button class="btn secondary" onclick="renderStockReport_v8()">📊 تقارير المخزون</button></div><div class="table-wrap p8-scroll"><table><thead><tr><th>الكود</th><th>الصنف</th><th>الباركود</th><th>الرصيد الكلي</th><th>التكلفة</th><th>تفاصيل</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="6" class="empty">لا توجد أصناف</td></tr>'}</tbody></table></div>`)}
async function p8ItemCard(id){const [it,ws,moves]=await Promise.all([get('items',id),all('warehouses'),all('stockMoves')]);let balances='';for(const w of ws)balances+=`<tr><td>${esc(w.name)}</td><td>${money(await p8Balance(id,w.id))}</td></tr>`;const mr=moves.filter(m=>p8n(m.itemId)===p8n(id)).slice().reverse().map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.type)}</td><td>${money(m.qty)}</td><td>${money(m.beforeQty)}</td><td>${money(m.afterQty)}</td><td>${esc(m.reference||'')}</td></tr>`).join('');document.getElementById('content').innerHTML=shell('بطاقة الصنف',`<div class="card"><b>${esc(it.name)}</b><div class="form-grid" style="margin-top:8px"><div class="field"><label>الباركود</label><input value="${esc(it.barcode||'')}" disabled></div><div class="field"><label>سعر البيع</label><input value="${p8n(it.price)} SAR" disabled></div><div class="field"><label>التكلفة</label><input value="${p8n(it.cost)} SAR" disabled></div></div></div><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>المخزن</th><th>الرصيد</th></tr></thead><tbody>${balances}</tbody></table></div><div class="table-wrap p8-scroll" style="margin-top:8px"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الحركة</th><th>قبل</th><th>بعد</th><th>مرجع</th></tr></thead><tbody>${mr||'<tr><td colspan="6" class="empty">لا توجد حركات</td></tr>'}</tbody></table></div><div class="actions" style="margin-top:8px"><button class="btn secondary" onclick="renderInventory_v8()">رجوع</button></div>`)}

let p8PurchaseLines=[];
async function renderPurchase_v8(){const [items,suppliers,warehouses,invoices]=await Promise.all([all('items'),all('suppliers'),all('warehouses'),all('purchaseInvoices')]);document.getElementById('content').innerHTML=shell('🛒 دورة المشتريات — المرحلة الثامنة',`<div class="card"><div class="form-grid"><div class="field"><label>المورد</label><select id="p8Sup">${suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>المخزن المستلم</label><select id="p8PurWh">${warehouses.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>طريقة الدفع</label><select id="p8Pay"><option>نقدي</option><option>بنك</option><option>آجل</option></select></div></div><div class="p8-toolbar" style="margin-top:8px"><button class="btn secondary" onclick="p8AddPurchaseLine()">➕ إضافة صنف</button><button class="btn primary" onclick="p8PostPurchase()">📌 ترحيل فاتورة الشراء</button></div><div id="p8PurchaseLines"></div></div><div class="table-wrap p8-scroll"><table><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>المورد</th><th>الإجمالي</th><th>الدفع</th></tr></thead><tbody>${invoices.slice().reverse().map(x=>`<tr><td>${esc(x.code||'')}</td><td>${esc(x.date||'')}</td><td>${esc(x.supplierName||'')}</td><td>${money(x.total||0)} SAR</td><td>${esc(x.paymentMethod||'')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد فواتير شراء</td></tr>'}</tbody></table></div>`);p8PurchaseLines=[];p8AddPurchaseLine()}
async function p8AddPurchaseLine(){const items=await all('items');p8PurchaseLines.push({itemId:items[0]?.id||0,qty:1,cost:p8n(items[0]?.cost)});p8RenderPurchaseLines(items)}
function p8RenderPurchaseLines(items){const el=document.getElementById('p8PurchaseLines');if(!el)return;el.innerHTML=p8PurchaseLines.map((l,i)=>`<div class="jline"><div class="field"><label>الصنف</label><select onchange="p8PurchaseLines[${i}].itemId=Number(this.value);const x=__p8Items.find(z=>z.id===Number(this.value));if(x)p8PurchaseLines[${i}].cost=Number(x.cost)||0;p8RenderPurchaseLines(__p8Items)">${items.map(x=>`<option value="${x.id}" ${x.id===l.itemId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>الكمية</label><input type="number" min=".001" step=".001" value="${l.qty}" oninput="p8PurchaseLines[${i}].qty=this.value;p8PurchaseLines[${i}].qty=Number(p8PurchaseLines[${i}].qty)||0;p8PurchaseTotal()"></div><div class="field"><label>التكلفة SAR</label><input type="number" min="0" step=".01" value="${l.cost}" oninput="p8PurchaseLines[${i}].cost=Number(this.value)||0;p8PurchaseTotal()"></div><button class="btn danger" onclick="p8PurchaseLines.splice(${i},1);p8RenderPurchaseLines(__p8Items)">×</button></div>`).join('')+'<div id="p8PurTotal" class="p8-card"></div>';window.__p8Items=items;p8PurchaseTotal()}
function p8PurchaseTotal(){const t=p8PurchaseLines.reduce((s,l)=>s+p8n(l.qty)*p8n(l.cost),0);const e=document.getElementById('p8PurTotal');if(e)e.innerHTML=`<small>إجمالي الفاتورة</small><b>${money(t)} SAR</b>`}
async function p8PostPurchase(){const lines=p8PurchaseLines.filter(l=>l.itemId&&p8n(l.qty)>0).map(l=>({...l,qty:p8n(l.qty),cost:p8n(l.cost)}));if(!lines.length)return toast('أضف صنفًا واحدًا على الأقل','error');const wh=p8n(p8PurWh.value),sup=p8n(p8Sup.value),supplier=(await get('suppliers',sup));const total=lines.reduce((s,l)=>s+l.qty*l.cost,0),code='PUR-'+Date.now();for(const l of lines){const it=await get('items',l.itemId);await p8Move(l.itemId,wh,l.qty,'شراء',code,'استلام من المورد');if(it){it.cost=l.cost;await put('items',it)}}const inv={code,date:today(),supplierId:sup,supplierName:supplier?.name||'',warehouseId:wh,lines,total,paymentMethod:p8Pay.value,status:'مرحل',currency:'SAR',exchangeRate:Number(localStorage.getItem('sheibani_pos_sar_yer_rate')||413),createdAt:new Date().toISOString()};await add('purchaseInvoices',inv);await p8Audit('ترحيل فاتورة شراء',code);toast('تم ترحيل فاتورة الشراء وتحديث المخزون');renderPurchase_v8()}

let p8TransferLines=[];
async function renderTransfers_v8(){const [items,ws,transfers]=await Promise.all([all('items'),all('warehouses'),all('stockTransfers')]);document.getElementById('content').innerHTML=shell('🔄 التحويل بين المخازن',`<div class="card"><div class="form-grid"><div class="field"><label>من مخزن</label><select id="p8From">${ws.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>إلى مخزن</label><select id="p8To">${ws.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div></div><div class="p8-toolbar" style="margin-top:8px"><button class="btn secondary" onclick="p8AddTransferLine()">➕ إضافة صنف</button><button class="btn primary" onclick="p8PostTransfer()">🔄 تنفيذ التحويل</button></div><div id="p8TransferLines"></div></div><div class="table-wrap p8-scroll"><table><thead><tr><th>الرقم</th><th>التاريخ</th><th>من</th><th>إلى</th><th>الحالة</th></tr></thead><tbody>${transfers.slice().reverse().map(t=>`<tr><td>${esc(t.code)}</td><td>${esc(t.date)}</td><td>${esc(t.fromName)}</td><td>${esc(t.toName)}</td><td>${esc(t.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد تحويلات</td></tr>'}</tbody></table></div>`);p8TransferLines=[];p8AddTransferLine()}
async function p8AddTransferLine(){const items=await all('items');p8TransferLines.push({itemId:items[0]?.id||0,qty:1});p8RenderTransferLines(items)}
function p8RenderTransferLines(items){const e=document.getElementById('p8TransferLines');if(!e)return;e.innerHTML=p8TransferLines.map((l,i)=>`<div class="jline"><div class="field"><label>الصنف</label><select onchange="p8TransferLines[${i}].itemId=Number(this.value)">${items.map(x=>`<option value="${x.id}" ${x.id===l.itemId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>الكمية</label><input type="number" min=".001" step=".001" value="${l.qty}" oninput="p8TransferLines[${i}].qty=Number(this.value)||0"></div><button class="btn danger" onclick="p8TransferLines.splice(${i},1);p8RenderTransferLines(__p8TransferItems)">×</button></div>`).join('');window.__p8TransferItems=items}
async function p8PostTransfer(){const from=p8n(p8From.value),to=p8n(p8To.value);if(from===to)return toast('اختر مخزنين مختلفين','error');const lines=p8TransferLines.filter(l=>l.itemId&&p8n(l.qty)>0);if(!lines.length)return toast('أضف أصنافًا للتحويل','error');for(const l of lines)if(await p8Balance(l.itemId,from)<p8n(l.qty))return toast('المخزون غير كافٍ للتحويل','error');const ws=await all('warehouses'),code='TRF-'+Date.now();for(const l of lines){await p8Move(l.itemId,from,-p8n(l.qty),'تحويل صادر',code);await p8Move(l.itemId,to,p8n(l.qty),'تحويل وارد',code)}await add('stockTransfers',{code,date:today(),fromWarehouseId:from,toWarehouseId:to,fromName:ws.find(w=>w.id===from)?.name||'',toName:ws.find(w=>w.id===to)?.name||'',lines,status:'مكتمل'});await p8Audit('تحويل مخزني',code);toast('تم التحويل وتحديث أرصدة المخازن');renderTransfers_v8()}
async function renderStockCount_v8(){const [items,ws]=await Promise.all([all('items'),all('warehouses')]);document.getElementById('content').innerHTML=shell('📋 الجرد والتسويات',`<div class="card"><div class="field"><label>المخزن</label><select id="p8CountWh" onchange="p8LoadCountRows()">${ws.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div id="p8CountRows" class="table-wrap p8-scroll" style="margin-top:8px"></div><div class="actions" style="margin-top:8px"><button class="btn primary" onclick="p8PostCount()">📌 ترحيل التسوية</button></div></div>`);window.__p8CountItems=items;p8LoadCountRows()}
async function p8LoadCountRows(){const wh=p8n(p8CountWh.value),items=window.__p8CountItems||await all('items');const rows=[];for(const it of items){const q=await p8Balance(it.id,wh);rows.push(`<tr data-id="${it.id}" data-book="${q}"><td>${esc(it.name)}</td><td>${money(q)}</td><td><input class="p8Actual" type="number" step=".001" min="0" value="${q}"></td><td class="p8Diff">0</td></tr>`)}const e=document.getElementById('p8CountRows');if(e)e.innerHTML=`<table><thead><tr><th>الصنف</th><th>الدفتري</th><th>الفعلي</th><th>الفرق</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;document.querySelectorAll('.p8Actual').forEach(x=>x.oninput=()=>{const tr=x.closest('tr');tr.querySelector('.p8Diff').textContent=money(p8n(x.value)-p8n(tr.dataset.book))})}
async function p8PostCount(){const wh=p8n(p8CountWh.value),trs=[...document.querySelectorAll('#p8CountRows tbody tr')],code='ADJ-'+Date.now();let changed=0;for(const tr of trs){const id=p8n(tr.dataset.id),book=p8n(tr.dataset.book),actual=p8n(tr.querySelector('.p8Actual').value),diff=actual-book;if(Math.abs(diff)>0.000001){await p8Move(id,wh,diff,'تسوية جرد',code,'تسوية فرق الجرد');changed++}}await p8Audit('تسوية جرد',code+' | '+changed+' أصناف');toast(changed?'تم ترحيل تسويات الجرد':'لا توجد فروقات');renderStockCount_v8()}
async function renderStockReport_v8(){const [items,ws,moves]=await Promise.all([all('items'),all('warehouses'),all('stockMoves')]);let rows=[];for(const it of items){let q=0;for(const w of ws)q+=await p8Balance(it.id,w.id);rows.push(`<tr><td>${esc(it.code||'')}</td><td>${esc(it.name)}</td><td>${money(q)}</td><td>${money(q*p8n(it.cost))} SAR</td></tr>`)}document.getElementById('content').innerHTML=shell('📊 تقارير المخزون',`<div class="p8-grid"><div class="p8-card"><small>إجمالي الأصناف</small><b>${items.length}</b></div><div class="p8-card"><small>إجمالي الحركات</small><b>${moves.length}</b></div></div><div class="table-wrap p8-scroll" style="margin-top:8px"><table><thead><tr><th>الكود</th><th>الصنف</th><th>الرصيد</th><th>التقييم</th></tr></thead><tbody>${rows.join('')}</tbody></table></div><div class="actions" style="margin-top:8px"><button class="btn secondary" onclick="renderInventory_v8()">رجوع للمخزون</button></div>`)}

const __phase8LoadPage=window.loadPage;
window.loadPage=async function(page){
 if(page==='inventory'||page==='items')return renderInventory_v8();
 if(page==='purchases'||page==='purchaseInvoices')return renderPurchase_v8();
 if(page==='stockTransfers')return renderTransfers_v8();
 if(page==='stockCount')return renderStockCount_v8();
 if(page==='stockReport')return renderStockReport_v8();
 return __phase8LoadPage(page);
};
window.renderInventory=renderInventory_v8;window.renderPurchase=renderPurchase_v8;window.renderTransfers=renderTransfers_v8;window.__SHEIBANI_PHASE8_INVENTORY__=true;
</script>
<style>
/* =========================================================
   المرحلة التاسعة — الخزينة والبنوك والعملاء والموردون
   إضافة تنفيذية فوق BASELINE المرحلة الثامنة
   ========================================================= */
.p9-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.p9-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px}.p9-card small{display:block;color:#64748b;font-size:10px}.p9-card b{display:block;font-size:18px;margin-top:4px}.p9-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.p9-toolbar .btn{min-width:135px;flex:1}.p9-note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:8px;color:#1e3a8a;font-size:10px}.p9-balance-positive{color:#059669;font-weight:900}.p9-balance-negative{color:#dc2626;font-weight:900}
@media(max-width:700px){.p9-grid{grid-template-columns:1fr 1fr}.p9-toolbar .btn{min-width:calc(50% - 6px)}}
</style>
<script>
/* ========================= المرحلة التاسعة ========================= */
const PHASE9_VERSION='9.0';
const P9_DEFAULT_RATE=413;
function p9n(v){return Number(v)||0}
function p9Rate(){return Math.max(.000001,p9n(localStorage.getItem('sheibani_pos_sar_yer_rate'))||P9_DEFAULT_RATE)}
function p9Currency(){return localStorage.getItem('sheibani_pos_currency')||'YER'}
function p9Foreign(base,currency,rate){return currency==='YER'?p9n(base)*p9n(rate):p9n(base)}
function p9Base(amount,currency,rate){return currency==='YER'?p9n(amount)/Math.max(.000001,p9n(rate)):p9n(amount)}
function p9Fmt(v,c='SAR'){return new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(p9n(v))+' '+c}
async function p9Audit(action,details=''){try{await add('auditLog',{date:new Date().toISOString(),action,details,user:(window.currentUser&&window.currentUser.username)||'admin',phase:9})}catch(e){console.warn(e)}}
async function p9EnsureAccount(code,name,type='أصل',parentId=null){let a=(await all('accounts')).find(x=>String(x.code)===String(code));if(a)return a.id;return add('accounts',{code,name,type,parentId})}
async function p9EnsureStructure(){
  const cash=await p9EnsureAccount('1100','الصندوق','أصل');
  const bank=await p9EnsureAccount('1200','البنك','أصل');
  await p9EnsureAccount('1110','الصناديق','أصل',cash);
  await p9EnsureAccount('1210','الحسابات البنكية','أصل',bank);
  await p9EnsureAccount('1300','العملاء','أصل');
  await p9EnsureAccount('2100','الموردون','التزام');
  const boxes=await all('cashBoxes');
  if(!boxes.length){const id=await p9EnsureAccount('1111','الصندوق الرئيسي','أصل',await p9EnsureAccount('1110','الصناديق','أصل',cash));await add('cashBoxes',{code:'CASH-001',name:'الصندوق الرئيسي',currency:'SAR',accountId:id,openingBalance:0,balance:0,status:'نشط',createdAt:new Date().toISOString()})}
  const banks=await all('bankAccounts');
  if(!banks.length){const id=await p9EnsureAccount('1211','البنك الرئيسي','أصل',await p9EnsureAccount('1210','الحسابات البنكية','أصل',bank));await add('bankAccounts',{code:'BANK-001',name:'الحساب البنكي الرئيسي',bankName:'',accountNumber:'',currency:'SAR',accountId:id,openingBalance:0,balance:0,status:'نشط',createdAt:new Date().toISOString()})}
}
async function p9AccountIdByCode(code){const a=(await all('accounts')).find(x=>String(x.code)===String(code));return a?.id||null}
async function p9Post({date,source,description,lines,currency='SAR',exchangeRate=1,module='TREASURY'}){return postAccountingEntry({date,source,description,lines,currency,exchangeRate,module})}
async function p9JournalForTwo(date,source,description,debitId,creditId,amount,currency,rate,module='TREASURY'){const base=p9Base(amount,currency,rate);return p9Post({date,source,description,currency,exchangeRate:rate,module,lines:[{accountId:debitId,debit:base,credit:0,foreignDebit:p9Foreign(base,currency,rate),foreignCredit:0},{accountId:creditId,debit:0,credit:base,foreignDebit:0,foreignCredit:p9Foreign(base,currency,rate)}]})}
async function p9RecalcBalances(){
  const trs=await all('treasuryTransactions'), boxes=await all('cashBoxes'), banks=await all('bankAccounts');
  for(const b of boxes){let v=p9n(b.openingBalance);for(const t of trs.filter(x=>x.assetType==='cash'&&p9n(x.assetId)===p9n(b.id))){v+=x.direction==='in'?p9n(x.baseAmount):-p9n(x.baseAmount)}b.balance=v;await put('cashBoxes',b)}
  for(const b of banks){let v=p9n(b.openingBalance);for(const t of trs.filter(x=>x.assetType==='bank'&&p9n(x.assetId)===p9n(b.id))){v+=x.direction==='in'?p9n(x.baseAmount):-p9n(x.baseAmount)}b.balance=v;await put('bankAccounts',b)}

async function p10DrawTrial(){const {from,to}=p10DateRange(),d=await p10Data(),before=p10JournalSums(d.journal,'',from?new Date(new Date(from).getTime()-86400000).toISOString().slice(0,10):''),period=p10JournalSums(d.journal,from,to);let td=0,tc=0;const rows=d.accounts.map(a=>{const o=before[a.id]||{debit:0,credit:0},p=period[a.id]||{debit:0,credit:0};const open=o.debit-o.credit,move=p.debit-p.credit,close=open+move;td+=p.debit;tc+=p.credit;return `<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${money(open)}</td><td>${money(p.debit)}</td><td>${money(p.credit)}</td><td>${money(close)}</td></tr>`}).join('');document.getElementById('p10Result').innerHTML=`<table><thead><tr><th>الكود</th><th>الحساب</th><th>افتتاحي</th><th>حركة مدين</th><th>حركة دائن</th><th>ختامي</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="3">الإجمالي</th><th>${money(td)}</th><th>${money(tc)}</th><th>${Math.abs(td-tc)<.005?'متوازن':'تحقق'}</th></tr></tfoot></table>`;await p10Audit('عرض ميزان مراجعة متقدم',`${from||'البداية'} إلى ${to||'النهاية'}`)}

async function p10DrawLedger(){const id=p10n(document.getElementById('p10Acc').value),{from,to}=p10DateRange();if(!id)return toast('اختر حسابًا','error');const j=(await all('journal')).filter(x=>x.status!=='مسودة'&&p10InRange(x,from,to)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));let bal=0;const rows=[];j.forEach(x=>(x.lines||[]).filter(l=>p10n(l.accountId)===id).forEach(l=>{bal+=p10n(l.debit)-p10n(l.credit);rows.push(`<tr><td>${esc(x.date)}</td><td>${esc(x.code)}</td><td>${esc(x.description||'')}</td><td>${money(l.debit)}</td><td>${money(l.credit)}</td><td>${money(bal)}</td></tr>`)}));document.getElementById('p10Result').innerHTML=`<table><thead><tr><th>التاريخ</th><th>المرجع</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="6" class="empty">لا توجد حركة</td></tr>'}</tbody></table>`;await p10Audit('عرض الأستاذ التفصيلي',String(id))}

async function p10Aging(type){const store=type==='customer'?'customers':'suppliers',invStore=type==='customer'?'salesInvoices':'purchaseInvoices',payStore=type==='customer'?'salesPayments':'purchasePayments';const [parties,inv,pay]=await Promise.all([all(store),all(invStore),all(payStore)]);const now=new Date();const rows=parties.map(p=>{const invoices=inv.filter(x=>p10n(x.partyId??x.customerId??x.supplierId)===p10n(p.id));const payments=pay.filter(x=>p10n(x.partyId)===p10n(p.id)).reduce((s,x)=>s+p10n(x.amount),0);let total=invoices.reduce((s,x)=>s+p10n(x.total),0)-payments;let b=[0,0,0,0];invoices.forEach(x=>{const age=Math.max(0,Math.floor((now-new Date(x.date||now))/86400000));const amount=p10n(x.total);if(age<=30)b[0]+=amount;else if(age<=60)b[1]+=amount;else if(age<=90)b[2]+=amount;else b[3]+=amount});return {name:p.name,total,b}});return rows}

const P11_STORES=['financialPeriods','openingBalances','periodClosings'];
async function p11EnsureStores(){ if(fallbackMode){P11_STORES.forEach(s=>{fallbackData[s]??=[]});return;} const missing=P11_STORES.filter(s=>!db.objectStoreNames.contains(s)); if(!missing.length)return; const v=(db.version||1)+1; db.close(); await new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,v);r.onupgradeneeded=e=>{const d=e.target.result;P11_STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true})})};r.onsuccess=e=>{db=e.target.result;resolve()};r.onerror=()=>reject(r.error)});}
function p11Range(d,f,t){d=String(d||'').slice(0,10);return (!f||d>=f)&&(!t||d<=t)}
